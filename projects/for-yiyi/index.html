    <style>
:root {
  --ink: rgba(255, 244, 228, 0.96);
  --ink-soft: rgba(214, 224, 245, 0.66);
  --gold: rgba(255, 214, 160, 0.9);
  --night: #02030a;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", Georgia, "Times New Roman", serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: var(--ink);
  font-family: var(--serif);
  -webkit-text-size-adjust: 100%;
}

.app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  /* The page is one gesture surface: no scrolling, no text selection, no tap flash. */
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.scene, .lines, .stage, .cover, .keepsake {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.scene { display: block; }

.lines { pointer-events: none; opacity: 0; }
.lines line { opacity: 0; stroke-linecap: round; transition: opacity 420ms ease-out; }
.lines line.is-in { opacity: 1; }
.line-glow { stroke: rgba(255, 206, 150, 0.26); stroke-width: 7; }
.line-core { stroke: rgba(255, 242, 222, 0.92); stroke-width: 1.4; }
.line-rubber { stroke: rgba(255, 242, 222, 0.6); stroke-width: 1.2; stroke-dasharray: 2 7; transition: none; }

/* Darkens the lower third so the words read over any part of the galaxy. */
.stage::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 46%;
  background: linear-gradient(to bottom, rgba(2, 3, 10, 0), rgba(2, 3, 10, 0.66));
  pointer-events: none;
  opacity: 0;
  transition: opacity 1200ms ease-out;
}
.app:not([data-state="cover"]) .stage::before { opacity: 1; }

.counter {
  position: absolute;
  top: calc(var(--safe-top) + 22px);
  left: 0;
  right: 0;
  margin: 0;
  text-align: center;
  font-size: 13px;
  letter-spacing: 0.32em;
  color: var(--ink-soft);
  opacity: 0;
  transition: opacity 300ms ease-in;
}
.counter.is-in { opacity: 1; transition: opacity 400ms ease-out; }

.beacons { position: absolute; inset: 0; pointer-events: none; }
.beacon {
  position: absolute;
  left: 0;
  top: 0;
  width: 68px;
  height: 68px;
  margin: -34px 0 0 -34px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  color: inherit;
  cursor: pointer;
  pointer-events: auto;
  will-change: transform;
}
.beacon:disabled { pointer-events: none; cursor: default; }
.beacon::after {
  content: "";
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  border: 1px solid rgba(255, 232, 200, 0.75);
  opacity: 0;
  transform: scale(0.6);
}
.beacon.is-next::after { animation: ring 1.5s ease-out infinite; }
.beacon:focus-visible { outline: 1px solid var(--gold); outline-offset: -8px; }

@keyframes ring {
  0% { opacity: 0.9; transform: scale(0.55); }
  100% { opacity: 0; transform: scale(1.5); }
}

.caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(var(--safe-bottom) + 15vh);
  height: 9.5em;
  font-size: clamp(17px, 1.1vw + 13px, 25px);
  pointer-events: none;
}
.caption-line {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: min(86vw, 24em);
  margin: 0;
  text-align: center;

  text-indent: 0.12em;
  text-shadow: 0 0 18px rgba(2, 3, 10, 0.95), 0 1px 3px rgba(2, 3, 10, 0.9);
  opacity: 0;
  transform: translate(-50%, 10px);
  transition: opacity 600ms ease-in, transform 600ms ease-in;
}
.caption-line.is-in {
  opacity: 1;
  transform: translate(-50%, 0);
  transition: opacity 900ms ease-out 250ms, transform 900ms ease-out 250ms;
}

.buttons, .keepsake-actions {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}
.buttons {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(var(--safe-bottom) + 5vh);
  padding: 0 20px;
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: opacity 250ms ease-in, transform 250ms ease-in;
}
.buttons.is-in {
  opacity: 1;
  transform: none;
  pointer-events: auto;
  transition: opacity 400ms ease-out, transform 400ms ease-out;
}

}
.answer.is-primary {

.mute {

  top: calc(var(--safe-top) + 10px);
  right: 12px;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--ink-soft);
  font-size: 18px;
  cursor: pointer;

.mute:hover { opacity: 1; }
.mute.is-muted { opacity: 0.35; text-decoration: line-through; }
.mute:focus-visible { outline: 1px solid var(--gold); }
.app[data-state="cover"] .mute { visibility: hidden; }

.cover {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  background: #000;
  cursor: pointer;
  transition: opacity 1400ms ease-in, visibility 0s linear 1400ms;
}
.cover.is-gone { opacity: 0; visibility: hidden; pointer-events: none; }
.cover-title {

  font-size: clamp(30px, 4vw + 16px, 56px);
  font-weight: 400;
  letter-spacing: 0.3em;
  text-indent: 0.3em;
}
.cover-hint {
  margin: 0;
  font-size: 14px;
  letter-spacing: 0.3em;
  text-indent: 0.3em;
  color: var(--ink-soft);
  animation: breathe 2.8s ease-in-out infinite;
}

@keyframes breathe {

}

.keepsake {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 20px);
  background: rgba(2, 3, 10, 0.86);
  opacity: 0;
  transition: opacity 300ms ease-out;
}
.keepsake[hidden] { display: none; }
.keepsake.is-in { opacity: 1; }
.keepsake-image {

  max-height: 66vh;

  -webkit-touch-callout: default;
  -webkit-user-select: auto;
  user-select: auto;
  touch-action: auto;
}
.keepsake-tip { margin: 0; font-size: 13px; letter-spacing: 0.2em; color: var(--ink-soft); }

.notice {
  position: fixed;
  left: 50%;
  top: 50%;
  z-index: 10;
  width: min(88vw, 30em);
  margin: 0;
  padding: 20px 22px;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(214, 224, 245, 0.3);
  border-radius: 12px;
  background: rgba(8, 10, 24, 0.94);
  color: var(--ink);
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
}
.notice[hidden] { display: none; }

@media (max-width: 420px) {
  .answer { min-width: 120px; padding: 0 20px; }
  .caption { bottom: calc(var(--safe-bottom) + 17vh); }
}

@media (max-height: 480px) {
  .caption { bottom: calc(var(--safe-bottom) + 76px); font-size: 16px; }

@media (prefers-reduced-motion: reduce) {
  .cover-hint, .beacon.is-next::after { animation: none; }
  .cover-hint { opacity: 0.9; }
  .beacon.is-next::after { opacity: 0.8; transform: scale(1); }
  .caption-line, .caption-line.is-in { transform: translate(-50%, 0); }
}

(function () {
'use strict';

// ---- src/config.js
// Every tunable number lives here. The words on screen are not here: they are in letter.json,
// which the build copies into the page as an editable JSON block.
const CONFIG = {
  galaxy: {
    radius: 100,
    coreRadius: 20,
    discScaleLength: 30,
    twist: 3.4,
    armSpread: 0.3,
    axisRatioInner: 0.82,
    axisRatioOuter: 0.92,
    omega0: 0.5,
    omegaCoreRadius: 14,
    armContrast: 0.95,
  },

  // Particle counts at density 1. `name` is the layer that later gathers into her name.
  population: { bulge: 26000, disc: 100000, young: 40000, hii: 600, dust: 2600, backdrop: 5000, name: 9000 },
  density: { phone: 0.55, desktop: 1 },

  look: {
    starSize: 1.0,
    starBrightness: 1.0,
    dustBrightness: 1.0,
    twinkle: 0.22,
    referenceDepth: 230,
    starMaxPointPx: 28,
    dustMaxPointFraction: 0.28,
    skyIntensity: 1.0,
    exposure: 1.0,
    bloom: 0.55,
    vignette: 0.42,
  },

  render: { maxPixelRatio: 2, maxPixelRatioPhone: 1.5, fov: 55, near: 1, far: 6000 },

  // Spherical camera poses around `target` (radius, polar from +Y, azimuth). `fitAspect`:
  // below this aspect ratio the camera backs off so the disc still fits a portrait screen.
  camera: {
    fitAspect: 1.0,
    targetY: 4,
    far: { radius: 1500, polar: 0.2, azimuth: -1.9 },
    stage: { radius: 268, polar: 1.09, azimuth: 0.5 },
    close: { radius: 236, polar: 1.09, azimuth: 0.5 },
    wide: { radius: 300, polar: 1.09, azimuth: 0.5 },
    sway: { azimuth: 0.05, polar: 0.018, period: 26 },
    parallax: { azimuth: 0.07, polar: 0.04, stiffness: 5 },
    // Cinematic moves, deliberately far longer than UI transitions.
    flyIn: 13.0,
    move: 2.6,
  },

  // Where the memory stars and the name sit, in normalised screen units of the stage pose
  // (x, y in [-1, 1], y up). The lower third stays free for the captions.
  stage: {
    // The stars zigzag between lowY and highY across [-spanX, spanX], Cassiopeia-like.
    spanX: 0.66,
    lowY: 0.32,
    highY: 0.6,
    jitter: [0.06, 0.07],
    // Layout stops widening beyond this aspect so the constellation does not sprawl.
    maxAspect: 1.25,
    name: { centerY: 0.46, widthFraction: 0.74, maxHeightFraction: 0.34, depthJitter: 3, pointPx: 3.2, glow: 0.9 },
    nameFont: 'italic 700 {size}px Georgia, "Times New Roman", "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif',
  },

  beacon: { sizePx: 54, litScale: 1.45, hitRadiusPx: 34, dragRadiusPx: 44 },

  timing: {
    lineIn: 0.9,
    lineHold: 2.6,
    lineOut: 0.6,
    memoryHold: 1.4,
    gather: 5.5,
    gatherSpread: 0.55,
    pulse: 3.6,
    answerDelay: 0.8,
    maxDelta: 0.1,
  },

  pulse: { width: 9, lift: 5, reach: 1.5 },

  audio: {
    master: 0.5,
    padGain: 0.16,
    padRoot: 110,
    padChord: [1, 1.5, 2, 2.5, 3],
    // Pentatonic steps (semitones above A4) for the five memory stars, low to high.
    chime: [0, 2, 4, 7, 9],
    chimeGain: 0.22,
    delayTime: 0.38,
    delayFeedback: 0.42,
  },

  keepsake: { width: 1080, height: 1440 },
};

// ---- src/rng.js
// Seeded generator (mulberry32) so a seed always rebuilds the same galaxy.
function createRng(seed) {
  let state = seed >>> 0;
  let spare = null;

  function next() {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function range(min, max) {
    return min + (max - min) * next();
  }

  // Box-Muller; the second value of each pair is kept for the next call.
  function gauss() {
    if (spare !== null) {
      const value = spare;
      spare = null;
      return value;
    }
    const radius = Math.sqrt(-2 * Math.log(1 - next()));
    const angle = 2 * Math.PI * next();
    spare = radius * Math.sin(angle);
    return radius * Math.cos(angle);
  }

  return { next, range, gauss };
}

// ---- src/starfield.js
// Builds the particle buffers. Pure data, no WebGL, so the page, the logic checks and the
// offline preview renderer all draw the very same numbers.

const TAU = Math.PI * 2;

// "2026-10-01" -> 20261001. The whole sky grows out of this number.
function seedFromDate(text) {
  const digits = String(text).replace(/[^0-9]/g, '');
  const seed = parseInt(digits, 10);
  return isFinite(seed) && seed > 0 ? seed >>> 0 : 20261001;
}

function createLayer(count) {
  return {
    count,
    orbit: new Float32Array(count * 3),
    color: new Float32Array(count * 3),
    params: new Float32Array(count * 4),
    cursor: 0,
  };
}

function put(layer, ox, oy, oz, r, g, b, size, seed, brightness, arm) {
  const i = layer.cursor++;
  layer.orbit[i * 3] = ox;
  layer.orbit[i * 3 + 1] = oy;
  layer.orbit[i * 3 + 2] = oz;
  layer.color[i * 3] = r;
  layer.color[i * 3 + 1] = g;
  layer.color[i * 3 + 2] = b;
  layer.params[i * 4] = size;
  layer.params[i * 4 + 1] = seed;
  layer.params[i * 4 + 2] = brightness;
  layer.params[i * 4 + 3] = arm;
}

// Radii for a disc whose surface density falls off as exp(-r / scale), kept inside [min, max].
function discRadius(rng, scale, min, max) {
  for (let attempt = 0; attempt < 32; attempt++) {
    const r = -scale * Math.log((1 - rng.next()) * (1 - rng.next()));
    if (r >= min && r <= max) return r;
  }
  return rng.range(min, max);
}

function mix(a, b, t) {
  return a + (b - a) * t;
}

function scaledCounts(population, density) {
  return {
    bulge: Math.round(population.bulge * density),
    disc: Math.round(population.disc * density),
    young: Math.round(population.young * density),
    hii: Math.round(population.hii * density),
    dust: Math.round(population.dust * density),
    // Thinning these two would be visible (a sparse sky, a ragged name), so they ignore density.
    backdrop: population.backdrop,
    name: population.name,
  };
}

function generateGalaxy(config, seed, density) {
  const g = config.galaxy;
  const counts = scaledCounts(config.population, density);
  const rng = createRng(seed);
  const R = g.radius;
  const core = g.coreRadius;

  const stars = createLayer(counts.bulge + counts.disc + counts.young + counts.hii);
  const dust = createLayer(counts.dust);
  const backdrop = createLayer(counts.backdrop);
  const name = createLayer(counts.name);
  // Filled by setNameTargets() once the letters have been sampled.
  name.target = new Float32Array(counts.name * 4);

  // Bulge: old, warm stars in a flattened spheroid.
  for (let i = 0; i < counts.bulge; i++) {
    const a = Math.min(core * 0.4 * Math.sqrt(-2 * Math.log(1 - rng.next())), core * 1.7);
    const y = rng.gauss() * core * 0.24;
    const warmth = rng.next();
    put(stars, a, rng.next() * TAU, y,
      1.0, mix(0.48, 0.7, warmth), mix(0.15, 0.36, warmth),
      rng.range(0.4, 0.9), rng.next(), rng.range(0.06, 0.14), 0);
  }

  // Disc: the bulk of the stars, warm white near the core, cool white outside.
  for (let i = 0; i < counts.disc; i++) {
    const a = discRadius(rng, g.discScaleLength, 2, R * 1.25);
    const t = Math.min(a / R, 1);
    const y = rng.gauss() * (1.0 + 0.9 * t);
    const jitter = rng.range(-0.08, 0.08);
    let r = mix(1.0, 0.62, t) + jitter;
    let gr = mix(0.76, 0.78, t);
    let b = mix(0.45, 1.0, t) - jitter;
    let size = rng.range(0.3, 0.8);
    let brightness = rng.range(0.14, 0.38);
    if (rng.next() > 0.992) {
      // Rare giants give the eye single stars to follow as the disc turns.
      size *= 2.6;
      brightness = 1.0;
      if (rng.next() > 0.5) { r = 1.0; gr = 0.55; b = 0.3; }
    }
    put(stars, a, rng.next() * TAU, y, r, gr, b, size, rng.next(), brightness, 0.25);
  }

  // Young blue stars: only visible while they cross a spiral arm.
  for (let i = 0; i < counts.young; i++) {
    const a = discRadius(rng, 27, core * 0.6, R * 1.15);
    const cool = rng.next();
    put(stars, a, rng.next() * TAU, rng.gauss() * 0.7,
      mix(0.3, 0.7, cool), mix(0.55, 0.85, cool), 1.0,
      rng.range(0.4, 1.2), rng.next(), rng.range(0.16, 0.5), 1);
  }

  // HII regions: pink star-forming knots strung along the arms.
  for (let i = 0; i < counts.hii; i++) {
    const a = discRadius(rng, 30, core * 0.8, R * 1.05);
    const violet = rng.next();
    put(stars, a, rng.next() * TAU, rng.gauss() * 0.5,
      1.0, mix(0.2, 0.34, violet), mix(0.42, 0.8, violet),
      rng.range(1.8, 3.4), rng.next(), rng.range(0.35, 0.7), 1);
  }

  // Gas: large soft sprites that turn the arms into continuous glowing lanes.
  for (let i = 0; i < counts.dust; i++) {
    const a = discRadius(rng, 25, 3, R * 1.1);
    const t = Math.min(a / R, 1);
    const inner = Math.max(0, 1 - a / (core * 1.2));
    const violet = rng.next();
    put(dust, a, rng.next() * TAU, rng.gauss() * (1.2 + t),
      mix(mix(0.08, 0.42, violet * violet), 1.0, inner),
      mix(mix(0.34, 0.14, violet * violet), 0.5, inner),
      mix(mix(1.0, 0.8, violet * violet), 0.2, inner),
      rng.range(9, 20), rng.next(), rng.range(0.03, 0.06), 0.85 * (1 - inner));
  }

  // Backdrop: fixed far stars. Here `orbit` holds a real direction-scaled position.
  for (let i = 0; i < counts.backdrop; i++) {
    const z = rng.range(-1, 1);
    const angle = rng.next() * TAU;
    const ring = Math.sqrt(1 - z * z);
    const distance = rng.range(2200, 3000);
    const tint = rng.next();
    const magnitude = Math.pow(rng.next(), 5);
    put(backdrop, ring * Math.cos(angle) * distance, z * distance, ring * Math.sin(angle) * distance,
      mix(0.7, 1.0, tint), mix(0.8, 0.9, tint), mix(1.0, 0.75, tint),
      1.6 + magnitude * 2.6, rng.next(), 0.25 + magnitude * 0.75, 0);
  }

  // Name layer: ordinary-looking disc stars until they are called away. They come from all
  // over the disc so the gathering visibly drains light out of the whole galaxy.
  for (let i = 0; i < counts.name; i++) {
    const a = discRadius(rng, g.discScaleLength, core * 0.5, R * 1.1);
    const t = Math.min(a / R, 1);
    put(name, a, rng.next() * TAU, rng.gauss() * (0.8 + 0.6 * t),
      mix(1.0, 0.7, t), mix(0.78, 0.8, t), mix(0.55, 1.0, t),
      rng.range(0.4, 0.9), rng.next(), rng.range(0.18, 0.4), 0.4);
  }

  return { stars, dust, backdrop, name, counts };
}

// `shape`: { points: Float32Array of x,y pairs in units of the text width, y up, centred }.
// `place`: world-space frame of the name { center, right, up, forward, width, depthJitter }.
function setNameTargets(layer, shape, place, seed) {
  const rng = createRng(seed ^ 0x5bd1e995);
  const available = shape.points.length / 2;
  for (let i = 0; i < layer.count; i++) {
    // Walking the samples in order (wrapping) keeps the coverage even when there are fewer
    // samples than particles.
    const k = available > 0 ? i % available : 0;
    const x = available > 0 ? shape.points[k * 2] * place.width : 0;
    const y = available > 0 ? shape.points[k * 2 + 1] * place.width : 0;
    const z = rng.gauss() * place.depthJitter;
    layer.target[i * 4] = place.center[0] + place.right[0] * x + place.up[0] * y + place.forward[0] * z;
    layer.target[i * 4 + 1] = place.center[1] + place.right[1] * x + place.up[1] * y + place.forward[1] * z;
    layer.target[i * 4 + 2] = place.center[2] + place.right[2] * x + place.up[2] * y + place.forward[2] * z;
    layer.target[i * 4 + 3] = available > 0 ? 1 : 0;
  }
  return layer.target;
}

// Plain uniform values derived from the config; renderer.js and the preview tool both start
// from these.
function orbitUniformValues(config) {
  const g = config.galaxy;
  const look = config.look;
  return {
    uTime: 0,
    uClock: 0,
    uTwist: g.twist,
    uArmSpread: g.armSpread,
    uCoreRadius: g.coreRadius,
    uRadius: g.radius,
    uAxisInner: g.axisRatioInner,
    uAxisOuter: g.axisRatioOuter,
    uOmega0: g.omega0,
    uOmegaCore: g.omegaCoreRadius,
    uArmContrast: g.armContrast,
    uTwinkle: look.twinkle,
    uRefDepth: look.referenceDepth,
    uGatherSpread: config.timing.gatherSpread,
  };
}

// World-space sprite sizes become pixels through this factor divided by view depth.
function pixelScale(drawingBufferHeight, fovDegrees) {
  return drawingBufferHeight / (2 * Math.tan((fovDegrees * Math.PI) / 360));
}

// Radius, strength and width of the ripple `age` seconds after it started, written into `out`
// (called every frame, so it must not allocate). A negative age means no ripple.
function pulseState(config, age, out) {
  const p = config.pulse;
  const duration = config.timing.pulse;
  out[0] = -1000;
  out[1] = 0;
  out[2] = p.width;
  if (age < 0 || age >= duration) return out;
  const t = age / duration;
  // Fast attack, long tail: the wavefront decelerates as it spreads.
  const envelope = Math.sin(Math.PI * Math.min(t * 6, 1) * 0.5) * (1 - t);
  out[0] = (1 - (1 - t) * (1 - t)) * config.galaxy.radius * p.reach;
  out[1] = p.lift * envelope;
  return out;
}

// ---- src/camera.js
// Scripted camera: named spherical poses, eased moves between them, a slow sway and a small
// pointer parallax. Also owns the "stage plane" used to place the memory stars and the name,
// so what is laid out in screen units ends up at the right spot in the world.

function easeOutCubic(t) {
  const u = 1 - t;
  return 1 - u * u * u;
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function clamp01(t) {
  return t < 0 ? 0 : t > 1 ? 1 : t;
}

// Column-major, like WebGL expects.
function perspective(out, fovDegrees, aspect, near, far) {
  const f = 1 / Math.tan((fovDegrees * Math.PI) / 360);
  out.fill(0);
  out[0] = f / aspect;
  out[5] = f;
  out[10] = (far + near) / (near - far);
  out[11] = -1;
  out[14] = (2 * far * near) / (near - far);
  return out;
}

function createCamera(config) {
  const cam = config.camera;
  const fov = config.render.fov;
  const tanHalf = Math.tan((fov * Math.PI) / 360);

  const view = new Float32Array(16);
  const proj = new Float32Array(16);
  const eye = new Float32Array(3);
  const right = new Float32Array(3);
  const up = new Float32Array(3);
  const forward = new Float32Array(3);
  const target = new Float32Array([0, cam.targetY, 0]);
  // Frame of the stage pose, frozen: layout must not wobble with the sway.
  const stageRight = new Float32Array(3);
  const stageUp = new Float32Array(3);
  const stageForward = new Float32Array(3);

  let aspect = 1;
  const from = { radius: 0, polar: 0, azimuth: 0 };
  const to = { radius: 0, polar: 0, azimuth: 0 };
  const now = { radius: 0, polar: 0, azimuth: 0 };
  let moveTime = 0;
  let moveDuration = 0;
  let moveEase = easeInOutCubic;
  const pointer = { x: 0, y: 0, sx: 0, sy: 0 };

  function fit() {
    return Math.max(1, cam.fitAspect / aspect);
  }

  function copyPose(dst, src) {
    dst.radius = src.radius;
    dst.polar = src.polar;
    dst.azimuth = src.azimuth;
  }

  // Writes the camera frame for a pose into the given arrays; `eyeOut` may be null.
  function frame(radius, polar, azimuth, eyeOut, r, u, f) {
    const sp = Math.sin(polar);
    const dx = sp * Math.sin(azimuth);
    const dy = Math.cos(polar);
    const dz = sp * Math.cos(azimuth);
    if (eyeOut) {
      eyeOut[0] = target[0] + radius * dx;
      eyeOut[1] = target[1] + radius * dy;
      eyeOut[2] = target[2] + radius * dz;
    }
    f[0] = -dx; f[1] = -dy; f[2] = -dz;
    // right = forward x worldUp, normalised; poses never look straight down, so it exists.
    const rl = Math.hypot(f[2], f[0]) || 1;
    r[0] = -f[2] / rl; r[1] = 0; r[2] = f[0] / rl;
    u[0] = r[1] * f[2] - r[2] * f[1];
    u[1] = r[2] * f[0] - r[0] * f[2];
    u[2] = r[0] * f[1] - r[1] * f[0];
  }

  function writeView() {
    view[0] = right[0]; view[4] = right[1]; view[8] = right[2];
    view[1] = up[0]; view[5] = up[1]; view[9] = up[2];
    view[2] = -forward[0]; view[6] = -forward[1]; view[10] = -forward[2];
    view[3] = 0; view[7] = 0; view[11] = 0;
    view[12] = -(right[0] * eye[0] + right[1] * eye[1] + right[2] * eye[2]);
    view[13] = -(up[0] * eye[0] + up[1] * eye[1] + up[2] * eye[2]);
    view[14] = forward[0] * eye[0] + forward[1] * eye[1] + forward[2] * eye[2];
    view[15] = 1;
  }

  function setAspect(value) {
    aspect = value > 0 ? value : 1;
    perspective(proj, fov, aspect, config.render.near, config.render.far);
    frame(1, cam.stage.polar, cam.stage.azimuth, null, stageRight, stageUp, stageForward);
  }

  function jumpTo(name) {
    copyPose(now, cam[name]);
    copyPose(to, now);
    moveDuration = 0;
  }

  function moveTo(name, duration, ease) {
    copyPose(from, now);
    copyPose(to, cam[name]);
    moveTime = 0;
    moveDuration = duration;
    moveEase = ease || easeInOutCubic;
  }

  function moving() {
    return moveDuration > 0 && moveTime < moveDuration;
  }

  // Pointer position in [-1, 1]; the camera leans a little toward it.
  function setPointer(x, y) {
    pointer.x = x;
    pointer.y = y;
  }

  function update(dt, clock, calm) {
    if (moveDuration > 0) {
      moveTime = Math.min(moveTime + dt, moveDuration);
      const k = moveEase(clamp01(moveTime / moveDuration));
      // Radius in log space: a dolly across a 6x distance otherwise spends its whole time far away.
      now.radius = Math.exp(Math.log(from.radius) + (Math.log(to.radius) - Math.log(from.radius)) * k);
      now.polar = from.polar + (to.polar - from.polar) * k;
      now.azimuth = from.azimuth + (to.azimuth - from.azimuth) * k;
    }
    const follow = 1 - Math.exp(-cam.parallax.stiffness * dt);
    pointer.sx += (pointer.x - pointer.sx) * follow;
    pointer.sy += (pointer.y - pointer.sy) * follow;

    const swing = calm ? 0 : 1;
    const phase = (clock / cam.sway.period) * Math.PI * 2;
    const azimuth = now.azimuth + swing * (cam.sway.azimuth * Math.sin(phase) - cam.parallax.azimuth * pointer.sx);
    const polar = now.polar + swing * (cam.sway.polar * Math.sin(phase * 0.7 + 1.3) - cam.parallax.polar * pointer.sy);
    frame(now.radius * fit(), polar, azimuth, eye, right, up, forward);
    writeView();
  }

  // World point -> CSS-normalised screen position (0..1, y down) in out[0..1]. Returns false
  // when the point is behind the camera.
  function project(x, y, z, out) {
    const vx = view[0] * x + view[4] * y + view[8] * z + view[12];
    const vy = view[1] * x + view[5] * y + view[9] * z + view[13];
    const vz = view[2] * x + view[6] * y + view[10] * z + view[14];
    if (vz > -config.render.near) return false;
    out[0] = 0.5 + (0.5 * proj[0] * vx) / -vz;
    out[1] = 0.5 - (0.5 * proj[5] * vy) / -vz;
    return true;
  }

  // Half extents of the plane through the target, facing the stage pose. `layoutHalfWidth`
  // stops growing on very wide screens so the constellation does not sprawl.
  function stageExtent() {
    const halfHeight = cam.stage.radius * fit() * tanHalf;
    const halfWidth = halfHeight * aspect;
    return {
      halfHeight,
      halfWidth,
      layoutHalfWidth: Math.min(halfWidth, halfHeight * config.stage.maxAspect),
    };
  }

  // World position of a point given in world units along the stage plane's right / up axes.
  function stagePoint(x, y, out) {
    out[0] = target[0] + stageRight[0] * x + stageUp[0] * y;
    out[1] = target[1] + stageRight[1] * x + stageUp[1] * y;
    out[2] = target[2] + stageRight[2] * x + stageUp[2] * y;
    return out;
  }

  setAspect(1);
  jumpTo('far');
  update(0, 0, true);

  return {
    view, proj, eye, right, up, forward, tanHalf,
    stageRight, stageUp, stageForward,
    get aspect() { return aspect; },
    get pose() { return now; },
    setAspect, jumpTo, moveTo, moving, setPointer, update, project, stageExtent, stagePoint,
  };
}

// ---- src/layout.js
// Turns the screen-space layout of the stage (memory stars, the name) into world positions.

// Positions of `count` memory stars, written into `out` (xyz triples). The rng is rebuilt on
// every call, so a resize moves the stars with the screen but never reshuffles them.
function layoutBeacons(config, camera, seed, count, out) {
  const stage = config.stage;
  const extent = camera.stageExtent();
  const rng = createRng(seed ^ 0x2545f491);
  const point = new Float32Array(3);
  for (let i = 0; i < count; i++) {
    const t = count > 1 ? i / (count - 1) : 0.5;
    const nx = (t * 2 - 1) * stage.spanX + rng.range(-1, 1) * stage.jitter[0];
    const ny = (i % 2 === 0 ? stage.lowY : stage.highY) + rng.range(-1, 1) * stage.jitter[1];
    camera.stagePoint(nx * extent.layoutHalfWidth, ny * extent.halfHeight, point);
    out[i * 3] = point[0];
    out[i * 3 + 1] = point[1];
    out[i * 3 + 2] = point[2];
  }
  return out;
}

// Where the name hangs: as wide as the layout allows, unless that would make it too tall.
function placeName(config, camera, shapeAspect) {
  const name = config.stage.name;
  const extent = camera.stageExtent();
  let width = name.widthFraction * 2 * extent.layoutHalfWidth;
  const maxHeight = name.maxHeightFraction * 2 * extent.halfHeight;
  if (shapeAspect > 0 && width * shapeAspect > maxHeight) width = maxHeight / shapeAspect;
  return {
    center: camera.stagePoint(0, name.centerY * extent.halfHeight, new Float32Array(3)),
    right: camera.stageRight,
    up: camera.stageUp,
    forward: camera.stageForward,
    width,
    depthJitter: name.depthJitter,
  };
}

// ---- src/name-shape.js
// Samples the outline-filled shape of a piece of text into points, so particles can gather
// into it. The text is drawn with whatever font the device has; nothing is downloaded.

// `data`: bytes of a w*h image, coverage at data[i * stride + offset]. Returns points as x,y
// pairs in units of the shape's width, centred, y up, plus the shape's height / width.
function shapeFromMask(data, w, h, count, rng, stride, offset) {
  stride = stride || 1;
  offset = offset || 0;
  let minX = w, maxX = -1, minY = h, maxY = -1;
  let filled = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * stride + offset] > 127) {
        filled++;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (filled === 0) return { points: new Float32Array(0), aspect: 0 };

  const cells = new Uint32Array(filled);
  let n = 0;
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      if (data[(y * w + x) * stride + offset] > 127) cells[n++] = y * w + x;
    }
  }
  const width = maxX - minX + 1;
  const height = maxY - minY + 1;
  const cx = minX + width / 2;
  const cy = minY + height / 2;
  const points = new Float32Array(count * 2);
  for (let i = 0; i < count; i++) {
    const cell = cells[Math.min(filled - 1, Math.floor(rng.next() * filled))];
    const px = (cell % w) + rng.next();
    const py = Math.floor(cell / w) + rng.next();
    points[i * 2] = (px - cx) / width;
    points[i * 2 + 1] = -(py - cy) / width;
  }
  return { points, aspect: height / width };
}

function sampleText(doc, text, fontTemplate, count, rng) {
  const W = 1024;
  const H = 384;
  const canvas = doc.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  if (!ctx) return { points: new Float32Array(0), aspect: 0 };

  // Measure at a reference size, then scale so the text fills the canvas with a margin.
  const reference = 200;
  ctx.font = fontTemplate.replace('{size}', String(reference));
  const measured = Math.max(ctx.measureText(text).width, 1);
  const size = Math.floor(Math.min(reference * ((W * 0.9) / measured), H * 0.62));
  ctx.clearRect(0, 0, W, H);
  ctx.font = fontTemplate.replace('{size}', String(size));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(text, W / 2, H / 2);
  return shapeFromMask(ctx.getImageData(0, 0, W, H).data, W, H, count, rng, 4, 3);
}

// ---- src/shaders.js
// GLSL ES 3.00 for raw WebGL2. No preprocessing happens to these strings, so
// tools/render_preview.py compiles exactly what the browser will.

const HEADER = `#version 300 es
precision highp float;
`;

// Stars, gas and the name layer share this shader. aOrbit is not a position: it packs the
// orbit (semi-major axis, starting phase, height above the disc).
const ORBIT_VERT = HEADER + `
uniform mat4 uView;
uniform mat4 uProj;
uniform float uTime;
uniform float uClock;
uniform float uTwist;
uniform float uArmSpread;
uniform float uCoreRadius;
uniform float uRadius;
uniform float uAxisInner;
uniform float uAxisOuter;
uniform float uOmega0;
uniform float uOmegaCore;
uniform float uArmContrast;
uniform float uTwinkle;
uniform float uPixelScale;
uniform float uRefDepth;
uniform float uSizeScale;
uniform float uBrightness;
uniform float uMaxPoint;
uniform float uDim;          // dims everything that is not part of the name
uniform float uGather;       // 0: galaxy, 1: the name layer has gathered into letters
uniform float uGatherSpread; // how staggered the departures are
uniform float uNamePx;       // sprite size of a gathered particle, in device pixels
uniform float uNameGlow;
uniform vec3 uPulse;         // x: wavefront radius, y: strength, z: width

in vec3 aOrbit;
in vec3 aColor;
in vec4 aParams; // x: size, y: random seed, z: brightness, w: how much it lights up inside an arm
in vec4 aTarget; // xyz: place in the name, w: 1 for name particles, 0 otherwise

out vec3 vColor;
out float vAlpha;

float hash2(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float valueNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash2(i), hash2(i + vec2(1.0, 0.0)), f.x),
             mix(hash2(i + vec2(0.0, 1.0)), hash2(i + vec2(1.0, 1.0)), f.x), f.y);
}

float axisRatio(float a) {
  if (a < uCoreRadius) return mix(1.0, uAxisInner, a / uCoreRadius);
  if (a < uRadius) return mix(uAxisInner, uAxisOuter, (a - uCoreRadius) / (uRadius - uCoreRadius));
  return mix(uAxisOuter, 1.0, clamp((a - uRadius) / uRadius, 0.0, 1.0));
}

void main() {
  float a = aOrbit.x;
  float seed = aParams.y;

  // Flat rotation curve: inner stars lap the outer ones.
  float omega = uOmega0 * uOmegaCore / sqrt(a * a + uOmegaCore * uOmegaCore);
  float phi = aOrbit.y + omega * uTime;

  vec2 ellipse = vec2(a * cos(phi), a * axisRatio(a) * sin(phi));
  // Logarithmic twist keeps the pitch of the arms constant; the jitter widens them into bands.
  float jitter = fract(seed * 7.31) + fract(seed * 3.17) - 1.0;
  float theta = -uTwist * log(max(a, 0.5) / uCoreRadius) + jitter * uArmSpread;
  float c = cos(theta);
  float s = sin(theta);
  vec3 p = vec3(ellipse.x * c - ellipse.y * s, aOrbit.z, ellipse.x * s + ellipse.y * c);

  // Ellipses crowd where sin(2 phi) = 1: that is the crest of the density wave.
  float crest = 0.5 + 0.5 * sin(2.0 * phi);
  float inArm = 0.05 + 1.6 * crest * crest * crest * crest;
  float clumps = 0.3 + 1.4 * valueNoise(p.xz * 0.085 + 31.0);
  float armLight = mix(1.0, inArm * clumps, aParams.w * uArmContrast);

  float d = (length(p.xz) - uPulse.x) / uPulse.z;
  float wave = exp(-d * d) * uPulse.y;
  p.y += wave * (0.6 + 0.8 * seed);
  p.xz *= 1.0 + wave * 0.006;

  float twinkle = 1.0 + uTwinkle * sin(uClock * (1.2 + 4.0 * seed) + seed * 97.0);

  // Name particles leave one after another (ordered by their seed) and ease into place.
  float g = clamp(uGather * (1.0 + uGatherSpread) - seed * uGatherSpread, 0.0, 1.0) * aTarget.w;
  g = g * g * (3.0 - 2.0 * g);
  float arc = sin(g * 3.14159265);
  // They keep breathing once in place so the letters never look frozen.
  vec3 home = aTarget.xyz + 0.45 * vec3(sin(uClock * (0.5 + seed) + seed * 40.0),
                                        cos(uClock * (0.4 + 1.3 * seed) + seed * 17.0),
                                        sin(uClock * (0.3 + 0.7 * seed) + seed * 63.0));
  float turn = (1.0 - g) * g * 2.4;
  vec3 swirl = vec3(p.x * cos(turn) - p.z * sin(turn), p.y, p.x * sin(turn) + p.z * cos(turn));
  p = mix(swirl, home, g);
  p.y += arc * (6.0 + 22.0 * fract(seed * 5.7));

  vec4 mv = uView * vec4(p, 1.0);
  float depth = max(-mv.z, 0.001);
  float px = aParams.x * uSizeScale * uPixelScale / depth;

  // Sub-pixel sprites dim instead of flickering; oversized ones fade out before they turn
  // into full-screen overdraw.
  float small = clamp(px / 1.5, 0.0, 1.0);
  float big = 1.0 - smoothstep(0.6 * uMaxPoint, uMaxPoint, px);
  float nearFade = smoothstep(1.5, 8.0, depth);
  float crowding = pow(clamp(depth / uRefDepth, 0.02, 1.0), 1.5);
  float galaxyAlpha = aParams.z * uBrightness * armLight * twinkle * (1.0 + wave * 0.45)
                    * small * small * big * nearFade * crowding * uDim;

  float nameAlpha = uNameGlow * (0.55 + 0.45 * fract(seed * 9.13)) * twinkle * (1.0 + wave * 0.3);
  // In flight they flare a little, like sparks.
  nameAlpha *= 1.0 + 1.2 * arc;

  vColor = mix(aColor, mix(vec3(1.0, 0.80, 0.62), vec3(1.0, 0.72, 0.86), fract(seed * 3.3)), g * 0.85);
  vAlpha = mix(galaxyAlpha, nameAlpha, g);

  gl_PointSize = mix(clamp(px, 1.5, uMaxPoint), uNamePx * (0.7 + 0.6 * fract(seed * 4.1)), g);
  gl_Position = uProj * mv;
  if (vAlpha <= 0.0005) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
}
`;

// uSoft 0: tight stellar core. uSoft 1: wide falloff for gas.
const SPRITE_FRAG = HEADER + `
uniform float uSoft;

in vec3 vColor;
in float vAlpha;

out vec4 outColor;

void main() {
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(uv, uv);
  if (r2 > 1.0) discard;
  float edge = 1.0 - r2;
  float star = exp(-r2 * 6.0) * edge;
  float cloud = edge * edge * edge;
  outColor = vec4(vColor, vAlpha * mix(star, cloud, uSoft));
}
`;

// Distant stars: fixed screen size, no orbit. Drawn with SPRITE_FRAG.
const BACKDROP_VERT = HEADER + `
uniform mat4 uView;
uniform mat4 uProj;
uniform float uClock;
uniform float uTwinkle;
uniform float uPointScale;
uniform float uBrightness;

in vec3 aOrbit; // a real position for this layer
in vec3 aColor;
in vec4 aParams; // x: size in CSS px, y: random seed, z: brightness

out vec3 vColor;
out float vAlpha;

void main() {
  float seed = aParams.y;
  float twinkle = 1.0 + uTwinkle * sin(uClock * (0.8 + 3.0 * seed) + seed * 91.0);
  vColor = aColor;
  vAlpha = aParams.z * uBrightness * twinkle;
  gl_PointSize = max(aParams.x * uPointScale, 1.5);
  // The view matrix is applied without its translation so the backdrop stays at infinity.
  gl_Position = uProj * vec4(mat3(uView) * aOrbit, 1.0);
}
`;

// The memory stars: a few large sprites with a four-point flare.
const BEACON_VERT = HEADER + `
uniform mat4 uView;
uniform mat4 uProj;
uniform float uClock;
uniform float uSizePx;
uniform float uLitScale;
uniform float uShow;

in vec3 aPos;
in vec3 aState; // x: lit 0..1, y: flash 0..1 (decays after a tap), z: phase offset

out vec3 vColor;
out float vAlpha;
out float vLit;

void main() {
  float lit = aState.x;
  float flash = aState.y;
  // Unlit stars breathe to invite a tap; lit ones hold steady.
  float breathe = 0.5 + 0.5 * sin(uClock * 2.1 + aState.z * 6.2831853);
  float invite = (1.0 - lit) * breathe;
  vColor = mix(vec3(0.62, 0.78, 1.0), vec3(1.0, 0.80, 0.52), lit);
  vAlpha = uShow * (0.55 + 0.35 * invite + 0.75 * lit + 1.6 * flash);
  vLit = lit;
  gl_PointSize = uSizePx * uShow * (0.72 + 0.14 * invite + (uLitScale - 0.72) * lit + 0.6 * flash);
  gl_Position = uProj * uView * vec4(aPos, 1.0);
}
`;

const BEACON_FRAG = HEADER + `
in vec3 vColor;
in float vAlpha;
in float vLit;

out vec4 outColor;

void main() {
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(uv, uv);
  if (r2 > 1.0) discard;
  float edge = (1.0 - r2) * (1.0 - r2);
  float core = exp(-r2 * 46.0) * 2.2;
  float halo = exp(-r2 * 7.0) * 0.5;
  // Thin horizontal and vertical rays; they grow once the star is lit.
  float rays = exp(-abs(uv.y) * 46.0) * exp(-abs(uv.x) * 3.2) + exp(-abs(uv.x) * 46.0) * exp(-abs(uv.y) * 3.2);
  float shape = (core + halo + rays * (0.25 + 0.75 * vLit)) * edge;
  outColor = vec4(vColor, vAlpha * shape);
}
`;

// One triangle that covers the screen.
const SCREEN_VERT = HEADER + `
out vec2 vUv;

void main() {
  vec2 corner = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = corner;
  gl_Position = vec4(corner * 2.0 - 1.0, 0.0, 1.0);
}
`;

// Faint drifting nebulosity so the background is never a flat black.
const SKY_FRAG = HEADER + `
uniform vec3 uCamRight;
uniform vec3 uCamUp;
uniform vec3 uCamForward;
uniform vec2 uTanHalf;
uniform float uClock;
uniform float uIntensity;

in vec2 vUv;

out vec4 outColor;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 x) {
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash(i), hash(i + vec3(1.0, 0.0, 0.0)), f.x),
        mix(hash(i + vec3(0.0, 1.0, 0.0)), hash(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
    mix(mix(hash(i + vec3(0.0, 0.0, 1.0)), hash(i + vec3(1.0, 0.0, 1.0)), f.x),
        mix(hash(i + vec3(0.0, 1.0, 1.0)), hash(i + vec3(1.0, 1.0, 1.0)), f.x), f.y),
    f.z);
}

float fbm(vec3 p) {
  float value = 0.0;
  float amplitude = 0.5;
  for (int i = 0; i < 5; i++) {
    value += amplitude * noise(p);
    p = p * 2.03 + 11.5;
    amplitude *= 0.5;
  }
  return value;
}

void main() {
  vec2 ndc = vUv * 2.0 - 1.0;
  vec3 dir = normalize(uCamForward + uCamRight * ndc.x * uTanHalf.x + uCamUp * ndc.y * uTanHalf.y);
  vec3 drift = vec3(uClock * 0.004, 0.0, uClock * 0.0025);
  float broad = fbm(dir * 2.2 + drift);
  float fine = fbm(dir * 4.6 - drift * 1.7 + 7.0);
  float cloud = smoothstep(0.42, 0.8, broad);
  vec3 tint = mix(vec3(0.050, 0.018, 0.085), vec3(0.010, 0.040, 0.075), fine);
  vec3 color = vec3(0.0035, 0.0045, 0.011) + cloud * tint;
  outColor = vec4(color * uIntensity, 1.0);
}
`;

// HDR scene -> screen: bloom from the scene's own mip chain, exposure, ACES, vignette, gamma.
const COMPOSITE_FRAG = HEADER + `
uniform sampler2D uScene;
uniform vec2 uTexel;     // size of one level-0 texel in uv
uniform float uBloom;
uniform float uExposure;
uniform float uVignette;
uniform float uFade;     // 0: black, 1: scene

in vec2 vUv;

out vec4 outColor;

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

// Four bilinear taps half a texel apart turn the mip's box filter into a tent, which hides
// the blockiness of sampling a mip level directly.
vec3 tent(float level) {
  vec2 o = uTexel * exp2(level) * 0.5;
  return 0.25 * (textureLod(uScene, vUv + vec2(o.x, o.y), level).rgb +
                 textureLod(uScene, vUv + vec2(-o.x, o.y), level).rgb +
                 textureLod(uScene, vUv + vec2(o.x, -o.y), level).rgb +
                 textureLod(uScene, vUv + vec2(-o.x, -o.y), level).rgb);
}

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}

void main() {
  vec3 color = textureLod(uScene, vUv, 0.0).rgb;
  vec3 bloom = tent(2.0) * 0.30 + tent(3.0) * 0.26 + tent(4.0) * 0.20 + tent(5.0) * 0.14 + tent(6.0) * 0.10;
  color = (color + bloom * uBloom) * uExposure;

  vec2 q = vUv * 2.0 - 1.0;
  color *= 1.0 - uVignette * smoothstep(0.35, 1.5, dot(q, q));

  color = pow(aces(color), vec3(1.0 / 2.2));
  // One LSB of noise hides banding in the dark gradients.
  color += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
  outColor = vec4(max(color, 0.0) * uFade, 1.0);
}
`;

// ---- src/renderer.js
// Raw WebGL2 renderer: sky, galaxy layers and memory stars into an HDR target, then one
// composite pass (bloom, tone mapping) to the screen. No library: the page must open from
// disk with no network.

const ORBIT_ATTRIBUTES = ['aOrbit', 'aColor', 'aParams', 'aTarget'];
const BEACON_ATTRIBUTES = ['aPos', 'aState'];
// Deepest mip the bloom reads; generateMipmap stops there.
const BLOOM_MAX_LEVEL = 6;

function createRenderer(canvas, config) {
  const gl = canvas.getContext('webgl2', {
    antialias: false, alpha: false, depth: false, stencil: false,
    powerPreference: 'high-performance', preserveDrawingBuffer: false,
  });
  if (!gl) throw new Error('WebGL2 is not available');

  const owned = { programs: [], buffers: [], vaos: [], textures: [], framebuffers: [] };

  function compile(type, source, label) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS) && !gl.isContextLost()) {
      throw new Error(label + ' shader: ' + gl.getShaderInfoLog(shader));
    }
    return shader;
  }

  function createProgram(label, vertexSource, fragmentSource, attributes) {
    const program = gl.createProgram();
    const vs = compile(gl.VERTEX_SHADER, vertexSource, label + ' vertex');
    const fs = compile(gl.FRAGMENT_SHADER, fragmentSource, label + ' fragment');
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    // Fixed locations let every layer's vertex array work with the same program.
    for (let i = 0; i < attributes.length; i++) gl.bindAttribLocation(program, i, attributes[i]);
    gl.linkProgram(program);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS) && !gl.isContextLost()) {
      throw new Error(label + ' program: ' + gl.getProgramInfoLog(program));
    }
    const uniforms = {};
    const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS) || 0;
    for (let i = 0; i < count; i++) {
      const info = gl.getActiveUniform(program, i);
      if (info) uniforms[info.name] = gl.getUniformLocation(program, info.name);
    }
    owned.programs.push(program);
    return { program, uniforms };
  }

  const orbit = createProgram('orbit', ORBIT_VERT, SPRITE_FRAG, ORBIT_ATTRIBUTES);
  const backdropProgram = createProgram('backdrop', BACKDROP_VERT, SPRITE_FRAG, ORBIT_ATTRIBUTES);
  const beacon = createProgram('beacon', BEACON_VERT, BEACON_FRAG, BEACON_ATTRIBUTES);
  const sky = createProgram('sky', SCREEN_VERT, SKY_FRAG, []);
  const composite = createProgram('composite', SCREEN_VERT, COMPOSITE_FRAG, []);

  // Uniforms that never change after start-up.
  gl.useProgram(orbit.program);
  const fixed = orbitUniformValues(config);
  for (const name in fixed) gl.uniform1f(orbit.uniforms[name], fixed[name]);
  gl.useProgram(backdropProgram.program);
  gl.uniform1f(backdropProgram.uniforms.uBrightness, 1);
  gl.useProgram(beacon.program);
  gl.uniform1f(beacon.uniforms.uLitScale, config.beacon.litScale);
  gl.useProgram(composite.program);
  gl.uniform1i(composite.uniforms.uScene, 0);

  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  // Layers without a target buffer read this constant: w = 0 keeps them out of the name.
  gl.vertexAttrib4f(3, 0, 0, 0, 0);

  const pointRange = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE) || [1, 64];
  const maxPointSize = pointRange[1];

  function createBuffer(data, usage) {
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, data, usage);
    owned.buffers.push(buffer);
    return buffer;
  }

  function attribute(location, buffer, size) {
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.enableVertexAttribArray(location);
    gl.vertexAttribPointer(location, size, gl.FLOAT, false, 0, 0);
  }

  function createLayer(layer) {
    const vao = gl.createVertexArray();
    owned.vaos.push(vao);
    gl.bindVertexArray(vao);
    attribute(0, createBuffer(layer.orbit, gl.STATIC_DRAW), 3);
    attribute(1, createBuffer(layer.color, gl.STATIC_DRAW), 3);
    attribute(2, createBuffer(layer.params, gl.STATIC_DRAW), 4);
    let targetBuffer = null;
    if (layer.target) {
      targetBuffer = createBuffer(layer.target, gl.DYNAMIC_DRAW);
      attribute(3, targetBuffer, 4);
    }
    gl.bindVertexArray(null);
    return { vao, count: layer.count, targetBuffer };
  }

  const emptyVao = gl.createVertexArray();
  owned.vaos.push(emptyVao);

  let layers = null;
  let beaconVao = null;
  let beaconPositions = null;
  let beaconStates = null;
  let beaconCount = 0;

  function setGalaxy(data) {
    layers = {
      stars: createLayer(data.stars),
      dust: createLayer(data.dust),
      backdrop: createLayer(data.backdrop),
      name: createLayer(data.name),
    };
  }

  function updateNameTargets(target) {
    gl.bindBuffer(gl.ARRAY_BUFFER, layers.name.targetBuffer);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, target);
  }

  // `positions`: xyz per memory star. Call again after a resize; the buffers are reused.
  function setBeacons(positions) {
    const count = positions.length / 3;
    if (!beaconVao || count !== beaconCount) {
      beaconCount = count;
      beaconVao = gl.createVertexArray();
      owned.vaos.push(beaconVao);
      gl.bindVertexArray(beaconVao);
      beaconPositions = createBuffer(positions, gl.DYNAMIC_DRAW);
      attribute(0, beaconPositions, 3);
      beaconStates = createBuffer(new Float32Array(count * 3), gl.DYNAMIC_DRAW);
      attribute(1, beaconStates, 3);
      gl.bindVertexArray(null);
      return;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, beaconPositions);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, positions);
  }

  // ---- render target ---------------------------------------------------------------------
  const sceneTexture = gl.createTexture();
  const sceneTarget = gl.createFramebuffer();
  owned.textures.push(sceneTexture);
  owned.framebuffers.push(sceneTarget);
  const floatTarget = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
  let hdr = floatTarget;
  let width = 0;
  let height = 0;
  let pixelRatio = 1;

  function allocate(useFloat) {
    gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
    if (useFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, width, height, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAX_LEVEL, BLOOM_MAX_LEVEL);
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneTarget);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTexture, 0);
    const complete = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return complete;
  }

  // Sizes the canvas and the scene target. Returns true when something changed.
  function resize(cssWidth, cssHeight, ratio) {
    const w = Math.max(1, Math.round(cssWidth * ratio));
    const h = Math.max(1, Math.round(cssHeight * ratio));
    if (w === width && h === height) return false;
    width = w;
    height = h;
    pixelRatio = ratio;
    canvas.width = w;
    canvas.height = h;
    // Some phones advertise float targets and still refuse them; 8 bits clip but work.
    if (hdr && !allocate(true)) hdr = false;
    if (!hdr) allocate(false);
    return true;
  }

  function drawLayer(layer) {
    gl.bindVertexArray(layer.vao);
    gl.drawArrays(gl.POINTS, 0, layer.count);
  }

  // `frame` is a plain object the caller reuses every frame; see main.js for its fields.
  function draw(frame) {
    const camera = frame.camera;
    const look = config.look;

    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneTarget);
    gl.viewport(0, 0, width, height);
    gl.disable(gl.BLEND);

    gl.useProgram(sky.program);
    gl.uniform3fv(sky.uniforms.uCamRight, camera.right);
    gl.uniform3fv(sky.uniforms.uCamUp, camera.up);
    gl.uniform3fv(sky.uniforms.uCamForward, camera.forward);
    gl.uniform2f(sky.uniforms.uTanHalf, camera.tanHalf * camera.aspect, camera.tanHalf);
    gl.uniform1f(sky.uniforms.uClock, frame.clock);
    gl.uniform1f(sky.uniforms.uIntensity, look.skyIntensity);
    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.enable(gl.BLEND);

    if (layers) {
      gl.useProgram(backdropProgram.program);
      gl.uniformMatrix4fv(backdropProgram.uniforms.uView, false, camera.view);
      gl.uniformMatrix4fv(backdropProgram.uniforms.uProj, false, camera.proj);
      gl.uniform1f(backdropProgram.uniforms.uClock, frame.clock);
      gl.uniform1f(backdropProgram.uniforms.uTwinkle, frame.twinkle);
      gl.uniform1f(backdropProgram.uniforms.uPointScale, pixelRatio);
      gl.uniform1f(backdropProgram.uniforms.uSoft, 0);
      drawLayer(layers.backdrop);

      const u = orbit.uniforms;
      gl.useProgram(orbit.program);
      gl.uniformMatrix4fv(u.uView, false, camera.view);
      gl.uniformMatrix4fv(u.uProj, false, camera.proj);
      gl.uniform1f(u.uTime, frame.time);
      gl.uniform1f(u.uClock, frame.clock);
      gl.uniform1f(u.uTwinkle, frame.twinkle);
      gl.uniform1f(u.uPixelScale, pixelScale(height, config.render.fov));
      gl.uniform1f(u.uDim, frame.dim);
      gl.uniform1f(u.uGather, frame.gather);
      gl.uniform1f(u.uNamePx, Math.min(config.stage.name.pointPx * pixelRatio, maxPointSize));
      gl.uniform1f(u.uNameGlow, frame.nameGlow);
      gl.uniform3fv(u.uPulse, frame.pulse);

      gl.uniform1f(u.uSizeScale, 1);
      gl.uniform1f(u.uBrightness, look.dustBrightness);
      gl.uniform1f(u.uSoft, 1);
      gl.uniform1f(u.uMaxPoint, Math.min(look.dustMaxPointFraction * height, maxPointSize));
      drawLayer(layers.dust);

      gl.uniform1f(u.uSizeScale, look.starSize);
      gl.uniform1f(u.uBrightness, look.starBrightness);
      gl.uniform1f(u.uSoft, 0);
      gl.uniform1f(u.uMaxPoint, Math.min(look.starMaxPointPx * pixelRatio, maxPointSize));
      drawLayer(layers.stars);
      drawLayer(layers.name);
    }

    if (beaconVao && frame.beaconShow > 0.001) {
      gl.useProgram(beacon.program);
      gl.uniformMatrix4fv(beacon.uniforms.uView, false, camera.view);
      gl.uniformMatrix4fv(beacon.uniforms.uProj, false, camera.proj);
      gl.uniform1f(beacon.uniforms.uClock, frame.clock);
      gl.uniform1f(beacon.uniforms.uShow, frame.beaconShow);
      gl.uniform1f(beacon.uniforms.uSizePx, Math.min(config.beacon.sizePx * pixelRatio, maxPointSize / 2));
      gl.bindVertexArray(beaconVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, beaconStates);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, frame.beaconState);
      gl.drawArrays(gl.POINTS, 0, beaconCount);
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, width, height);
    gl.disable(gl.BLEND);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.useProgram(composite.program);
    gl.uniform2f(composite.uniforms.uTexel, 1 / width, 1 / height);
    gl.uniform1f(composite.uniforms.uBloom, look.bloom);
    gl.uniform1f(composite.uniforms.uExposure, look.exposure * frame.exposure);
    gl.uniform1f(composite.uniforms.uVignette, look.vignette);
    gl.uniform1f(composite.uniforms.uFade, frame.fade);
    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  }

  function dispose() {
    owned.vaos.forEach((vao) => gl.deleteVertexArray(vao));
    owned.buffers.forEach((buffer) => gl.deleteBuffer(buffer));
    owned.textures.forEach((texture) => gl.deleteTexture(texture));
    owned.framebuffers.forEach((framebuffer) => gl.deleteFramebuffer(framebuffer));
    owned.programs.forEach((program) => gl.deleteProgram(program));
    layers = null;
    beaconVao = null;
  }

  return {
    gl, canvas,
    get hdr() { return hdr; },
    get width() { return width; },
    get height() { return height; },
    get pixelRatio() { return pixelRatio; },
    setGalaxy, updateNameTargets, setBeacons, resize, draw, dispose,
  };
}

// ---- src/audio.js
// Everything you hear is synthesised here with WebAudio: no audio files. Nothing is created
// before start(), which main.js calls from the first tap (browsers refuse audio before that).
// Without WebAudio every method quietly does nothing.

function createAudio(config) {
  const A = config.audio;
  const Ctor = typeof window !== 'undefined' ? window.AudioContext || window.webkitAudioContext : null;
  let ctx = null;
  let master = null;
  let wet = null;
  let pad = null;
  let muted = false;

  // Safe to call from every user gesture: the first call builds the graph, later ones only
  // wake a context the browser left suspended.
  function start() {
    if (ctx) {
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      return;
    }
    if (!Ctor) return;
    try {
      ctx = new Ctor();
    } catch (error) {
      ctx = null;
      return;
    }
    master = ctx.createGain();
    master.gain.value = muted ? 0 : A.master;
    master.connect(ctx.destination);

    // A feedback delay stands in for reverb: cheap, and it makes single notes feel far away.
    const delay = ctx.createDelay(1);
    delay.delayTime.value = A.delayTime;
    const feedback = ctx.createGain();
    feedback.gain.value = A.delayFeedback;
    const damp = ctx.createBiquadFilter();
    damp.type = 'lowpass';
    damp.frequency.value = 2400;
    wet = ctx.createGain();
    wet.gain.value = 0.5;
    wet.connect(delay);
    delay.connect(damp);
    damp.connect(feedback);
    feedback.connect(delay);
    damp.connect(master);
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
  }

  // The bed under everything: a slow major chord through a breathing low-pass.
  function startPad() {
    if (!ctx || pad) return;
    const now = ctx.currentTime;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 520;
    filter.Q.value = 0.6;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(A.padGain, now + 6);
    filter.connect(gain);
    gain.connect(master);
    gain.connect(wet);

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.07;
    const depth = ctx.createGain();
    depth.gain.value = 180;
    lfo.connect(depth);
    depth.connect(filter.frequency);
    lfo.start(now);

    const voices = [lfo];
    A.padChord.forEach((ratio, i) => {
      // Two slightly detuned oscillators per note beat slowly against each other.
      [-4, 5].forEach((cents) => {
        const osc = ctx.createOscillator();
        osc.type = i === 0 ? 'sine' : 'triangle';
        osc.frequency.value = A.padRoot * ratio;
        osc.detune.value = cents + i * 1.5;
        const level = ctx.createGain();
        level.gain.value = 0.5 / (1 + i * 0.6);
        osc.connect(level);
        level.connect(filter);
        osc.start(now);
        voices.push(osc);
      });
    });
    pad = { filter, gain, voices };
  }

  function note(frequency, when, duration, level) {
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.exponentialRampToValueAtTime(level, when + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    gain.connect(master);
    gain.connect(wet);
    // A bell is a sine plus a few quiet, slightly inharmonic partials.
    [[1, 1], [2, 0.28], [3.01, 0.1]].forEach((partial) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = frequency * partial[0];
      const part = ctx.createGain();
      part.gain.value = partial[1];
      osc.connect(part);
      part.connect(gain);
      osc.start(when);
      osc.stop(when + duration + 0.05);
    });
  }

  function pitch(semitones) {
    return 440 * Math.pow(2, semitones / 12);
  }

  function chime(index) {
    if (!ctx) return;
    const steps = A.chime;
    note(pitch(steps[index % steps.length]), ctx.currentTime, 2.6, A.chimeGain);
  }

  function arpeggio(steps, spacing, level, duration) {
    if (!ctx) return;
    const now = ctx.currentTime;
    steps.forEach((step, i) => note(pitch(step), now + i * spacing, duration, level));
  }

  // Opens the pad's filter for `seconds`, then lets it settle a little brighter than before.
  function brighten(peak, rest, seconds) {
    if (!ctx || !pad) return;
    const now = ctx.currentTime;
    const f = pad.filter.frequency;
    f.cancelScheduledValues(now);
    f.setValueAtTime(f.value, now);
    f.linearRampToValueAtTime(peak, now + seconds * 0.6);
    f.linearRampToValueAtTime(rest, now + seconds * 1.6);
  }

  const cues = {
    pad: startPad,
    chime,
    complete: () => arpeggio(A.chime, 0.09, A.chimeGain * 0.8, 3),
    swell: () => brighten(2600, 900, config.timing.gather),
    yes: () => {
      brighten(4200, 1300, 3);
      arpeggio([0, 4, 7, 12, 16, 19, 24], 0.11, A.chimeGain, 4.5);
    },
    later: () => arpeggio([7, 4, 0], 0.5, A.chimeGain * 0.6, 3.5),
  };

  function play(name, arg) {
    if (!ctx || !cues[name]) return;
    cues[name](arg);
  }

  function setMuted(value) {
    muted = !!value;
    if (!ctx) return;
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(muted ? 0 : A.master, now + 0.15);
  }

  // A hidden tab should not keep humming.
  function setSuspended(value) {
    if (!ctx) return;
    if (value && ctx.suspend) ctx.suspend();
    else if (!value && ctx.resume) ctx.resume();
  }

  function dispose() {
    if (!ctx) return;
    if (pad) pad.voices.forEach((voice) => voice.stop());
    pad = null;
    if (ctx.close) ctx.close();
    ctx = null;
  }

  return {
    get available() { return !!Ctor; },
    get muted() { return muted; },
    start, play, setMuted, setSuspended, dispose,
  };
}

// ---- src/story.js
// The confession as a state machine. Pure logic: no DOM, no WebGL, no audio. It is driven by
// update(dt) and by intents, and talks to the outside only through `hooks`, so the whole
// experience can be stepped deterministically in a test.
//
//   cover -> intro -> memories -> connect -> naming -> question -> yes
//                                                               \-> later -> question

const STATES = ['cover', 'intro', 'memories', 'connect', 'naming', 'question', 'yes', 'later'];

// "2026-10-01" -> "2026 年 10 月 1 日"; anything else is shown as written.
function formatDate(text) {
  const m = /^(\d{4})\D+(\d{1,2})\D+(\d{1,2})$/.exec(String(text).trim());
  if (!m) return String(text);
  return m[1] + ' 年 ' + parseInt(m[2], 10) + ' 月 ' + parseInt(m[3], 10) + ' 日';
}

function approach(value, target, rate, dt) {
  return value + (target - value) * (1 - Math.exp(-rate * dt));
}

function createStory(config, letter, seed, hooks) {
  const T = config.timing;
  const count = letter.memories.length;

  const story = {
    state: 'cover',
    stateTime: 0,
    // Read by the renderer every frame.
    fade: 0,
    beaconShow: 0,
    gather: 0,
    dim: 1,
    nameGlow: config.stage.name.glow,
    exposure: 1,
    pulseAge: -1,
    lines: 0,          // opacity of the constellation lines
    flow: 1,           // multiplier on the galaxy's rotation speed
    beaconState: new Float32Array(count * 3),
    lit: new Array(count).fill(false),
    connected: 0,      // how many stars are joined, in order
    gathering: false,
    answered: null,
    calm: false,
  };

  const target = { fade: 0, beaconShow: 0, dim: 1, lines: 0, flow: 1, exposure: 1 };
  for (let i = 0; i < count; i++) story.beaconState[i * 3 + 2] = i / count;

  // ---- captions: one timed queue ----------------------------------------------------------
  let queue = [];
  let wait = 0;
  let shownFor = 0;
  let pending = null; // what happens when the current wait runs out

  function fill(text) {
    return String(text)
      .replace(/\{name\}/g, letter.name)
      .replace(/\{date\}/g, formatDate(letter.date))
      .replace(/\{dateMeaning\}/g, letter.dateMeaning)
      .replace(/\{seed\}/g, String(seed))
      .replace(/\{today\}/g, formatDate(hooks.today()));
  }

  // Long lines stay up longer: roughly six characters a second, never under lineHold.
  function holdFor(text) {
    return Math.max(T.lineHold, text.replace(/\s/g, '').length * 0.17);
  }

  function clearQueue() {
    queue = [];
    pending = null;
    wait = 0;
  }

  function nextLine() {
    const step = queue.shift();
    if (!step) return;
    hooks.caption(step.text);
    shownFor = 0;
    wait = T.lineIn + holdFor(step.text);
    pending = () => {
      if (step.stay) {
        pending = null;
        if (step.done) step.done();
        return;
      }
      hooks.caption(null);
      wait = T.lineOut;
      pending = () => {
        pending = null;
        // `done` only exists on the last line and may start a queue of its own.
        if (step.done) step.done();
        else nextLine();
      };
    };
  }

  // Shows `lines` one after another. With `stay` the last one remains on screen; `done` runs
  // once the last line has had its reading time.
  function say(lines, stay, done) {
    clearQueue();
    const list = [].concat(lines).map(fill);
    queue = list.map((text, i) => ({
      text,
      stay: !!stay && i === list.length - 1,
      done: i === list.length - 1 ? done : null,
    }));
    nextLine();
  }

  function enter(state) {
    story.state = state;
    story.stateTime = 0;
    hooks.state(state);
  }

  // ---- states -----------------------------------------------------------------------------
  function begin() {
    if (story.state !== 'cover') return;
    startIntro();
  }

  function startIntro() {
    enter('intro');
    target.fade = 1;
    target.dim = 1;
    target.flow = 1;
    hooks.sound('pad');
    hooks.camera('far', 0);
    hooks.camera('stage', story.calm ? 0.01 : config.camera.flyIn, easeOutCubic);
    hooks.buttons(null);
    hooks.counter(null);
    say(letter.intro, false, startMemories);
  }

  function startMemories() {
    enter('memories');
    target.beaconShow = 1;
    hooks.caption(fill(letter.memoriesPrompt));
    hooks.counter('0 / ' + count);
    hooks.beacons(true);
  }

  function litCount() {
    let n = 0;
    for (let i = 0; i < count; i++) if (story.lit[i]) n++;
    return n;
  }

  function tapBeacon(index) {
    if (index < 0 || index >= count) return;
    if (story.state === 'connect') {
      connect(index);
      return;
    }
    if (story.state !== 'memories') return;
    story.lit[index] = true;
    story.beaconState[index * 3 + 1] = 1;
    hooks.sound('chime', index);
    hooks.counter(litCount() + ' / ' + count);
    // Once every star is lit, whichever memory is on screen gets its full reading time and
    // then the story moves on; tapping a star again to reread simply restarts that wait.
    const all = litCount() === count;
    say([letter.memories[index]], true, all ? () => { wait = T.memoryHold; pending = startConnect; } : null);
  }

  function startConnect() {
    if (story.state !== 'memories') return;
    enter('connect');
    hooks.counter(null);
    hooks.camera('close', config.camera.move);
    target.lines = 1;
    say(letter.connectPrompt, true, null);
  }

  // Joins star `index` if it is the next one in line. Called for taps and while dragging.
  function connect(index) {
    if (story.state !== 'connect' || index !== story.connected) return false;
    story.connected++;
    story.beaconState[index * 3 + 1] = 1;
    hooks.sound('chime', index);
    if (story.connected === count) {
      hooks.sound('complete');
      for (let i = 0; i < count; i++) story.beaconState[i * 3 + 1] = 1;
      clearQueue();
      wait = 1.1;
      pending = startNaming;
    }
    return true;
  }

  function startNaming() {
    enter('naming');
    hooks.beacons(false);
    hooks.camera('wide', config.camera.move * 2);
    say(letter.naming, false, () => {
      story.gathering = true;
      hooks.sound('swell');
    });
  }

  function startQuestion(skipLead) {
    enter('question');
    story.answered = null;
    target.dim = 0.42;
    target.flow = 0.6;
    const lines = skipLead ? letter.question.slice(-1) : letter.question;
    say(lines, true, () => {
      wait = T.answerDelay;
      pending = () => {
        pending = null;
        hooks.buttons([
          { id: 'yes', label: letter.answers.yes, primary: true },
          { id: 'later', label: letter.answers.later },
        ]);
      };
    });
  }

  function answer(id) {
    if (story.state !== 'question' || story.answered) return;
    story.answered = id;
    hooks.buttons(null);
    if (id === 'yes') {
      enter('yes');
      target.dim = 0.85;
      target.flow = 1.6;
      if (!story.calm) {
        story.pulseAge = 0;
        story.exposure = 1.9;
      }
      hooks.sound('yes');
      say(letter.yes, true, () => {
        hooks.buttons([
          { id: 'keepsake', label: letter.keepsake.button, primary: true },
          { id: 'replay', label: letter.buttons.replay },
        ]);
      });
    } else {
      enter('later');
      target.dim = 0.7;
      target.flow = 0.8;
      hooks.sound('later');
      say(letter.later, true, () => {
        hooks.buttons([
          { id: 'ready', label: letter.buttons.ready, primary: true },
          { id: 'replay', label: letter.buttons.replay },
        ]);
      });
    }
  }

  // "我想好了": straight back to the question itself, without the lead-in.
  function ready() {
    if (story.state !== 'later') return;
    hooks.buttons(null);
    startQuestion(true);
  }

  function replay() {
    if (story.state === 'cover') return;
    clearQueue();
    hooks.caption(null);
    hooks.buttons(null);
    hooks.counter(null);
    hooks.beacons(false);
    story.gathering = false;
    story.gather = 0;
    story.connected = 0;
    story.answered = null;
    story.pulseAge = -1;
    story.fade = 0;
    story.lines = 0;
    story.beaconShow = 0;
    target.lines = 0;
    target.beaconShow = 0;
    for (let i = 0; i < count; i++) {
      story.lit[i] = false;
      story.beaconState[i * 3] = 0;
      story.beaconState[i * 3 + 1] = 0;
    }
    startIntro();
  }

  // A tap on the empty sky: hurry the current line along, but never one that was only just
  // shown (a double tap must not swallow a sentence).
  function advance() {
    if (story.state === 'cover') {
      begin();
      return;
    }
    if (pending && wait > 0 && shownFor > 0.6 && story.state !== 'connect') wait = 0;
  }

  function update(dt) {
    story.stateTime += dt;
    shownFor += dt;
    if (pending) {
      wait -= dt;
      if (wait <= 0) pending();
    }

    story.fade = approach(story.fade, target.fade, 0.9, dt);
    story.beaconShow = approach(story.beaconShow, target.beaconShow, 2.2, dt);
    story.dim = approach(story.dim, target.dim, 1.4, dt);
    story.flow = approach(story.flow, target.flow, 1.2, dt);
    story.exposure = approach(story.exposure, target.exposure, 1.6, dt);

    if (story.gathering) {
      story.gather = Math.min(1, story.gather + dt / T.gather);
      // The constellation dissolves into the name as the stars arrive.
      target.lines = 0;
      target.beaconShow = 0;
      target.dim = 0.42;
      if (story.gather >= 1) {
        story.gathering = false;
        startQuestion(false);
      }
    }
    story.lines = approach(story.lines, target.lines, 2.5, dt);

    if (story.pulseAge >= 0) {
      story.pulseAge += dt;
      if (story.pulseAge >= T.pulse) story.pulseAge = -1;
    }

    for (let i = 0; i < count; i++) {
      const lit = story.lit[i] ? 1 : 0;
      story.beaconState[i * 3] = approach(story.beaconState[i * 3], lit, 6, dt);
      story.beaconState[i * 3 + 1] = approach(story.beaconState[i * 3 + 1], 0, 2.4, dt);
    }
  }

  story.begin = begin;
  story.advance = advance;
  story.tapBeacon = tapBeacon;
  story.connect = connect;
  story.answer = answer;
  story.ready = ready;
  story.replay = replay;
  story.update = update;
  return story;
}

// ---- src/ui.js
// DOM overlay: cover, captions, answer buttons, the tappable memory stars, the constellation
// lines (SVG) and the keepsake sheet. It turns raw pointer and key events into intents and
// never touches the story's state itself.

const SVG_NS = 'http://www.w3.org/2000/svg';

function createUi(dom, letter, memoryCount, intents) {
  const doc = dom.root.ownerDocument;
  const listeners = [];

  function listen(target, type, handler, options) {
    target.addEventListener(type, handler, options);
    listeners.push(() => target.removeEventListener(type, handler, options));
  }

  // ---- cover ------------------------------------------------------------------------------
  dom.coverTitle.textContent = letter.cover.title;
  dom.coverHint.textContent = letter.cover.hint;

  function hideCover() {
    dom.cover.classList.add('is-gone');
    dom.cover.setAttribute('aria-hidden', 'true');
  }

  // `click`, not `pointerdown`: on touch screens only the end of a tap counts as the user
  // gesture that lets audio start.
  listen(dom.cover, 'click', () => intents.begin());

  // ---- captions: two stacked lines cross-fade, so text never pops ---------------------------
  const lines = [dom.captionA, dom.captionB];
  let front = 0;

  function caption(text) {
    lines[front].classList.remove('is-in');
    if (text === null || text === undefined) return;
    front = 1 - front;
    lines[front].textContent = text;
    lines[front].classList.add('is-in');
  }

  function counter(text) {
    dom.counter.textContent = text || '';
    dom.counter.classList.toggle('is-in', !!text);
  }

  // ---- answer buttons ---------------------------------------------------------------------
  function buttons(list) {
    while (dom.buttons.firstChild) dom.buttons.removeChild(dom.buttons.firstChild);
    dom.buttons.classList.toggle('is-in', !!list);
    if (!list) return;
    list.forEach((item) => {
      const button = doc.createElement('button');
      button.type = 'button';
      button.className = item.primary ? 'answer is-primary' : 'answer';
      button.textContent = item.label;
      button.dataset.answer = item.id;
      dom.buttons.appendChild(button);
    });
  }

  listen(dom.buttons, 'click', (event) => {
    const button = event.target.closest('button[data-answer]');
    if (button) intents.answer(button.dataset.answer);
  });

  // ---- memory stars: real buttons over the glowing sprites ---------------------------------
  const beaconButtons = [];
  const beaconX = new Float32Array(memoryCount).fill(-1e6);
  const beaconY = new Float32Array(memoryCount).fill(-1e6);
  for (let i = 0; i < memoryCount; i++) {
    const button = doc.createElement('button');
    button.type = 'button';
    button.className = 'beacon';
    button.dataset.beacon = String(i);
    button.setAttribute('aria-label', '第 ' + (i + 1) + ' 颗星');
    button.disabled = true;
    dom.beacons.appendChild(button);
    beaconButtons.push(button);
  }

  function setBeaconsEnabled(enabled) {
    beaconButtons.forEach((button) => { button.disabled = !enabled; });
    dom.beacons.classList.toggle('is-in', enabled);
  }

  // Screen position in CSS pixels. Skips the style write while the star has not moved.
  function placeBeacon(index, x, y) {
    if (Math.abs(x - beaconX[index]) < 0.25 && Math.abs(y - beaconY[index]) < 0.25) return;
    beaconX[index] = x;
    beaconY[index] = y;
    beaconButtons[index].style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
  }

  function markBeacon(index, lit) {
    beaconButtons[index].classList.toggle('is-lit', lit);
  }

  // Rings the star she should reach for next; -1 clears it.
  function hintBeacon(index) {
    beaconButtons.forEach((button, i) => button.classList.toggle('is-next', i === index));
  }

  listen(dom.beacons, 'click', (event) => {
    const button = event.target.closest('button[data-beacon]');
    if (button) intents.beacon(parseInt(button.dataset.beacon, 10));
  });

  // ---- constellation lines ----------------------------------------------------------------
  function makeLine(className) {
    const line = doc.createElementNS(SVG_NS, 'line');
    line.setAttribute('class', className);
    dom.lines.appendChild(line);
    return line;
  }

  const segments = [];
  for (let i = 0; i < memoryCount - 1; i++) {
    segments.push({ glow: makeLine('line-glow'), core: makeLine('line-core'), shown: false });
  }
  const rubber = makeLine('line-rubber');
  let rubberShown = false;

  function setCoordinates(line, x1, y1, x2, y2) {
    line.setAttribute('x1', x1.toFixed(1));
    line.setAttribute('y1', y1.toFixed(1));
    line.setAttribute('x2', x2.toFixed(1));
    line.setAttribute('y2', y2.toFixed(1));
  }

  // Segment i joins star i and star i + 1.
  function setSegment(index, shown, x1, y1, x2, y2) {
    const segment = segments[index];
    if (shown) {
      setCoordinates(segment.glow, x1, y1, x2, y2);
      setCoordinates(segment.core, x1, y1, x2, y2);
    }
    if (shown !== segment.shown) {
      segment.shown = shown;
      segment.glow.classList.toggle('is-in', shown);
      segment.core.classList.toggle('is-in', shown);
    }
  }

  function setRubber(shown, x1, y1, x2, y2) {
    if (shown) setCoordinates(rubber, x1, y1, x2, y2);
    if (shown !== rubberShown) {
      rubberShown = shown;
      rubber.classList.toggle('is-in', shown);
    }
  }

  let linesOpacity = -1;
  function setLinesOpacity(value) {
    const rounded = Math.round(value * 50) / 50;
    if (rounded === linesOpacity) return;
    linesOpacity = rounded;
    dom.lines.style.opacity = String(rounded);
  }

  // ---- pointer and keys -> intents --------------------------------------------------------
  let dragging = false;

  function onButton(event) {
    return !!(event.target && event.target.closest && event.target.closest('button, a'));
  }

  listen(dom.root, 'pointerdown', (event) => {
    if (event.button !== undefined && event.button > 0) return;
    dragging = true;
    intents.dragStart(event.clientX, event.clientY);
    if (!onButton(event)) intents.tap();
  });
  listen(dom.root, 'pointermove', (event) => {
    intents.pointer(event.clientX, event.clientY);
    if (dragging) intents.drag(event.clientX, event.clientY);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    intents.dragEnd();
  }
  listen(dom.root, 'pointerup', endDrag);
  listen(dom.root, 'pointercancel', endDrag);
  listen(dom.root, 'pointerleave', endDrag);

  listen(doc, 'keydown', (event) => {
    if (event.repeat || onButton(event)) return;
    if (event.code === 'Space' || event.code === 'Enter') {
      event.preventDefault();
      intents.key();
    } else if (event.code === 'KeyM') {
      intents.toggleMute();
    }
  });

  listen(dom.mute, 'click', () => intents.toggleMute());

  function setMuted(muted) {
    dom.mute.setAttribute('aria-pressed', muted ? 'true' : 'false');
    dom.mute.classList.toggle('is-muted', muted);
  }

  // ---- keepsake sheet ---------------------------------------------------------------------
  let keepsakeUrl = null;
  dom.keepsakeTip.textContent = letter.keepsake.tip;
  dom.keepsakeSave.textContent = letter.keepsake.button;
  dom.keepsakeClose.textContent = letter.buttons.close;

  function releaseKeepsake() {
    if (keepsakeUrl && keepsakeUrl.indexOf('blob:') === 0) URL.revokeObjectURL(keepsakeUrl);
    keepsakeUrl = null;
  }

  function showKeepsake(url, fileName) {
    releaseKeepsake();
    keepsakeUrl = url;
    dom.keepsakeImage.src = url;
    dom.keepsakeSave.href = url;
    dom.keepsakeSave.setAttribute('download', fileName);
    dom.keepsake.hidden = false;
    // The class goes on a frame later so the sheet's entrance transition actually runs.
    requestAnimationFrame(() => dom.keepsake.classList.add('is-in'));
  }

  function hideKeepsake() {
    dom.keepsake.classList.remove('is-in');
    dom.keepsake.hidden = true;
    dom.keepsakeImage.removeAttribute('src');
    releaseKeepsake();
  }

  listen(dom.keepsakeClose, 'click', hideKeepsake);

  function notice(text) {
    dom.notice.textContent = text || '';
    dom.notice.hidden = !text;
  }

  function dispose() {
    listeners.forEach((remove) => remove());
    listeners.length = 0;
    releaseKeepsake();
    beaconButtons.forEach((button) => button.remove());
    segments.forEach((segment) => { segment.glow.remove(); segment.core.remove(); });
    rubber.remove();
  }

  return {
    hideCover, caption, counter, buttons,
    setBeaconsEnabled, placeBeacon, markBeacon, hintBeacon,
    setSegment, setRubber, setLinesOpacity,
    setMuted, showKeepsake, hideKeepsake, notice, dispose,
  };
}

// ---- src/keepsake.js
// Composes the star map she can keep: the frame that is on screen right now, the constellation
// drawn over it, and the two dates. Plain 2D canvas; nothing leaves the device.

// How a source of sw x sh is scaled and shifted to cover a W x H image. `focusY` is the part
// of the source (0 top, 1 bottom) that should stay in view when the crop is vertical.
function coverFit(sw, sh, W, H, focusY) {
  const scale = Math.max(W / sw, H / sh);
  const dx = (W - sw * scale) / 2;
  const overflow = sh * scale - H;
  const dy = -Math.min(Math.max(focusY * sh * scale - H / 2, 0), overflow);
