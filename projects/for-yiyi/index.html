  return { scale, dx, dy };
}

// `scene`: the WebGL canvas, drawn in the same task so its buffer is still valid.
// `stars`: screen positions in CSS pixels [x0, y0, x1, y1, ...]; `view`: CSS size of the scene.
function renderKeepsake(doc, scene, config, text, stars, view) {
  const landscape = view.width > view.height;
  const W = landscape ? config.keepsake.height : config.keepsake.width;
  const H = landscape ? config.keepsake.width : config.keepsake.height;
  const canvas = doc.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  if (!ctx) return null;

  ctx.fillStyle = '#02030a';
  ctx.fillRect(0, 0, W, H);
  const fit = coverFit(view.width, view.height, W, H, 0.42);
  ctx.drawImage(scene, fit.dx, fit.dy, view.width * fit.scale, view.height * fit.scale);

  // The constellation, faint: by now its stars have dissolved into the name.
  const count = stars.length / 2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255, 226, 190, 0.34)';
  ctx.lineWidth = Math.max(1.5, W / 540);
  ctx.beginPath();
  for (let i = 0; i < count; i++) {
    const x = fit.dx + stars[i * 2] * fit.scale;
    const y = fit.dy + stars[i * 2 + 1] * fit.scale;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  for (let i = 0; i < count; i++) {
    const x = fit.dx + stars[i * 2] * fit.scale;
    const y = fit.dy + stars[i * 2 + 1] * fit.scale;
    const glow = ctx.createRadialGradient(x, y, 0, x, y, W / 60);
    glow.addColorStop(0, 'rgba(255, 240, 215, 0.95)');
    glow.addColorStop(0.25, 'rgba(255, 214, 160, 0.35)');
    glow.addColorStop(1, 'rgba(255, 214, 160, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, W / 60, 0, Math.PI * 2);
    ctx.fill();
  }

  // A scrim so the lettering reads over any part of the galaxy.
  const scrim = ctx.createLinearGradient(0, H * 0.62, 0, H);
  scrim.addColorStop(0, 'rgba(2, 3, 10, 0)');
  scrim.addColorStop(1, 'rgba(2, 3, 10, 0.88)');
  ctx.fillStyle = scrim;
  ctx.fillRect(0, H * 0.62, W, H * 0.38);

  const unit = Math.min(W, H) / 1080;
  const serif = 'Georgia, "Times New Roman", "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(255, 244, 228, 0.96)';
  ctx.font = '600 ' + Math.round(58 * unit) + 'px ' + serif;
  ctx.fillText(text.title, W / 2, H - 196 * unit);
  ctx.fillStyle = 'rgba(255, 232, 205, 0.86)';
  ctx.font = Math.round(32 * unit) + 'px ' + serif;
  ctx.fillText(text.todayLine, W / 2, H - 128 * unit);
  ctx.fillStyle = 'rgba(190, 205, 235, 0.62)';
  ctx.font = Math.round(24 * unit) + 'px ' + serif;
  ctx.fillText(text.seedLine, W / 2, H - 78 * unit);
  return canvas;
}

// Resolves with a URL for the image: a blob: URL where possible, a data: URL otherwise.
function canvasToUrl(canvas) {
  return new Promise((resolve) => {
    if (!canvas.toBlob) {
      resolve(canvas.toDataURL('image/png'));
      return;
    }
    canvas.toBlob((blob) => {
      resolve(blob ? URL.createObjectURL(blob) : canvas.toDataURL('image/png'));
    }, 'image/png');
  });
}

// ---- src/main.js
// Wires everything together: letter + config -> story, camera, renderer, UI, audio, and the
// frame loop. start() returns a handle that the checks (and the console) can drive.

function pad2(n) {
  return n < 10 ? '0' + n : String(n);
}

function localDate() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

// Returns a message for the first thing wrong with the letter, or null.
function checkLetter(letter) {
  if (!letter || typeof letter !== 'object') return '内容不是一个对象';
  if (!letter.name || typeof letter.name !== 'string') return '缺少 name（称呼）';
  if (!letter.date) return '缺少 date（关键日期）';
  if (!Array.isArray(letter.memories) || letter.memories.length < 2 || letter.memories.length > 7) {
    return 'memories（回忆）需要 2–7 条';
  }
  const lists = ['intro', 'connectPrompt', 'naming', 'question', 'yes', 'later'];
  for (let i = 0; i < lists.length; i++) {
    if (!Array.isArray(letter[lists[i]]) || letter[lists[i]].length === 0) return lists[i] + ' 需要至少一句';
  }
  const groups = ['cover', 'answers', 'keepsake', 'buttons'];
  for (let i = 0; i < groups.length; i++) {
    if (!letter[groups[i]] || typeof letter[groups[i]] !== 'object') return '缺少 ' + groups[i];
  }
  return null;
}

function start(dom, letter, options) {
  options = options || {};
  const config = CONFIG;
  const win = dom.root.ownerDocument.defaultView || window;
  const doc = dom.root.ownerDocument;
  const today = options.today || localDate;

  const seed = seedFromDate(letter.date);
  const count = letter.memories.length;
  const phone = !!(win.matchMedia && win.matchMedia('(pointer: coarse)').matches);
  const calm = !!(win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const density = phone ? config.density.phone : config.density.desktop;
  const ratioCap = phone ? config.render.maxPixelRatioPhone : config.render.maxPixelRatio;

  const renderer = createRenderer(dom.canvas, config);
  const camera = createCamera(config);
  const audio = createAudio(config);
  const galaxy = generateGalaxy(config, seed, density);
  const shape = sampleText(doc, letter.name, config.stage.nameFont, config.population.name, createRng(seed + 1));
  renderer.setGalaxy(galaxy);

  const beaconWorld = new Float32Array(count * 3);
  const beaconScreen = new Float32Array(count * 2);
  const projected = new Float32Array(2);
  const pulse = new Float32Array(3);
  let viewWidth = 0;
  let viewHeight = 0;
  let disposed = false;

  let ui = null;
  const story = createStory(config, letter, seed, {
    today,
    caption: (text) => ui.caption(text),
    buttons: (list) => ui.buttons(list),
    counter: (text) => ui.counter(text),
    beacons: (enabled) => ui.setBeaconsEnabled(enabled),
    sound: (name, arg) => audio.play(name, arg),
    camera: (pose, duration, ease) => {
      if (duration > 0) camera.moveTo(pose, calm ? Math.min(duration, 0.01) : duration, ease);
      else camera.jumpTo(pose);
    },
    state: (name) => { dom.root.dataset.state = name; },
  });
  story.calm = calm;

  // ---- intents ----------------------------------------------------------------------------
  let dragX = 0;
  let dragY = 0;
  let dragActive = false;

  // Joins the next star when the pointer is close enough to it.
  function tryConnect(x, y) {
    if (story.state !== 'connect' || story.connected >= count) return;
    const k = story.connected;
    const dx = x - beaconScreen[k * 2];
    const dy = y - beaconScreen[k * 2 + 1];
    const reach = config.beacon.dragRadiusPx;
    if (dx * dx + dy * dy <= reach * reach) story.connect(k);
  }

  function begin() {
    if (story.state !== 'cover') return;
    audio.start();
    ui.hideCover();
    story.begin();
  }

  function saveKeepsake() {
    // Draw and read back within one task: the WebGL buffer is not preserved between frames.
    render();
    const canvas = renderKeepsake(doc, dom.canvas, config, {
      title: fill(letter.keepsake.title),
      todayLine: fill(letter.keepsake.todayLine),
      seedLine: fill(letter.keepsake.seedLine),
    }, beaconScreen, { width: viewWidth, height: viewHeight });
    if (!canvas) return;
    canvasToUrl(canvas).then((url) => {
      if (!disposed) ui.showKeepsake(url, 'starmap-' + today() + '.png');
    });
  }

  function fill(text) {
    return String(text)
      .replace(/\{name\}/g, letter.name)
      .replace(/\{dateMeaning\}/g, letter.dateMeaning)
      .replace(/\{seed\}/g, String(seed))
      .replace(/\{today\}/g, today().replace(/-/g, '.'));
  }

  const intents = {
    begin,
    key: () => {
      if (story.state === 'cover') begin();
      else story.advance();
    },
    tap: () => {
      if (story.state !== 'cover') story.advance();
    },
    beacon: (index) => {
      audio.start();
      story.tapBeacon(index);
    },
    answer: (id) => {
      audio.start();
      if (id === 'yes' || id === 'later') story.answer(id);
      else if (id === 'ready') story.ready();
      else if (id === 'replay') story.replay();
      else if (id === 'keepsake') saveKeepsake();
    },
    pointer: (x, y) => {
      if (viewWidth > 0) camera.setPointer((x / viewWidth) * 2 - 1, (y / viewHeight) * 2 - 1);
    },
    dragStart: (x, y) => {
      dragActive = true;
      dragX = x;
      dragY = y;
      tryConnect(x, y);
    },
    drag: (x, y) => {
      dragX = x;
      dragY = y;
      tryConnect(x, y);
    },
    dragEnd: () => { dragActive = false; },
    toggleMute: () => {
      audio.setMuted(!audio.muted);
      ui.setMuted(audio.muted);
    },
  };

  ui = createUi(dom, letter, count, intents);
  dom.root.dataset.state = story.state;

  // ---- layout -----------------------------------------------------------------------------
  function resize() {
    const w = dom.canvas.clientWidth || win.innerWidth || 1;
    const h = dom.canvas.clientHeight || win.innerHeight || 1;
    const ratio = Math.min(win.devicePixelRatio || 1, ratioCap);
    if (w === viewWidth && h === viewHeight && ratio === renderer.pixelRatio) return;
    viewWidth = w;
    viewHeight = h;
    renderer.resize(w, h, ratio);
    camera.setAspect(w / h);
    layoutBeacons(config, camera, seed, count, beaconWorld);
    renderer.setBeacons(beaconWorld);
    renderer.updateNameTargets(setNameTargets(galaxy.name, shape, placeName(config, camera, shape.aspect), seed));
    dom.lines.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  }

  // ---- frame ------------------------------------------------------------------------------
  const frame = {
    camera, time: 0, clock: 0, twinkle: calm ? 0 : config.look.twinkle,
    gather: 0, dim: 1, nameGlow: 0, pulse, beaconState: story.beaconState, beaconShow: 0, fade: 0, exposure: 1,
  };
  let simTime = 0;
  let clock = 0;

  function advance(dt) {
    resize();
    story.update(dt);
    clock += dt;
    simTime += dt * story.flow;
    camera.update(dt, clock, calm);

    for (let i = 0; i < count; i++) {
      const visible = camera.project(beaconWorld[i * 3], beaconWorld[i * 3 + 1], beaconWorld[i * 3 + 2], projected);
      beaconScreen[i * 2] = visible ? projected[0] * viewWidth : -1e4;
      beaconScreen[i * 2 + 1] = visible ? projected[1] * viewHeight : -1e4;
      ui.placeBeacon(i, beaconScreen[i * 2], beaconScreen[i * 2 + 1]);
      ui.markBeacon(i, story.lit[i]);
    }
    for (let i = 0; i < count - 1; i++) {
      ui.setSegment(i, i + 1 < story.connected,
        beaconScreen[i * 2], beaconScreen[i * 2 + 1], beaconScreen[i * 2 + 2], beaconScreen[i * 2 + 3]);
    }
    const connecting = story.state === 'connect' && story.connected < count;
    const last = story.connected - 1;
    ui.setRubber(connecting && dragActive && last >= 0,
      last >= 0 ? beaconScreen[last * 2] : 0, last >= 0 ? beaconScreen[last * 2 + 1] : 0, dragX, dragY);
    ui.hintBeacon(connecting ? story.connected : -1);
    ui.setLinesOpacity(story.lines);
  }

  function render() {
    frame.time = simTime;
    frame.clock = clock;
    frame.gather = story.gather;
    frame.dim = story.dim;
    frame.nameGlow = story.nameGlow;
    frame.beaconShow = story.beaconShow;
    frame.fade = story.fade;
    frame.exposure = story.exposure;
    pulseState(config, story.pulseAge, pulse);
    renderer.draw(frame);
  }

  let lastStamp = -1;
  let handle = 0;

  function loop(stamp) {
    handle = win.requestAnimationFrame(loop);
    // The first frame, and the first one after the tab was hidden, only record the time: a
    // multi-second dt would skip whole sentences.
    const dt = lastStamp < 0 ? 0 : Math.min((stamp - lastStamp) / 1000, config.timing.maxDelta);
    lastStamp = stamp;
    advance(dt);
    render();
  }

  function onVisibility() {
    lastStamp = -1;
    audio.setSuspended(doc.hidden);
  }

  function onContextLost(event) {
    event.preventDefault();
    ui.notice('图形上下文丢失了，请刷新页面。');
  }

  doc.addEventListener('visibilitychange', onVisibility);
  dom.canvas.addEventListener('webglcontextlost', onContextLost);
  resize();
  handle = win.requestAnimationFrame(loop);

  function snapshot() {
    return {
      state: story.state,
      seed,
      fade: story.fade,
      gather: story.gather,
      dim: story.dim,
      connected: story.connected,
      lit: story.lit.slice(),
      simTime,
      clock,
      particles: galaxy.stars.count + galaxy.dust.count + galaxy.backdrop.count + galaxy.name.count,
      hdr: renderer.hdr,
      view: [viewWidth, viewHeight],
      beacons: Array.prototype.slice.call(beaconScreen),
    };
  }

  function dispose() {
    disposed = true;
    win.cancelAnimationFrame(handle);
    doc.removeEventListener('visibilitychange', onVisibility);
    dom.canvas.removeEventListener('webglcontextlost', onContextLost);
    ui.dispose();
    audio.dispose();
    renderer.dispose();
  }

  return { config, story, camera, renderer, audio, galaxy, shape, intents, advance, render, snapshot, dispose };
}

// ---- src/boot.js
// Entry point: reads the letter that is written into the page, checks it, and starts the scene.
// Anything that goes wrong here is shown on the page, because nobody opens the console on a phone.

function byId(id) {
  return document.getElementById(id);
}

function fail(text) {
  const notice = byId('notice');
  notice.textContent = text;
  notice.hidden = false;
}

function boot() {
  let letter;
  try {
    letter = JSON.parse(byId('letter').textContent);
  } catch (error) {
    fail('页面里的文字（id="letter" 那一段）不是合法的 JSON，多半是少了逗号或引号：\n' + error.message);
    return;
  }
  const problem = checkLetter(letter);
  if (problem) {
    fail('页面里的文字（id="letter" 那一段）有问题：' + problem);
    return;
  }
  document.title = letter.cover.title;

  const dom = {
    root: byId('app'),
    canvas: byId('scene'),
    lines: byId('lines'),
    cover: byId('cover'),
    coverTitle: byId('cover-title'),
    coverHint: byId('cover-hint'),
    captionA: byId('caption-a'),
    captionB: byId('caption-b'),
    counter: byId('counter'),
    buttons: byId('buttons'),
    beacons: byId('beacons'),
    mute: byId('mute'),
    keepsake: byId('keepsake'),
    keepsakeImage: byId('keepsake-image'),
    keepsakeTip: byId('keepsake-tip'),
    keepsakeSave: byId('keepsake-save'),
    keepsakeClose: byId('keepsake-close'),
    notice: byId('notice'),
  };

  try {
    // Exposed so the checks, and a curious person at the console, can drive the scene.
    window.__starmap = start(dom, letter);
  } catch (error) {
    if (/WebGL2/.test(error.message)) {
      fail('这个浏览器不支持 WebGL2，星空画不出来。\n请换用较新的 Chrome、Edge、Safari 或 Firefox 打开。');
    } else {
      fail('星空没能启动：' + error.message);
    }
    throw error;
  }
}

window.addEventListener('error', () => {
  // Only before the scene is up: after that a stray error must not cover the screen mid-sentence.
  if (!window.__starmap && byId('notice').hidden) fail('页面出错了，请刷新后再试。');
});

boot();
})();
    </script>
