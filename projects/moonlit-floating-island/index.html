    const pal = palette();
    const k = Math.sqrt(x * x + z * z) / field.edgeR(x, z);
    const tone = Utils.clamp(0.5 + 0.62 * noise.fbm(x * 0.3, 3.0, z * 0.3, 2) + 0.14 * noise.n3(x * 1.7, 6.0, z * 1.7), 0, 1);
    const col = Utils.mix3(pal.grassLo, pal.grassHi, tone);
    return Utils.mix3(col, pal.grassDry, 0.35 * smooth(0.8, 1.0, k) + 0.25 * smooth(0.55, 0.9, tone));
  }

  function buildSlab(soup, field, noise, pal) {
    const C = Config.island, T = Config.tree, sectors = C.sectors, topRings = C.topRings;
    // 每个扇区方向上的边缘数据；崖壁的凹凸按"几个扇区一组"取值，形成大块的岩面而不是细褶
    const edge = [];
    for (let j = 0; j < sectors; j++) {
      const a = (j / sectors) * Math.PI * 2, ux = Math.cos(a), uz = -Math.sin(a);
      // 三种尺度的分组：大岩面（约 14°）、中等岩块（约 8°）、逐扇区的碎棱
      const R = field.edgeR(ux, uz), g = Math.floor(j / C.cliffBlock), g2 = Math.floor((j + 1) / Math.max(2, C.cliffBlock - 2));
      edge.push({
        ux: ux, uz: uz, R: R, y0: field.top(ux * R, uz * R), drop: field.cliffDrop(ux, uz),
        h1: noise.hash(g, 1, 5), h2: noise.hash(g2, 2, 5), h3: noise.hash(g, 3, 5), h4: noise.hash(j, 4, 5) - 0.5
      });
    }

    const topStart = Geo.disk(soup, topRings, sectors, function (i, j) {
      // 扇心放在树下（会被树干和树根盖住）；内圈顶点错位加抖动，打散放射状的规则感
      const e = edge[j];
      if (i === topRings) return [e.ux * e.R, e.y0, e.uz * e.R];
      if (i === 0) return [T.x, field.top(T.x, T.z), T.z];
      const e2 = edge[(j + 1) % sectors];
      const f = 0.5 * (i % 2) + (noise.hash(i, j, 7) - 0.5) * 0.5;
      const s = Math.pow((i + (noise.hash(i, j, 13) - 0.5) * 0.45) / topRings, 0.86);
      const ex = Utils.lerp(e.ux * e.R, e2.ux * e2.R, f), ez = Utils.lerp(e.uz * e.R, e2.uz * e2.R, f);
      const x = Utils.lerp(T.x, ex, s), z = Utils.lerp(T.z, ez, s);
      return [x, field.top(x, z), z];
    }, true);

    const n = [0, 1, 0];
    soup.paint(topStart, function (v) {
      field.normal(v.x, v.z, n);
      v.nx = n[0]; v.ny = n[1]; v.nz = n[2];
      let col = grassColor(field, noise, v.x, v.z);
      col = Utils.mix3(col, pal.dirt, 0.85 * smooth(1.05, 0.35, field.distToPath(v.x, v.z, field.path)));
      col = Utils.mix3(col, pal.court, 0.7 * field.terraceMask(v.x, v.z));
      const px = v.x - field.pond.x, pz = v.z - field.pond.z;
      const wet = Math.max(smooth(1.05, 0.5, field.distToPath(v.x, v.z, field.stream)), smooth(1.7, 1.0, Math.sqrt(px * px + pz * pz)));
      col = Utils.mix3(col, pal.bed, wet);
      col = Utils.mix3(col, pal.cliff[1], smooth(0.1, 0.26, 1 - n[1]));
      const dx = v.x - T.x, dz = v.z - T.z;
      v.r = col[0]; v.g = col[1]; v.b = col[2];
      v.ao = 1 - 0.34 * Math.exp(-(dx * dx + dz * dz) / (2 * 3.2 * 3.2));
    });

    // 崖壁（自下而上给环）：岩板底缘 → 三道带凹槽的岩层 → 土层 → 外挑的草皮 → 顶面外沿。
    // 土层以下的高度按 y0 - 1 - (drop - 1) * f 排，保证每一环都在上一环之上
    function rock(e, f) { return e.y0 - 1.0 - (e.drop - 1.0) * f; }
    const cliffStart = soup.mark();
    const levels = [
      function (e) { return [e.R * (0.76 + 0.07 * e.h3), rock(e, 1)]; },
      function (e) { return [e.R * (0.8 + 0.09 * e.h1 + 0.02 * e.h4), rock(e, 0.8 + 0.06 * e.h2)]; },
      function (e) { return [e.R * (0.86 + 0.1 * e.h1 + 0.03 * e.h4), rock(e, 0.6 + 0.08 * e.h2)]; },
      function (e) { return [e.R * (0.83 + 0.1 * e.h2), rock(e, 0.53 + 0.08 * e.h2)]; },
      function (e) { return [e.R * (0.9 + 0.08 * e.h2 + 0.03 * e.h4), rock(e, 0.33 + 0.07 * e.h1)]; },
      function (e) { return [e.R * (0.88 + 0.08 * e.h3), rock(e, 0.26 + 0.07 * e.h1)]; },
      function (e) { return [e.R * (0.94 + 0.05 * e.h1 + 0.02 * e.h4), rock(e, 0.08 + 0.05 * e.h3)]; },
      function (e) { return [e.R * 0.968, e.y0 - 0.78]; },
      function (e) { return [e.R * (0.995 + 0.012 * e.h4), e.y0 - 0.52]; },
      function (e) { return [e.R * 1.024, e.y0 - 0.3]; },
      function (e) { return [e.R * (1.03 + 0.008 * e.h4), e.y0 - 0.12]; },
      function (e) { return [e.R, e.y0]; }
    ];
    const rings = levels.map(function (fn) {
      return edge.map(function (e) { const p = fn(e); return [e.ux * p[0], p[1], e.uz * p[0]]; });
    });
    Geo.skin(soup, rings, false, false);
    Geo.disk(soup, 2, sectors, function (i, j) {
      return i === 2 ? rings[0][j] : [rings[0][j][0] * 0.5 * i, -4.6 + i * 0.6, rings[0][j][2] * 0.5 * i];
    }, false);

    soup.paint(cliffStart, function (v) {
      const jit = Underside.faceJitter(noise, v);
      const r = Math.sqrt(v.cx * v.cx + v.cz * v.cz) || 1, er = field.edgeR(v.cx, v.cz);
      const depth = field.top(v.cx / r * er, v.cz / r * er) - v.cy;
      const band = Math.floor(v.cy * 1.15 + noise.n3(v.cx * 0.3, v.cy * 0.2, v.cz * 0.3) * 1.5 + 100) % 3;
      let col = pal.cliff[band];
      if (v.ny > 0.3) col = Utils.mix3(col, pal.moss, 0.5);
      if (depth < 0.42) col = Utils.mix3(pal.grassLo, pal.grassHi, 0.25 + 0.5 * jit);
      else if (depth < 0.95) col = Utils.mix3(pal.dirt, pal.cliff[0], 0.25 + 0.4 * jit);
      const k = 0.93 + 0.14 * jit;
      v.r = col[0] * k; v.g = col[1] * k; v.b = col[2] * k;
      v.ao = v.ny < -0.5 ? 0.5 : 0.62 + 0.38 * smooth(3.6, 0.3, depth);
    });
  }

  function create(parent, shared, noise) {
    const field = Terrain.createField(noise), pal = palette();
    const soup = new Geo.Soup();
    buildSlab(soup, field, noise, pal);
    const veins = Underside.build(soup, field, noise, pal);
    const geometry = Shaders.geometryFromSoup(soup);
    const material = Shaders.litMaterial(shared, 'lit');
    const mesh = new THREE.Mesh(geometry, material);
    mesh.name = 'island-body';
    mesh.layers.enable(1);
    parent.add(mesh);
    return {
      field: field, mesh: mesh, material: material, veins: veins, triangles: soup.triangles(),
      dispose: function () { parent.remove(mesh); geometry.dispose(); material.dispose(); }
    };
  }

  return { create: create, palette: palette, grassColor: grassColor };
})();

// ===== app.js =====
'use strict';

// 场景装配：只依赖 THREE 与传入的 renderer，不碰 DOM。
// main.js 负责页面事件和主循环；tools/preview 用同一份代码离线出图。
const App = (function () {
  function create(renderer, opts) {
    const shared = Shaders.createShared();
    const noise = Noise.make(Config.seed);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(Config.camera.fov, 1, Config.camera.near, Config.camera.far);
    const env = Environment.create(shared, Config.time.start);
    const sky = Sky.create(scene, shared, env);

    // 整座岛（含其上的一切）挂在同一个 Group 上，一起上下浮动
    const islandGroup = new THREE.Group();
    islandGroup.name = 'island-root';
    scene.add(islandGroup);
    const island = Island.create(islandGroup, shared, noise);

    const ctx = {
      renderer: renderer, scene: scene, camera: camera, shared: shared, noise: noise, env: env,
      root: islandGroup, island: island, field: island.field, lights: null, parts: [], events: createEvents()
    };
    ctx.lights = createLights(shared);

    const builders = opts.builders || App.builders;
    for (let i = 0; i < builders.length; i++) {
      const part = builders[i](ctx);
      if (part) { part.name = builders[i].partName; ctx.parts.push(part); }
    }
    env.refresh();

    const pipeline = Pipeline.create(renderer, shared, {
      mode: opts.mode,
      shadowSize: Config.quality.shadowSize,
      shadowExtent: Config.shadow.extent,
      shadowDepth: Config.shadow.depth,
      shadowBias: Config.shadow.bias,
      shadowStrength: Config.shadow.strength,
      bloomThreshold: Config.post.bloomThreshold,
      bloomKnee: Config.post.bloomKnee,
      bloomSpread: Config.post.bloomSpread,
      bloomStrength: Config.post.bloomStrength,
      vignette: Config.post.vignette,
      saturation: Config.post.saturation
    });

    const shadowCenter = new THREE.Vector3(0, 2, 0);
    let time = 0;

    function setSize(width, height, pixelRatio) {
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(width, height);
      camera.aspect = width / height;
      // 竖屏时保持水平视野，岛不会被裁掉
      const base = Config.camera.fov;
      camera.fov = camera.aspect < 1 ? Math.min(78, 2 * Math.atan(Math.tan(base * Math.PI / 360) / Math.max(0.5, camera.aspect) * 0.82) * 180 / Math.PI) : base;
      camera.updateProjectionMatrix();
      pipeline.setSize(width * pixelRatio, height * pixelRatio);
      shared.uPixelScale.value = height * pixelRatio / (2 * Math.tan(camera.fov * Math.PI / 360));
    }

    function setView(theta, phi, distance) {
      const y = Config.camera.targetY;
      camera.position.set(distance * Math.sin(phi) * Math.sin(theta), y + distance * Math.cos(phi), distance * Math.sin(phi) * Math.cos(theta));
      camera.lookAt(new THREE.Vector3(0, y, 0));
    }

    function update(dt) {
      time += dt;
      shared.uTime.value = time;
      env.update(dt);

      const c = Config.island;
      islandGroup.position.y = Math.sin(time * c.bobSpeed) * c.bobAmplitude;
      islandGroup.rotation.x = Math.sin(time * c.bobSpeed * 0.7 + 1.3) * c.tiltAmplitude;
      islandGroup.rotation.z = Math.cos(time * c.bobSpeed * 0.53) * c.tiltAmplitude;

      for (let i = 0; i < ctx.parts.length; i++) {
        if (ctx.parts[i].update) ctx.parts[i].update(dt, time);
      }
      ctx.lights.upload(islandGroup);
    }

    function render() {
      pipeline.grade.x = env.state.exposure;
      pipeline.tint.copy(env.state.tint);
      pipeline.render(scene, camera, shared.uSunDir.value, shadowCenter);
    }

    function dispose() {
      for (let i = 0; i < ctx.parts.length; i++) {
        if (ctx.parts[i].dispose) ctx.parts[i].dispose();
      }
      island.dispose();
      sky.dispose();
      pipeline.dispose();
    }

    function part(name) {
      for (let i = 0; i < ctx.parts.length; i++) if (ctx.parts[i].name === name) return ctx.parts[i];
      return null;
    }

    return {
      ctx: ctx, events: ctx.events, scene: scene, camera: camera, env: env, shared: shared, pipeline: pipeline, island: island,
      part: part, setSize: setSize, setView: setView, update: update, render: render, dispose: dispose
    };
  }

  // 模块之间只通过事件说话：水晶被点亮 → 粒子、光环、音效各自响应
  function createEvents() {
    const map = {};
    return {
      on: function (type, fn) { (map[type] = map[type] || []).push(fn); },
      emit: function (type, data) {
        const list = map[type];
        if (list) for (let i = 0; i < list.length; i++) list[i](data);
      }
    };
  }

  // 点光源表：各模块申请一个槽位，位置写岛的局部坐标，每帧统一换算到世界空间
  function createLights(shared) {
    const slots = [];
    const tmp = new THREE.Vector3();
    function add(x, y, z, radius, color, intensity) {
      if (slots.length >= Shaders.NUM_LIGHTS) throw new Error('点光源槽位用完');
      const slot = { x: x, y: y, z: z, radius: radius, color: color, intensity: intensity };
      slots.push(slot);
      return slot;
    }
    function upload(root) {
      const pos = shared.uLights.value, col = shared.uLightColors.value;
      root.updateMatrixWorld();
      for (let i = 0; i < slots.length; i++) {
        const s = slots[i];
        tmp.set(s.x, s.y, s.z).applyMatrix4(root.matrixWorld);
        pos[i * 4] = tmp.x; pos[i * 4 + 1] = tmp.y; pos[i * 4 + 2] = tmp.z; pos[i * 4 + 3] = s.radius;
        col[i * 3] = s.color[0] * s.intensity; col[i * 3 + 1] = s.color[1] * s.intensity; col[i * 3 + 2] = s.color[2] * s.intensity;
      }
    }
    return { add: add, upload: upload, slots: slots };
  }

  // 各模块文件在加载时把自己的装配函数 push 进来，顺序即装配顺序
  const builders = [];
  function register(name, fn) {
    fn.partName = name;
    builders.push(fn);
  }
  return { create: create, builders: builders, register: register };
})();

// ===== tree.js =====
'use strict';

// 古树的木质部分：扭转的主干、贴地蔓延的板根、三级枝干。
// 返回每根枝梢的位置（anchors），canopy.js 在这些位置上长树冠。
const Tree = (function () {
  function add(p, dx, dy, dz) {
    return [p[0] + dx, p[1] + dy, p[2] + dz];
  }

  function wood(soup, field, noise) {
    const T = Config.tree, rng = Utils.makeRng(Config.seed + 41), c = Utils.rgb;
    const bx = T.x, bz = T.z, by = field.top(bx, bz) - 0.3;
    const S = T.height / 11.5;
    const anchors = [];
    const start = soup.mark();
    // 细分倍数：路径采样点和截面边数都跟着它走，取枝梢 / 分叉点时按比例换算下标
    const D = Config.quality.detail ? 2 : 1, TS = 13 * D, sides = function (n) { return D > 1 ? Math.round(n * 1.6) : n; };

    // 主干：S 形弯曲 + 扭转的棱，根部外扩
    const trunk = Geo.spline([[0, 0, 0], [0.3, 1.5, 0.12], [-0.24, 3.0, -0.2], [0.28, 4.5, 0.1], [0.05, 5.8, -0.05]].map(function (p) {
      return [bx + p[0] * S, by + p[1] * S, bz + p[2] * S];
    }), TS);
    const trunkSides = sides(10);
    Geo.tube(soup, trunk, function (t) { return (0.5 + 0.85 * Math.exp(-t * 6.5) + 0.22 * (1 - t)) * S; }, trunkSides, {
      twist: 1.7, capEnd: true,
      // 三道扭转的棱 + 一层细的树皮沟纹
      radial: function (i, j, t) {
        const a = j / trunkSides * Math.PI * 2;
        return 1 + 0.16 * Math.sin(a * 3 + i * 0.6 / D) * (1 - 0.4 * t) + 0.045 * Math.sin(a * 8 + i * 1.1 / D) + 0.08 * (noise.hash(i, j, 91) - 0.5);
      }
    });

    function limb(path, r0, r1, n, seed) {
      Geo.tube(soup, path, function (t) { return r1 + (r0 - r1) * Math.pow(1 - t, 1.3); }, sides(n), {
        capEnd: true, radial: function (i, j) { return 0.88 + 0.24 * noise.hash(i, j, seed); }
      });
    }

    // 一级枝：沿主干螺旋排布（黄金角），先平伸再上扬；每根带两根二级枝
    const P = 6;
    for (let i = 0; i < P; i++) {
      const a = i * 2.4 + rng.range(-0.25, 0.25), ox = Math.cos(a), oz = -Math.sin(a);
      const s = trunk[(7 + i) * D], len = rng.range(4.8, 6.4) * S * (1 - 0.04 * i);
      const path = Geo.spline([
        s,
        add(s, ox * len * 0.36 + rng.range(-0.3, 0.3), len * 0.24, oz * len * 0.36 + rng.range(-0.3, 0.3)),
        add(s, ox * len * 0.72 + rng.range(-0.4, 0.4), len * 0.33, oz * len * 0.72 + rng.range(-0.4, 0.4)),
        add(s, ox * len, len * 0.42, oz * len)
      ], 8 * D);
      limb(path, 0.42 * S, 0.1 * S, 6, 100 + i);
      anchors.push({ p: path[8 * D], size: 1, ox: ox, oz: oz });
      for (let k = 0; k < 2; k++) {
        const q = path[(k === 0 ? 4 : 6) * D], a2 = a + (k === 0 ? 1 : -1) * rng.range(0.7, 1.2);
        const px = Math.cos(a2), pz = -Math.sin(a2), l2 = rng.range(1.9, 2.9) * S;
        const sub = Geo.spline([q, add(q, px * l2 * 0.5, l2 * 0.28, pz * l2 * 0.5), add(q, px * l2, l2 * 0.62, pz * l2)], 4 * D);
        limb(sub, 0.16 * S, 0.05 * S, 4, 200 + i * 2 + k);
        anchors.push({ p: sub[4 * D], size: 0.68, ox: px, oz: pz });
        // 三级细枝：从二级枝中段再分一根，伸进叶团里，树冠镂空处能看到枝杈
        if (D > 1) {
          const t0 = sub[5], a3 = a2 + (k === 0 ? -1 : 1) * rng.range(0.8, 1.3), l3 = l2 * rng.range(0.45, 0.6);
          const tw = Geo.spline([t0, add(t0, Math.cos(a3) * l3 * 0.5, l3 * 0.4, -Math.sin(a3) * l3 * 0.5), add(t0, Math.cos(a3) * l3, l3 * 0.75, -Math.sin(a3) * l3)], 5);
          limb(tw, 0.07 * S, 0.025 * S, 3, 250 + i * 2 + k);
        }
      }
    }
    // 树顶的三根领导枝，把树冠顶起来
    const top = trunk[TS];
    for (let i = 0; i < 3; i++) {
      const a = i * 2.1 + 0.9 + rng.range(-0.3, 0.3), ox = Math.cos(a), oz = -Math.sin(a), len = rng.range(3.0, 4.2) * S;
      const path = Geo.spline([top, add(top, ox * len * 0.32, len * 0.5, oz * len * 0.32), add(top, ox * len * 0.6, len * 0.98, oz * len * 0.6)], 5 * D);
      limb(path, 0.36 * S, 0.09 * S, 5, 300 + i);
      anchors.push({ p: path[5 * D], size: 0.95, ox: ox, oz: oz });
    }

    // 板根：从树干基部贴着地形向外爬，末端钻进土里
    for (let i = 0; i < T.roots; i++) {
      const a = (i / T.roots) * Math.PI * 2 + rng.range(-0.22, 0.22), len = rng.range(2.6, 4.6) * S, bend = rng.range(-0.5, 0.5);
      const ctrl = [];
      for (let k = 0; k < 5; k++) {
        const f = k / 4, r = (0.55 + len * f) * S, aa = a + bend * f * f + 0.12 * Math.sin(f * 6 + i);
        const x = bx + Math.cos(aa) * r, z = bz - Math.sin(aa) * r;
        ctrl.push([x, k === 0 ? by + 1.3 * S : field.top(x, z) + (0.3 - 0.52 * f) * S, z]);
      }
      limb(Geo.spline(ctrl, 7 * D), rng.range(0.34, 0.46) * S, 0.07 * S, 5, 400 + i);
    }

    const dark = c(0x2c2238), light = c(0x6b5a7c), moss = c(0x356f58), sap = c(0x6fe8ff);
    soup.paint(start, function (v) {
      const jit = Underside.faceJitter(noise, v);
      const h = Utils.clamp((v.cy - by) / (9 * S), 0, 1);
      let col = Utils.mix3(dark, light, Utils.clamp(0.15 + h * 0.5 + jit * 0.35, 0, 1));
      if (v.ny > 0.4 && v.cy < by + 2.6 * S) col = Utils.mix3(col, moss, 0.65);
      // 树干上盘旋而上的发光纹路（"苏醒"时会整体变亮）
      const dx = v.cx - bx, dz = v.cz - bz, d = Math.sqrt(dx * dx + dz * dz);
      const band = Math.sin(Math.atan2(dz, dx) * 2 + v.cy * 1.25);
      if (band > 0.86 && d < 1.9 * S && v.cy < by + 6.2 * S && jit > 0.25) {
        col = Utils.mix3(col, sap, 0.55);
        v.e = 0.8; v.ph = 0.2;
      } else v.ph = 0.2;
      v.r = col[0]; v.g = col[1]; v.b = col[2];
      v.ao = 0.55 + 0.45 * Terrain.smooth(0, 0.35, h) * (1 - 0.35 * Terrain.smooth(0.45, 0.8, h));
      v.s = 0.045 * Terrain.smooth(by + 4 * S, by + 10 * S, v.y);
    });
    return { anchors: anchors, base: [bx, by, bz], scale: S };
  }

  return { wood: wood };
})();

// ===== canopy.js =====
'use strict';

// 古树的树冠：枝梢上的多层叶团、轮廓外缘的散叶、垂下的发光藤蔓与花灯。
// 与木质部分烘进同一个网格；并登记装配函数。
(function () {
  const smooth = Terrain.smooth;

  // soup 投射阴影；fine 里是散叶和藤蔓，太细，进阴影贴图只会变成地上的划痕
  function build(soup, fine, wood, noise, lights) {
    const T = Config.tree, rng = Utils.makeRng(Config.seed + 57), c = Utils.rgb, S = wood.scale;
    const deep = c(0x2f2a8c), mid = c(0x4a63e0), high = c(0x6fd0ff), pink = c(0xc27dff), bulbCol = [c(0x8ff0ff), c(0xd9a0ff), c(0xfff0b8)];
    const baseY = wood.base[1];
    const blobs = [];
    const HI = Config.quality.detail > 0;

    function foliage(cx, cy, cz, r, detail, seed) {
      const start = Geo.blob(soup, [cx, cy, cz], [r * 1.18, r * 0.78, r * 1.18], detail, function (ux, uy, uz) {
        // 底部压平、顶部鼓起，像一朵朵伞状的叶云
        // 三层起伏：大的鼓包、中等的叶簇、细碎的叶尖（细分够高时最后一层才显得出来）
        const lump = 1 + 0.3 * noise.n3(ux * 1.9 + seed, uy * 1.9, uz * 1.9) + 0.1 * noise.n3(ux * 4.5, uy * 4.5 + seed, uz * 4.5) +
          (detail > 1 ? 0.07 * noise.n3(ux * 9.5 + seed, uy * 9.5, uz * 9.5) : 0);
        return lump * (uy < 0 ? 0.72 : 1);
      });
      const tintShift = rng.range(0, 1), phase = rng.next();
      soup.paint(start, function (v) {
        const jit = Underside.faceJitter(noise, v);
        const h = Utils.clamp((v.cy - cy) / (r * 0.8) * 0.5 + 0.5, 0, 1);
        let col = Utils.mix3(deep, mid, smooth(0.1, 0.6, h));
        col = Utils.mix3(col, high, smooth(0.55, 1.0, h) * (0.3 + 0.4 * jit));
        if (jit > 0.8 - tintShift * 0.14) col = Utils.mix3(col, pink, 0.65);
        v.r = col[0]; v.g = col[1]; v.b = col[2];
        // 叶团底面像被内部的光照亮；零星的面更亮一些，Bloom 之后是闪烁的叶片
        v.e = (v.ny < -0.2 ? 0.62 : 0.2) + (jit > 0.86 ? 0.95 : 0);
        v.s = 0.1 + 0.12 * jit; v.ph = phase;
        v.ao = 0.6 + 0.4 * h;
      });
      blobs.push({ x: cx, y: cy, z: cz, r: r });
    }

    // 叶团：每个枝梢一个主团，周围两三个小团
    const per = Math.max(1, Math.round(T.canopyClusters / wood.anchors.length) - 1);
    for (let i = 0; i < wood.anchors.length; i++) {
      const a = wood.anchors[i], r = rng.range(1.75, 2.25) * a.size * S;
      foliage(a.p[0], a.p[1] + r * 0.2, a.p[2], r, (a.size > 0.8 ? 2 : 1) + (HI ? 1 : 0), i * 3.7);
      for (let k = 0; k < (a.size > 0.8 ? per + 1 : per); k++) {
        const ang = rng.range(0, Math.PI * 2), d = r * rng.range(0.75, 1.15), r2 = r * rng.range(0.42, 0.66);
        foliage(a.p[0] + Math.cos(ang) * d, a.p[1] + r * rng.range(-0.15, 0.55), a.p[2] + Math.sin(ang) * d, r2, HI ? 2 : 1, i * 3.7 + k + 50);
      }
    }

    // 散叶：贴着叶团外缘的小菱形叶片，打碎球形的轮廓。正反两面都写，不需要双面材质
    const leafStart = fine.mark();
    for (let i = 0; i < blobs.length; i++) {
      const b = blobs[i], n = Math.round(b.r * (HI ? 11 : 9));
      for (let k = 0; k < n; k++) {
        const az = rng.range(0, Math.PI * 2), el = rng.range(-0.5, 1.2), ce = Math.cos(el);
        const ux = Math.cos(az) * ce, uy = Math.sin(el), uz = Math.sin(az) * ce;
        const l = rng.range(0.34, 0.62) * S, w = l * 0.36, st = fine.mark();
        if (HI) {
          // 高模叶片：沿中脉对折、叶尖下卷的六边形，每面 6 个三角形
          const m0 = [0, 0, 0], m1 = [0, l * 0.5, -0.03 * l], m2 = [0, l, 0.1 * l];
          const r1 = [w * 0.8, l * 0.26, 0.1 * l], r2 = [w, l * 0.62, 0.14 * l], l1 = [-w * 0.8, l * 0.26, 0.1 * l], l2 = [-w, l * 0.62, 0.14 * l];
          fine.tri(m0, r1, m1); fine.tri(m1, r1, r2); fine.tri(m1, r2, m2); fine.tri(m0, m1, l1); fine.tri(m1, l2, l1); fine.tri(m1, m2, l2);
          fine.tri(m0, m1, r1); fine.tri(m1, r2, r1); fine.tri(m1, m2, r2); fine.tri(m0, l1, m1); fine.tri(m1, l1, l2); fine.tri(m1, l2, m2);
        } else {
          const p0 = [0, 0, 0], p1 = [w, l * 0.42, 0.07], p2 = [0, l, 0], p3 = [-w, l * 0.42, 0.07];
          fine.tri(p0, p1, p2); fine.tri(p0, p2, p3); fine.tri(p0, p2, p1); fine.tri(p0, p3, p2);
        }
        fine.transform(st, Geo.basis(
          [b.x + ux * b.r * 1.1, b.y + uy * b.r * 0.72, b.z + uz * b.r * 1.1],
          [ux + rng.range(-0.4, 0.4), uy * 0.5 - 0.55, uz + rng.range(-0.4, 0.4)], 1, rng.range(0, 6)));
      }
    }
    fine.paint(leafStart, function (v) {
      const jit = noise.hash(Math.floor(v.cx * 13.1), Math.floor(v.cy * 13.1), Math.floor(v.cz * 13.1));
      const col = jit > 0.72 ? pink : Utils.mix3(mid, high, jit * 1.3);
      v.r = col[0]; v.g = col[1]; v.b = col[2];
      v.e = 0.45 + 1.1 * jit * jit; v.s = 0.3; v.ph = jit; v.ao = 0.9;
    });

    // 藤蔓：从叶团底部垂下，末端挂一盏发光的花灯
    const bulbs = [];
    for (let i = 0; i < T.vines; i++) {
      const b = blobs[Math.floor(rng.next() * blobs.length)];
      const x = b.x + rng.range(-0.6, 0.6) * b.r, z = b.z + rng.range(-0.6, 0.6) * b.r, y0 = b.y - b.r * 0.42;
      const ground = baseY + 1.6 * S;
      const len = Math.min(rng.range(1.6, 4.6) * S, Math.max(0.8, y0 - ground));
      const pts = [], segs = HI ? 9 : 4, curl = rng.range(-0.25, 0.25), phase = rng.next(), tint = bulbCol[i % 3];
      for (let k = 0; k <= segs; k++) pts.push([x + curl * Math.sin(k * 3.6 / segs), y0 - len * k / segs, z + curl * Math.cos(k * 2.8 / segs)]);
      const st = fine.mark();
      Geo.tube(fine, pts, function () { return 0.022 * S; }, HI ? 4 : 3, { capEnd: false });
      fine.paint(st, function (v) {
        const d = (y0 - v.y) / len;
        v.r = mid[0] * 0.6; v.g = mid[1] * 0.6; v.b = mid[2] * 0.6;
        v.e = 0.35; v.s = 0.5 * d * d; v.ph = phase; v.ao = 0.8;
      });
      const bs = fine.mark(), br = rng.range(0.1, 0.17) * S, by = y0 - len - br * 0.8;
      Geo.blob(fine, [x + curl * Math.sin(3.6), by, z + curl * Math.cos(2.8)], [br, br * 1.35, br], HI ? 1 : 0);
      fine.paint(bs, function (v) {
        v.r = tint[0]; v.g = tint[1]; v.b = tint[2];
        v.e = 3.2; v.s = 0.5; v.ph = phase; v.ao = 1;
      });
      bulbs.push({ x: x, y: by, z: z, c: tint });
    }

    // 树冠向下洒的蓝紫色光：照亮树根和草地
    const glow = lights.add(wood.base[0], baseY + 5.2 * S, wood.base[2], 15, c(0x6f8cff), 2.2);
    return { blobs: blobs, bulbs: bulbs, glow: glow };
  }

  App.register('tree', function (ctx) {
    const soup = new Geo.Soup();
    const wood = Tree.wood(soup, ctx.field, ctx.noise);
    const fine = new Geo.Soup();
    const canopy = build(soup, fine, wood, ctx.noise, ctx.lights);
    const fineGeometry = Shaders.geometryFromSoup(fine);
    const fineMesh = new THREE.Mesh(fineGeometry, ctx.island.material);
    fineMesh.name = 'tree-leaves';
    ctx.root.add(fineMesh);
    const geometry = Shaders.geometryFromSoup(soup);
    const mesh = new THREE.Mesh(geometry, ctx.island.material);
    mesh.name = 'tree';
    mesh.layers.enable(1);
    ctx.root.add(mesh);
    ctx.tree = { wood: wood, canopy: canopy };
    const baseGlow = canopy.glow.intensity;
    return {
      triangles: soup.triangles() + fine.triangles(),
      update: function (dt, time) {
        // 呼吸：与着色器里自发光的脉动同频
        canopy.glow.intensity = baseGlow * (0.85 + 0.15 * Math.sin(time * 1.4)) * (0.35 + 0.65 * ctx.shared.uGlow.value) * (1 + ctx.shared.uAwaken.value * 1.2);
      },
      dispose: function () { ctx.root.remove(mesh); ctx.root.remove(fineMesh); geometry.dispose(); fineGeometry.dispose(); }
    };
  });
})();

// ===== crystal-kit.js =====
'use strict';

// 水晶的着色与单体几何：一个共享的六棱晶体几何 + 每颗水晶各自的材质（各自的颜色与能量）。
const CrystalKit = (function () {
  const vertex = `
attribute vec4 fx;
varying vec3 vWorld;
varying vec3 vNormal;
varying float vHeight;
varying float vFacet;
void main() {
  vec4 lp = vec4(position, 1.0);
  vec3 ln = normal;
#ifdef USE_INSTANCING
  lp = instanceMatrix * lp;
  ln = mat3(instanceMatrix) * ln;
#endif
  vec4 wp = modelMatrix * lp;
  vWorld = wp.xyz;
  vNormal = normalize(mat3(modelMatrix) * ln);
  vHeight = position.y;
  vFacet = fx.w;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

  const fragment = `
varying vec3 vWorld;
varying vec3 vNormal;
varying float vHeight;
varying float vFacet;
uniform vec3 uTint;
// x 能量(0..1) y 悬停(0..1) z 相位 w 点亮瞬间的闪光
uniform vec4 uState;
${Shaders.common}
void main() {
  vec3 n = normalize(vNormal);
  vec3 v = normalize(cameraPosition - vWorld);
  float ndv = abs(dot(n, v));
  float fres = pow(1.0 - ndv, 2.2);
  float energy = uState.x;
  // 晶体内部：越靠近中段越亮，每个切面的明度略有不同
  float core = 1.0 - abs(vHeight - 0.45) * 1.5;
  float breath = 0.8 + 0.2 * sin(uTime * 1.7 + uState.z * 6.283);
  vec3 body = uTint * (0.3 + 0.55 * clamp(core, 0.0, 1.0)) * (0.7 + 0.6 * vFacet);
  vec3 lit = body * (uSkyColor * 1.4 + uSunColor * (0.3 + 0.7 * max(dot(n, uSunDir), 0.0)));
  // 切面高光：月亮/太阳在某些切面上的镜面反射，转动时一闪一闪
  float spec = pow(max(dot(reflect(-v, n), uBodyDir), 0.0), 24.0);
  float glow = (0.55 * uGlow + 0.15) * breath + energy * 2.4 + uState.y * 0.55 + uState.w * 5.0 + uAwaken * 1.6;
  vec3 col = lit + body * glow * 2.0;
  col += mix(uTint, vec3(1.0), 0.6) * (fres * (0.9 + energy * 2.0 + uState.y) + spec * 2.5);
  col = applyFog(col, vWorld, cameraPosition);
  gl_FragColor = vec4(encodeOut(col), 1.0);
}
`;

  // 单位晶体：高 1、最宽处半径约 0.24 的双尖晶体，原点在底尖。
  // 高模把六条棱各削出一个窄面、面宽不等、尖顶略偏，外加三根贴着主体长出来的子晶
  function unitGeometry(noise) {
    const soup = new Geo.Soup();
    if (Config.quality.detail > 0) {
      const widths = [1, 0.9, 1.06, 0.94, 1.03, 0.88];
      Geo.crystal(soup, 1, 0.245, {
        bevel: 0.24, tip: [0.16, -0.1], radial: function (j) { return widths[j]; },
        profile: [[0.05, 0], [0.5, 0.07], [0.84, 0.17], [1, 0.36], [0.96, 0.56], [0.87, 0.74], [0.55, 0.88], [0.04, 1]]
      });
      for (let k = 0; k < 3; k++) {
        const a = 0.9 + k * 2.2, h = 0.34 - k * 0.06, st = soup.mark();
        Geo.crystal(soup, h, 0.07 - k * 0.008, { phase: k * 1.3, tip: [0.3, 0.2] });
        soup.transform(st, Geo.basis([Math.cos(a) * 0.15, 0.2 + k * 0.05, Math.sin(a) * 0.15], [Math.cos(a) * 0.55, 1, Math.sin(a) * 0.55], 1, k));
      }
    } else Geo.lathe(soup, [[0.012, 0], [0.2, 0.16], [0.245, 0.36], [0.215, 0.74], [0.012, 1]], 6, { capStart: false, capEnd: false });
    soup.paint(0, function (v) {
      v.ph = noise.hash(v.face >> 1, 3, 77);
    });
    return Shaders.geometryFromSoup(soup);
  }

  function material(shared, tint, phase) {
    return new THREE.ShaderMaterial({
      name: 'crystal',
      uniforms: Shaders.uniforms(shared, {
        uTint: { value: new THREE.Color(tint[0], tint[1], tint[2]) },
        uState: { value: new THREE.Vector4(0, 0, phase, 0) }
      }),
      vertexShader: vertex,
      fragmentShader: fragment
    });
  }

  // 基座：三层六边形石台 + 一圈发光符文 + 几根插在地里的小晶体。写进 soup（受光材质）
  function pedestal(soup, noise, rng, x, y, z, size, tint) {
    const c = Utils.rgb, stone = c(0x6f7086), dark = c(0x45465c);
    const start = soup.mark(), r = 0.62 + 0.3 * size;
    // 三层石台，每层有倒角，六个角各削一刀，顶面是一个浅碗
    Geo.crystal(soup, 1, r, {
      phase: rng.range(0, 1), bevel: 0.16,
      profile: [[1.3, -0.5], [1.3, 0.1], [1.25, 0.16], [1.12, 0.2], [1.12, 0.36], [1.07, 0.41], [0.9, 0.44], [0.9, 0.61], [0.85, 0.67], [0.74, 0.7], [0.6, 0.7], [0.46, 0.64], [0.01, 0.62]]
    });
    soup.transform(start, Geo.trs([x, y, z], null, 1));
    soup.paint(start, function (v) {
      const jit = Underside.faceJitter(noise, v);
      const col = Utils.mix3(dark, stone, 0.3 + 0.7 * jit);
      v.r = col[0]; v.g = col[1]; v.b = col[2];
      // 中间一层的竖面刻着符文，用水晶的颜色发光
      if (Math.abs(v.ny) < 0.2 && v.cy - y > 0.22 && v.cy - y < 0.36) {
        v.r = tint[0]; v.g = tint[1]; v.b = tint[2];
        v.e = 1.1; v.ph = rng.next();
      }
      v.ao = 0.7 + 0.3 * Terrain.smooth(0, 0.6, v.cy - y);
    });
    const shardStart = soup.mark(), count = (Config.quality.detail > 0 ? 5 : 3) + Math.floor(rng.next() * 3);
    for (let k = 0; k < count; k++) {
      const a = rng.range(0, Math.PI * 2), d = r * rng.range(1.25, 1.75), h = rng.range(0.35, 0.95) * size, w = h * rng.range(0.2, 0.28);
      const st = Geo.crystal(soup, h, w, { phase: rng.range(0, 6), tip: [rng.range(-0.3, 0.3), rng.range(-0.3, 0.3)] });
      soup.transform(st, Geo.basis([x + Math.cos(a) * d, y - 0.12, z + Math.sin(a) * d], [Math.cos(a) * 0.45 + rng.range(-0.2, 0.2), 1, Math.sin(a) * 0.45 + rng.range(-0.2, 0.2)], 1, rng.range(0, 6)));
    }
    soup.paint(shardStart, function (v) {
      const k = 0.6 + 0.7 * Underside.faceJitter(noise, v);
      v.r = tint[0] * k; v.g = tint[1] * k; v.b = tint[2] * k;
      v.e = 1.5; v.ph = rng.next();
    });
    return 0.7;
  }

  return { unitGeometry: unitGeometry, material: material, pedestal: pedestal };
})();

// ===== crystals.js =====
'use strict';

// 七颗悬浮水晶：布局、状态（悬停 / 点亮 / 冷却）、拾取、点光，以及全部点亮后的"苏醒"。
(function () {
  // 手工摆位：x, z, 大小, 颜色序号。第一颗在低处遗迹平台的圆坛中央，最大
  const LAYOUT = [
    [2.9, 9.3, 1.55, 0], [6.9, 4.3, 1.0, 2], [8.7, -1.6, 1.2, 1], [4.6, -7.4, 0.95, 0],
    [-3.2, -8.6, 1.25, 2], [-8.2, -4.4, 1.0, 1], [-7.4, 5.6, 1.15, 0]
  ];
  const ORBITERS = 3;

  App.register('crystals', function (ctx) {
    const C = Config.crystals, field = ctx.field, rng = Utils.makeRng(Config.seed + 71);
    const tints = [Utils.rgb(0x4fe8ff), Utils.rgb(0x5b8cff), Utils.rgb(0xb070ff)];
    const unit = CrystalKit.unitGeometry(ctx.noise);
    const soup = new Geo.Soup();
    const items = [];
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3();
    const tmp = new THREE.Vector3();

    for (let i = 0; i < C.count; i++) {
      const L = LAYOUT[i % LAYOUT.length], x = L[0], z = L[1], size = L[2], tint = tints[L[3]];
      const ground = field.top(x, z);
      const topY = ground + CrystalKit.pedestal(soup, ctx.noise, rng, x, ground, z, size, tint);
      const material = CrystalKit.material(ctx.shared, tint, rng.next());
      const mesh = new THREE.InstancedMesh(unit, material, 1 + ORBITERS);
      mesh.name = 'crystal-' + i;
      mesh.frustumCulled = false;
      mesh.layers.enable(1);
      ctx.root.add(mesh);
      const k = 1.75 * size;
      items.push({
        index: i, x: x, z: z, size: size, tint: tint, k: k, baseY: topY + 0.45 + 0.25 * size, mesh: mesh, material: material,
        state: material.uniforms.uState.value, phase: rng.range(0, 6.28), spin: rng.range(0, 6.28), tilt: rng.range(-0.16, 0.16),
        active: false, timer: 0, energy: 0, hover: 0, flash: 0, pop: 0, popV: 0, y: 0,
        light: ctx.lights.add(x, topY + 1.2, z, C.lightRadius, tint, C.lightIdle),
        // 拾取球：比晶体略大，手机上也好点中
        pickY: 0, pickR: 0.75 * k
      });
    }

    const geometry = Shaders.geometryFromSoup(soup);
    const pedestals = new THREE.Mesh(geometry, ctx.island.material);
    pedestals.name = 'crystal-pedestals';
    pedestals.layers.enable(1);
    ctx.root.add(pedestals);

    let hovered = -1, awaken = 0, awakenTimer = 0;

    function place(it, time) {
      const pulse = 1 + (C.hoverScale - 1) * it.hover + it.pop;
      it.y = it.baseY + Math.sin(time * 0.9 + it.phase) * 0.14 + it.energy * 0.3;
      it.pickY = it.y + it.k * 0.5;
      e.set(it.tilt, it.spin, it.tilt * 0.6);
      q.setFromEuler(e);
      p.set(it.x, it.y, it.z);
      s.set(it.k * pulse, it.k * pulse, it.k * pulse);
      it.mesh.setMatrixAt(0, m.compose(p, q, s));
      for (let o = 0; o < ORBITERS; o++) {
        // 小晶体绕着主晶体转，点亮后转得更快、飞得更开
        const a = it.spin * (0.7 + 0.2 * o) + o * 2.094 + it.phase, r = it.k * (0.5 + 0.12 * o + 0.22 * it.energy);
        p.set(it.x + Math.cos(a) * r, it.y + it.k * (0.25 + 0.22 * o) + Math.sin(time * 1.3 + o * 2.0 + it.phase) * 0.12, it.z + Math.sin(a) * r);
        e.set(a * 1.3, a * 0.7, a);
        q.setFromEuler(e);
        const ks = it.k * (0.2 + 0.05 * o) * pulse;
        s.set(ks, ks, ks);
        it.mesh.setMatrixAt(1 + o, m.compose(p, q, s));
      }
      it.mesh.instanceMatrix.needsUpdate = true;
    }

    function litCount() {
      let n = 0;
      for (let i = 0; i < items.length; i++) if (items[i].active) n++;
      return n;
    }

    function worldPosition(i, out) {
      const it = items[i];
      return out.set(it.x, it.pickY, it.z).applyMatrix4(ctx.root.matrixWorld);
    }

    function activate(i) {
      const it = items[i];
      if (!it) return false;
      it.active = true;
      it.timer = C.activeHold;
      it.flash = 1;
      it.popV += 5.5;
      ctx.events.emit('crystal', { index: i, position: worldPosition(i, tmp), tint: it.tint, size: it.size, lit: litCount(), total: items.length });
      if (awaken === 0 && litCount() === items.length) {
        awaken = 1;
        awakenTimer = C.awakenDuration;
        ctx.events.emit('awaken', { duration: C.awakenDuration });
      }
      return true;
    }

    // 射线与各拾取球求交，返回最近的一颗；origin / dir 为世界坐标
    function pick(origin, dir) {
      let best = -1, bestT = Infinity;
      for (let i = 0; i < items.length; i++) {
        worldPosition(i, tmp).sub(origin);
        const t = tmp.dot(dir);
        if (t < 0) continue;
        const d2 = tmp.lengthSq() - t * t, r = items[i].pickR;
        if (d2 < r * r && t < bestT) { bestT = t; best = i; }
      }
      return best;
    }

    function update(dt, time) {
      const shared = ctx.shared;
      if (awaken === 1) {
        awakenTimer -= dt;
        if (awakenTimer <= 0) {
          awaken = 0;
          for (let i = 0; i < items.length; i++) { items[i].active = false; items[i].timer = 0; }
          ctx.events.emit('rest', {});
        }
      }
      shared.uAwaken.value = Utils.damp(shared.uAwaken.value, awaken, awaken ? 2.2 : 0.9, dt);

      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        if (it.active && awaken === 0) {
          it.timer -= dt;
          if (it.timer <= 0) { it.active = false; ctx.events.emit('fade', { index: i, lit: litCount(), total: items.length }); }
        }
        it.energy = Utils.damp(it.energy, it.active ? 1 : 0, it.active ? 5 : 1.2, dt);
        it.hover = Utils.damp(it.hover, hovered === i ? 1 : 0, 12, dt);
        it.flash = Math.max(0, it.flash - dt * 1.7);
        it.popV += (-110 * it.pop - 10 * it.popV) * dt;
        it.pop += it.popV * dt;
        it.spin += dt * (0.35 + 1.9 * it.energy + 0.8 * it.hover);
        it.state.x = it.energy; it.state.y = it.hover; it.state.w = it.flash * it.flash;
        it.light.y = it.y + it.k * 0.5;
        it.light.intensity = (Utils.lerp(C.lightIdle, C.lightActive, it.energy) + it.flash * 2.5 + it.hover * 0.4) * (0.3 + 0.7 * shared.uGlow.value) * (1 + shared.uAwaken.value * 0.6);
        place(it, time);
      }
    }

    function dispose() {
      for (let i = 0; i < items.length; i++) {
        ctx.root.remove(items[i].mesh);
        items[i].material.dispose();
      }
      ctx.root.remove(pedestals);
      geometry.dispose();
      unit.dispose();
    }

    ctx.crystals = items;
    update(0, 0);
    return {
      items: items, count: items.length, pick: pick, activate: activate, litCount: litCount, worldPosition: worldPosition,
      setHover: function (i) { hovered = i; }, getHover: function () { return hovered; },
      isAwake: function () { return awaken === 1; },
      update: update, dispose: dispose
    };
  });
})();

'use strict';

// 遗迹：低处平台上的石砌圆坛与符文环、残柱、通往主台地的台阶和拱门、暖光石灯、立石与散落的巨石。
(function () {
  const smooth = Terrain.smooth;

  App.register('ruins', function (ctx) {
    const field = ctx.field, noise = ctx.noise, rng = Utils.makeRng(Config.seed + 83), c = Utils.rgb;
    const soup = new Geo.Soup();

    const plaza = field.plaza;
    const HI = Config.quality.detail > 0;

    // 石头的通用上色：冷灰抖动 + 顶面苔藓 + 贴地处压暗
    function paintStone(start, groundY, glow) {
      soup.paint(start, function (v) {
        const jit = Underside.faceJitter(noise, v);
        let col = Utils.mix3(stoneA, stoneB, 0.2 + 0.8 * jit);
        if (v.ny > 0.6 && noise.n3(v.cx * 0.9, v.cy, v.cz * 0.9) > 0.05) col = Utils.mix3(col, moss, 0.7);
        v.r = col[0]; v.g = col[1]; v.b = col[2];
        v.ao = 0.62 + 0.38 * smooth(0, 0.9, v.cy - groundY);
        if (glow) glow(v, jit);
      });
    }

    // ---- 圆坛：两圈石板 + 中间一道发光符文环
    const py = field.top(plaza.x, plaza.z);
    let start = soup.mark();
    const ringsOfSlabs = HI ? [[1.1, 7], [1.95, 12], [2.72, 17], [3.3, 22]] : [[1.95, 10], [2.72, 15]];
    for (let r = 0; r < ringsOfSlabs.length; r++) {
      const rad = ringsOfSlabs[r][0], n = ringsOfSlabs[r][1];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + r * 0.2, st = soup.mark();
        Geo.block(soup, 2 * Math.PI * rad / n * 0.9, rng.range(0.12, 0.2), r === 3 ? 0.4 : 0.62, 0.035, 0.96);
        soup.transform(st, Geo.trs([plaza.x + Math.cos(a) * rad, py - 0.03, plaza.z - Math.sin(a) * rad], [0, a + Math.PI / 2, 0], 1));
      }
    }
    paintStone(start, py - 0.4);
    start = Geo.lathe(soup, [[2.4, 0.02], [2.4, 0.13], [2.27, 0.13]], HI ? 48 : 30, { capStart: false, capEnd: false });
    soup.transform(start, Geo.trs([plaza.x, py, plaza.z], null, 1));
    soup.paint(start, function (v) {
      // 每隔几段留一个缺口，像断续的铭文
      const on = noise.hash(v.face >> 2, 5, 31) > 0.3;
      v.r = rune[0]; v.g = rune[1]; v.b = rune[2];
      v.e = on ? 1.7 : 0.15; v.ph = 0.55;
    });

    // ---- 残柱：围着圆坛一圈，高矮不一，朝台阶的方向留出入口
    function pillar(x, z, h, whole) {
      const y = field.top(x, z) - 0.2, st = soup.mark(), r = 0.36;
      if (HI) {
        // 高模：16 边带凹槽的柱身，每隔一段一道鼓石接缝；柱础和柱头各两层线脚
        const profile = [[r * 1.6, 0], [r * 1.6, 0.22], [r * 1.48, 0.3], [r * 1.22, 0.36], [r * 1.22, 0.46], [r * 1.04, 0.56]];
        const shaft0 = profile.length, drums = Math.max(1, Math.round((h - 0.6) / 0.8));
        for (let d = 0; d < drums; d++) {
          const y0 = 0.6 + (h - 0.6) * d / drums, y1 = 0.6 + (h - 0.6) * (d + 1) / drums, k = 1 - 0.1 * (d + 1) / drums;
          profile.push([r * (k + 0.02), y0], [r * k, y1 - 0.05], [r * k * 0.93, y1 - 0.03], [r * k * 0.93, y1]);
        }
        const shaft1 = profile.length;
        if (whole) profile.push([r * 1.12, h + 0.06], [r * 1.34, h + 0.16], [r * 1.34, h + 0.24], [r * 1.56, h + 0.32], [r * 1.56, h + 0.52]);

        }
      } else {
        const profile = [[r * 1.55, 0], [r * 1.55, 0.3], [r * 1.15, 0.42], [r, 0.6], [r * 0.9, h]];
        if (whole) profile.push([r * 1.3, h + 0.14], [r * 1.5, h + 0.28], [r * 1.5, h + 0.5]);
        Geo.lathe(soup, profile, 8, { capStart: false, capEnd: true, radial: function (i, j) { return i > 2 && i < 5 ? (j % 2 ? 0.93 : 1.04) : 1; } });

    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2 + 0.35, x = plaza.x + Math.cos(a) * 3.75, z = plaza.z - Math.sin(a) * 3.75;

    const p0 = field.path[0], p1 = field.path[1];
    const dirX = p1[0] - p0[0], dirZ = p1[1] - p0[1], dl = Math.sqrt(dirX * dirX + dirZ * dirZ), ry = Math.atan2(dirX, dirZ);
    start = soup.mark();
    for (let i = 0; i < 6; i++) {
      const f = -0.12 + i * 0.2, x = p0[0] + dirX * f, z = p0[1] + dirZ * f, st = soup.mark();
      Geo.block(soup, 2.5 - i * 0.08, 0.46, 0.62, 0.04, 0.97);

    paintStone(start, -2.2);

    const ax = p0[0] + dirX * 1.08, az = p0[1] + dirZ * 1.08, ay = field.top(ax, az) - 0.25;
    const archStart = soup.mark(), span = 1.55, legH = 3.0;
    for (let side = -1; side <= 1; side += 2) {
      const st = Geo.block(soup, 0.74, legH, 0.86, 0.06, 0.94);

      const cap = Geo.block(soup, 0.98, 0.24, 1.06, 0.05, 1);

    for (let k = 0; k < N; k++) {
      const a = Math.PI * (k + 0.5) / N, st = Geo.block(soup, Math.PI * span / N * 1.12, k === KEY ? 0.74 : 0.56, 0.8, 0.045, 1.12);
      soup.transform(st, Geo.trs([Math.cos(a) * (span - 0.28), legH + 0.24 + Math.sin(a) * (span - 0.28), 0], [0, 0, a - Math.PI / 2], 1));

    const inlayStart = soup.mark();
    for (let side = -1; side <= 1; side += 2) {
      const st = Geo.block(soup, 0.1, 1.7, 0.92, 0, 1);

    const gem = Geo.lathe(soup, [[0.01, -0.3], [0.2, 0], [0.01, 0.3]], 4, { capStart: false, capEnd: false });
    soup.transform(gem, Geo.trs([0, legH + 0.24 + span - 0.02, 0], [Math.PI / 2, 0, 0], [1, 1.6, 1]));
    soup.transform(inlayStart, archMatrix);
    soup.paint(inlayStart, function (v) {

    const lamps = [];
    function lantern(x, z, scale) {
      const y = field.top(x, z) - 0.12, st = soup.mark();
      Geo.block(soup, 0.62, 0.2, 0.62, 0.03, 0.9);
      let s2 = Geo.block(soup, 0.24, 0.95, 0.24, 0.02, 0.85); soup.transform(s2, Geo.trs([0, 0.2, 0], null, 1));
      s2 = Geo.block(soup, 0.56, 0.1, 0.56, 0.02, 1); soup.transform(s2, Geo.trs([0, 1.15, 0], null, 1));
      const lampStart = Geo.block(soup, 0.38, 0.4, 0.38, 0, 1); soup.transform(lampStart, Geo.trs([0, 1.25, 0], null, 1));
      const roofStart = Geo.block(soup, 0.8, 0.3, 0.8, 0, 0.18); soup.transform(roofStart, Geo.trs([0, 1.65, 0], null, 1));
      soup.transform(st, Geo.trs([x, y, z], [0, rng.range(0, 1.5), 0], scale));
      const lo = y + 1.25 * scale, hi = y + 1.65 * scale;
      paintStone(st, y + 0.1, function (v) {
        if (v.cy > lo && v.cy < hi && Math.abs(v.ny) < 0.3) { v.r = warm[0]; v.g = warm[1]; v.b = warm[2]; v.e = 3.0; v.ph = rng.next(); v.ao = 1; }
      });
      lamps.push({ x: x, y: y + 1.45 * scale, z: z });

    const sideX = Math.cos(ry), sideZ = -Math.sin(ry);
    lantern(p0[0] + sideX * 1.75 - dirX * 0.1, p0[1] + sideZ * 1.75 - dirZ * 0.1, 1.05);

    lantern(field.pond.x + 1.9, field.pond.z + 1.3, 0.9);

    const monoliths = [[5.6, -4.6, 3.6], [7.0, -3.4, 2.6], [-6.3, -6.2, 3.1]];
    for (let i = 0; i < monoliths.length; i++) {
      const mo = monoliths[i], y = field.top(mo[0], mo[1]) - 0.3, st = Geo.block(soup, 1.0, mo[2], 0.62, 0.09, 0.62);
      const matrix = Geo.trs([mo[0], y, mo[1]], [rng.range(-0.09, 0.09), rng.range(0, 3), rng.range(-0.09, 0.09)], 1);
      soup.transform(st, matrix);

      const inlay = soup.mark();
      let b = Geo.block(soup, 0.09, mo[2] * 0.42, 0.6, 0, 1); soup.transform(b, Geo.trs([0, mo[2] * 0.3, 0], null, 1));
      b = Geo.block(soup, 0.36, 0.08, 0.56, 0, 1); soup.transform(b, Geo.trs([0, mo[2] * 0.62, 0], null, 1));
      b = Geo.block(soup, 0.26, 0.08, 0.62, 0, 1); soup.transform(b, Geo.trs([0, mo[2] * 0.38, 0], null, 1));

    paintStone(start, -0.6);

    // ---- 碎石：小径两侧、溪边和石头脚下的小石子，草面和石面之间的过渡
    start = soup.mark();
    placed = 0; guard = 0;
    const pebbles = Math.round(Config.island.pebbles * Config.quality.density);
    while (placed < pebbles && guard++ < pebbles * 12) {
      const a = rng.range(0, Math.PI * 2), k = Math.sqrt(rng.next()), R = field.edgeR(Math.cos(a), Math.sin(a)) - 0.4;
      const x = Math.cos(a) * R * k, z = Math.sin(a) * R * k;

      Geo.blob(soup, [x, field.top(x, z) + size * 0.2, z], [size * rng.range(0.9, 1.5), size * rng.range(0.5, 0.8), size * rng.range(0.9, 1.5)], 0);
      placed++;
    }
    paintStone(start, -9);

    const geometry = Shaders.geometryFromSoup(soup);
    const mesh = new THREE.Mesh(geometry, ctx.island.material);
    mesh.name = 'ruins';
    mesh.layers.enable(1);
    ctx.root.add(mesh);

      triangles: soup.triangles(), lamps: lamps,

        const k = 0.3 + 0.7 * ctx.shared.uGlow.value;

      },

'use strict';

// 植被：成片的草丛（合并成一个网格，顶点着色器里随风摆）、发光小花、树根旁的荧光蘑菇。
(function () {
  App.register('flora', function (ctx) {
    const field = ctx.field, noise = ctx.noise, C = Config.island, T = Config.tree, c = Utils.rgb;
    const rng = Utils.makeRng(Config.seed + 97), density = Config.quality.density;
    const soup = new Geo.Soup();
    const n = [0, 1, 0];
    const HI = Config.quality.detail > 0;

    function blocked(x, z, pathMargin) {
      const px = x - field.pond.x, pz = z - field.pond.z, qx = x - field.plaza.x, qz = z - field.plaza.z;
      return px * px + pz * pz < 2.6 || qx * qx + qz * qz < 9.6 ||
        field.distToPath(x, z, field.stream) < 0.8 || field.distToPath(x, z, field.path) < pathMargin;
    }

    function scatter(count, margin, pathMargin, fn) {
      let placed = 0, guard = 0;
      while (placed < count && guard++ < count * 8) {
        const a = rng.range(0, Math.PI * 2), k = Math.sqrt(rng.next());
        const R = field.edgeR(Math.cos(a), Math.sin(a)) - margin, x = Math.cos(a) * R * k, z = Math.sin(a) * R * k;
        if (blocked(x, z, pathMargin)) continue;
        if (fn(x, z) !== false) placed++;
      }
    }

    // ---- 草：每丛几片叶；高模每片三个三角形、中段弯一下，低模是单三角。法线直接用地形法线，草和地面的明暗才会连成一片
    const tip = c(0x9be07a), tipCool = c(0x7fe0c8);
    const grassStart = soup.mark();
    const blades = [];
    scatter(Math.round(C.grassClumps * density), 0.35, 0.55, function (x, z) {
      // 草成片生长：噪声低的地方留成空地
      const patchiness = noise.fbm(x * 0.45, 7.0, z * 0.45, 2);
      if (patchiness < -0.18 && rng.next() < 0.8) return false;
      const y = field.top(x, z), base = Island.grassColor(field, noise, x, z);
      const tall = (0.32 + 0.4 * rng.next()) * (1 + 0.7 * Math.max(0, patchiness)) * (field.terraceMask(x, z) > 0.5 ? 0.7 : 1);
      field.normal(x, z, n);
      const top = Utils.mix3(base, rng.next() < 0.25 ? tipCool : tip, 0.55);
      for (let b = 0; b < C.grassBlades + (HI ? 1 : 0); b++) {
        const a = rng.range(0, Math.PI * 2), h = tall * rng.range(0.6, 1.1), w = 0.055 + 0.05 * rng.next(), lean = rng.range(0.1, 0.5) * h;
        const ox = x + rng.range(-0.16, 0.16), oz = z + rng.range(-0.16, 0.16), cx = Math.cos(a), sz = Math.sin(a);
        const l0 = [ox - sz * w, y - 0.04, oz + cx * w], r0 = [ox + sz * w, y - 0.04, oz - cx * w], t = [ox + cx * lean, y + h, oz + sz * lean];
        const blade = { base: base, top: top, nx: n[0], ny: n[1], nz: n[2], ph: rng.next(), y: y, h: h };
        if (HI) {
          const mx = ox + cx * lean * 0.3, mz = oz + sz * lean * 0.3, my = y + h * 0.52, mw = w * 0.62;
          const l1 = [mx - sz * mw, my, mz + cx * mw], r1 = [mx + sz * mw, my, mz - cx * mw];
          soup.tri(l0, r0, r1); soup.tri(l0, r1, l1); soup.tri(l1, r1, t);
          blades.push(blade, blade, blade);
        } else {
          soup.tri(l0, r0, t);
          blades.push(blade);
        }
      }
    });
    soup.paint(grassStart, function (v) {
      const b = blades[v.face], k = Utils.clamp((v.y - b.y + 0.04) / (b.h + 0.04), 0, 1);
      v.nx = b.nx; v.ny = b.ny; v.nz = b.nz;
      v.r = b.base[0] + (b.top[0] - b.base[0]) * k; v.g = b.base[1] + (b.top[1] - b.base[1]) * k; v.b = b.base[2] + (b.top[2] - b.base[2]) * k;
      // 摆幅按高度的平方：根不动，中段微动，叶尖摆得最开
      v.s = k * k * (0.2 + 0.25 * b.h); v.ph = b.ph; v.ao = 0.72 + 0.28 * k;
    });

    // ---- 花：细茎 + 一朵发光小花（高模六瓣带花心，低模四瓣），成簇分布
    const petalTints = [c(0xff9ee6), c(0x8ff3ff), c(0xfff2b0), c(0xc9a2ff)];
    const flowerStart = soup.mark();
    const flowers = [];
    const heart = c(0xfff6c8);
    scatter(Math.round(C.flowers * density / 4), 0.6, 0.7, function (x, z) {
      const tint = petalTints[Math.floor(rng.next() * petalTints.length)];
      for (let k = 0; k < 4; k++) {
        const fx = x + rng.range(-0.55, 0.55), fz = z + rng.range(-0.55, 0.55);
        if (!field.inside(fx, fz, 0.3)) continue;
        const y = field.top(fx, fz), h = rng.range(0.3, 0.62), r = rng.range(0.07, 0.11), a0 = rng.range(0, 6), ph = rng.next();
        const before = soup.triangles();
        soup.tri([fx - 0.02, y, fz], [fx + 0.02, y, fz], [fx, y + h, fz]);
        let stems = 1, hearts = 0;
        if (HI) {
          // 十字交叉的第二片茎 + 一片小叶，侧着看也不会变成一条线
          soup.tri([fx, y, fz - 0.02], [fx, y, fz + 0.02], [fx, y + h, fz]);
          const la = a0 + 1.3, lx = Math.cos(la), lz = Math.sin(la);
          soup.tri([fx, y + h * 0.3, fz], [fx + lx * 0.13 - lz * 0.035, y + h * 0.5, fz + lz * 0.13 + lx * 0.035], [fx + lx * 0.2, y + h * 0.42, fz + lz * 0.2]);
          stems = 3;
          const top = [fx, y + h, fz], P = 6;
          for (let p = 0; p < P; p++) {
            const a = a0 + p * Math.PI * 2 / P, lift = (p % 2 ? 0.5 : 0.34) * r;
            const tipP = [fx + Math.cos(a) * r * 1.15, y + h + lift, fz + Math.sin(a) * r * 1.15];
            soup.tri(top, [fx + Math.cos(a - 0.4) * r * 0.62, y + h + lift * 0.45, fz + Math.sin(a - 0.4) * r * 0.62], tipP);
            soup.tri(top, tipP, [fx + Math.cos(a + 0.4) * r * 0.62, y + h + lift * 0.45, fz + Math.sin(a + 0.4) * r * 0.62]);
          }
          const apex = [fx, y + h + r * 0.34, fz];
          for (let p = 0; p < 3; p++) {
            const a = a0 + p * 2.094, b = a + 2.094, hr = r * 0.24;
            soup.tri([fx + Math.cos(a) * hr, y + h + r * 0.1, fz + Math.sin(a) * hr], [fx + Math.cos(b) * hr, y + h + r * 0.1, fz + Math.sin(b) * hr], apex);
          }
          hearts = 3;
        } else {
          for (let p = 0; p < 4; p++) {
            const a = a0 + p * Math.PI / 2, b = a + Math.PI / 2;
            soup.tri([fx, y + h, fz], [fx + Math.cos(a) * r, y + h + r * 0.5, fz + Math.sin(a) * r], [fx + Math.cos(b) * r, y + h + r * 0.5, fz + Math.sin(b) * r]);
          }
        }
        const end = soup.triangles();
        for (let t = before; t < end; t++) flowers.push({ stem: t < before + stems, tint: t >= end - hearts ? heart : tint, ph: ph, y: y, h: h });
      }
    });
    const stemCol = c(0x3c8a5a);
    soup.paint(flowerStart, function (v) {
      const f = flowers[v.face];
      v.nx = 0; v.ny = 1; v.nz = 0;
      const col = f.stem ? stemCol : f.tint;
      v.r = col[0]; v.g = col[1]; v.b = col[2];
      v.e = f.stem ? 0 : 1.5;
      v.s = 0.3 * Utils.clamp((v.y - f.y) / f.h, 0, 1); v.ph = f.ph;
    });

    // ---- 蘑菇：树根周围和石头边，伞盖发光
    const shroomStart = soup.mark();
    const capTints = [c(0x66f0ff), c(0xb48cff), c(0x7dffc8)];
    const shrooms = [];
    for (let i = 0; i < C.mushrooms; i++) {
      const nearTree = i % 3 !== 0, a = rng.range(0, Math.PI * 2), d = nearTree ? rng.range(1.5, 4.2) : rng.range(5, 9.5);
      const x = (nearTree ? T.x : 0) + Math.cos(a) * d, z = (nearTree ? T.z : 0) + Math.sin(a) * d;
      if (!field.inside(x, z, 0.5) || blocked(x, z, 0.6)) continue;
      const s = rng.range(0.16, 0.36);
      shroom(x, z, s, capTints[i % 3]);
      // 高模：大蘑菇脚边再长一两朵小的
      for (let k = 0; HI && k < 1 + (i % 2); k++) {
        const b = rng.range(0, Math.PI * 2), sx = x + Math.cos(b) * s * 1.5, sz = z + Math.sin(b) * s * 1.5;
        if (field.inside(sx, sz, 0.4)) shroom(sx, sz, s * rng.range(0.4, 0.62), capTints[i % 3]);
      }
    }
    function shroom(x, z, s, tint) {
      const st = soup.mark(), y = field.top(x, z);
      if (HI) {
        Geo.lathe(soup, [[s * 0.22, 0], [s * 0.16, s * 0.55], [s * 0.14, s * 1.2], [s * 0.62, s * 1.1], [s * 0.96, s * 1.17], [s * 0.93, s * 1.36], [s * 0.7, s * 1.6], [s * 0.34, s * 1.78]], 9, { phase: rng.range(0, 6), capStart: false, capEnd: true });
      } else {
        Geo.lathe(soup, [[s * 0.2, 0], [s * 0.15, s * 1.25], [s * 0.95, s * 1.15], [s * 0.72, s * 1.55], [s * 0.3, s * 1.82]], 6, { phase: rng.range(0, 6), capStart: false, capEnd: true });
      }
      soup.transform(st, Geo.trs([x, y - 0.03, z], [rng.range(-0.25, 0.25), 0, rng.range(-0.25, 0.25)], 1));
      shrooms.push({ end: soup.mark(), tint: tint, y: y, s: s, ph: rng.next() });
    }
    let cursor = 0;
    const stalk = c(0xc9c4e8);
    soup.paint(shroomStart, function (v) {
      while (soup.painted + v.face * 3 >= shrooms[cursor].end) cursor++;
      const m = shrooms[cursor], cap = v.cy - m.y > m.s * 1.05, col = cap ? m.tint : stalk;
      v.r = col[0]; v.g = col[1]; v.b = col[2];
      v.e = cap ? 1.7 : 0.25; v.ph = m.ph;
    });

    const geometry = Shaders.geometryFromSoup(soup);
    // 草叶只有一层三角形：双面渲染，但不投影（进了阴影贴图只会是噪点）
    const material = Shaders.litMaterial(ctx.shared, 'lit-foliage');
    material.side = THREE.DoubleSide;
    const mesh = new THREE.Mesh(geometry, material);
    mesh.name = 'flora';
    ctx.root.add(mesh);

    return {
      triangles: soup.triangles(),
      dispose: function () { ctx.root.remove(mesh); geometry.dispose(); material.dispose(); }
    };
  });
})();

// ===== water.js =====
'use strict';

// 水：树旁的泉眼、流向西侧崖边的溪水、从崖边坠入云海的瀑布。
// 三段共用一个网格和一个着色器，靠 flow 属性（x 类型：0 泉 1 溪 2 瀑布，y 淡出）区分。
(function () {
  const vertex = `
attribute vec2 flow;
varying vec2 vUv;
varying vec2 vFlow;
varying vec3 vWorld;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vUv = uv;
  vFlow = flow;
  vWorld = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

  const fragment = `
varying vec2 vUv;
varying vec2 vFlow;
varying vec3 vWorld;
${Shaders.common}
void main() {
  vec3 v = normalize(cameraPosition - vWorld);
  float fall = step(1.5, vFlow.x);
  float still = 1.0 - step(0.5, vFlow.x);
  // 沿流向滚动的噪声：溪水慢、瀑布快，泉眼只向外荡开涟漪
  float speed = mix(mix(0.55, 0.12, still), 2.6, fall);
  vec2 fuv = vec2(vUv.x * mix(2.4, 5.0, fall), vUv.y * mix(0.8, 0.32, fall) - uTime * speed);
  float n1 = fbm2(fuv * vec2(1.6, 1.0));
  float n2 = vnoise(fuv * vec2(4.0, 2.2) + vec2(11.0, 3.0));
  float streak = smoothstep(0.5, 0.82, n1 * 0.75 + n2 * 0.45);
  float ripple = still * (0.5 + 0.5 * sin(vUv.y * 9.0 - uTime * 1.6)) * smoothstep(0.1, 0.9, vUv.y);
  vec3 n = normalize(vec3((n1 - 0.5) * 0.7, 1.0, (n2 - 0.5) * 0.7));
  float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
  float spec = pow(max(dot(reflect(-v, n), uBodyDir), 0.0), 48.0);
  vec3 tint = vec3(0.07, 0.62, 1.0);
  vec3 deep = vec3(0.012, 0.06, 0.15) * (0.5 + uSkyColor * 6.0);
  vec3 col = mix(deep, uSkyColor * 1.9 + uSunColor * 0.12, fres);
  // 魔法泉水自己发光：夜里是岛上的一条亮线，白天退成普通的水色
  col += tint * (0.1 + 0.55 * streak + 0.22 * ripple) * (0.2 + uGlow) * (1.0 + uAwaken * 1.5);
  col += uSunColor * spec * 1.6;
  float edge = smoothstep(0.0, 0.16, vUv.x) * smoothstep(1.0, 0.84, vUv.x);
  float alpha = mix(0.8, 0.96, fres);
  // 瀑布：一条条的水帘，越往下越散
  vec3 veil = mix(tint * 0.8, vec3(0.75, 0.95, 1.0), streak) * (uSkyColor * 2.2 + uSunColor * 0.35 + vec3(0.9 * uGlow));
  col = mix(col, veil * (1.0 + uAwaken), fall);
  alpha = mix(alpha * mix(1.0, edge, 1.0 - still), (0.22 + 0.78 * streak) * edge * vFlow.y, fall);
  col = applyFog(col, vWorld, cameraPosition);
  gl_FragColor = vec4(encodeOut(col), alpha);
}
`;

  App.register('water', function (ctx) {
    const field = ctx.field, c = Utils.rgb;
    const pos = [], uv = [], flow = [];

    function vert(p, u, v, kind, fade) {
      pos.push(p[0], p[1], p[2]); uv.push(u, v); flow.push(kind, fade);
    }
    function quad(a, b, cc, d) {
      const order = [a, b, cc, a, cc, d];
      for (let i = 0; i < 6; i++) vert(order[i].p, order[i].u, order[i].v, order[i].k, order[i].f);
    }

    // ---- 泉眼：水面高度固定，岸线沿每个方向找到地面高出水面的位置
    const pond = field.pond, level = field.top(pond.x, pond.z) + 0.62;
    const SECT = 18, rim = [];
    for (let j = 0; j < SECT; j++) {
      const a = (j / SECT) * Math.PI * 2, cx = Math.cos(a), sz = Math.sin(a);
      let r = 0.4;
      while (r < 1.85 && field.top(pond.x + cx * r, pond.z + sz * r) < level) r += 0.08;
      r += 0.12;
      const x = pond.x + cx * r, z = pond.z + sz * r;
      rim.push({ p: [x, Math.min(level, field.top(x, z) + 0.05), z], u: 0.5, v: 1, k: 0, f: 1 });
    }
    const centre = { p: [pond.x, level, pond.z], u: 0.5, v: 0, k: 0, f: 1 };
    for (let j = 0; j < SECT; j++) {
      const a = rim[j], b = rim[(j + 1) % SECT], order = [centre, b, a];
      for (let i = 0; i < 3; i++) vert(order[i].p, order[i].u, order[i].v, 0, 1);
    }

    // ---- 溪水：沿样条铺一条三列顶点的带子，走到崖边为止
    const line = Geo.spline(field.stream.map(function (p) { return [p[0], 0, p[1]]; }), 44);
    const rows = [];
    let length = 0, end = null;
    for (let i = 2; i < line.length - 1; i++) {
      const p = line[i], q = line[i + 1];
      let tx = q[0] - p[0], tz = q[2] - p[2];
      const tl = Math.sqrt(tx * tx + tz * tz) || 1;
      tx /= tl; tz /= tl;
      if (!field.inside(p[0], p[2], 0.05)) { end = { x: p[0], z: p[2], tx: tx, tz: tz }; break; }
      const near = Terrain.smooth(2.4, 0.9, length);
      const y = Utils.lerp(field.top(p[0], p[2]) + 0.2, level - 0.02, near);
      const w = 0.62 + 0.1 * Math.sin(i * 0.9);
      rows.push({
        l: { p: [p[0] + tz * w, y - 0.05, p[2] - tx * w], u: 0, v: length, k: 1, f: 1 },
        m: { p: [p[0], y, p[2]], u: 0.5, v: length, k: 1, f: 1 },
        r: { p: [p[0] - tz * w, y - 0.05, p[2] + tx * w], u: 1, v: length, k: 1, f: 1 },
        y: y, w: w
      });
      length += tl;
    }
    for (let i = 0; i < rows.length - 1; i++) {
      quad(rows[i].l, rows[i].m, rows[i + 1].m, rows[i + 1].l);
      quad(rows[i].m, rows[i].r, rows[i + 1].r, rows[i + 1].m);
    }

    // ---- 瀑布：从溪水尽头沿抛物线坠落，越往下越宽、越淡
    const last = rows[rows.length - 1], lip = line[rows.length + 1];
    const dir = end || { x: lip[0], z: lip[2], tx: -1, tz: 0 };
    const FALL = 16, T_END = 2.45, V0 = 1.7, G = 9.0;
    const fallRows = [];
    for (let i = 0; i <= FALL; i++) {
      const f = i / FALL, t = T_END * Math.pow(f, 0.72);
      const x = lip[0] + dir.tx * V0 * t, z = lip[2] + dir.tz * V0 * t, y = last.y - 0.5 * G * t * t;
      const w = last.w * (1 + 1.3 * f), fade = 1 - Math.pow(f, 1.6), v = length + 0.5 * G * t * t + V0 * t;
      // 中间一列略向外鼓，水帘才有体积
      const bulge = 0.25 * Math.sin(Math.min(1, f * 4) * Math.PI * 0.5);
      fallRows.push({
        l: { p: [x + dir.tz * w, y, z - dir.tx * w], u: 0, v: v, k: 2, f: fade },
        m: { p: [x + dir.tx * bulge, y + 0.04, z + dir.tz * bulge], u: 0.5, v: v, k: 2, f: fade },
        r: { p: [x - dir.tz * w, y, z + dir.tx * w], u: 1, v: v, k: 2, f: fade }
      });
    }
    // 第一排接在溪水最后一排上，不留缝
    fallRows[0].l.p = last.l.p; fallRows[0].m.p = last.m.p; fallRows[0].r.p = last.r.p;
    for (let i = 0; i < FALL; i++) {
      quad(fallRows[i].l, fallRows[i].m, fallRows[i + 1].m, fallRows[i + 1].l);
      quad(fallRows[i].m, fallRows[i].r, fallRows[i + 1].r, fallRows[i + 1].m);
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
    geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uv), 2));
    geometry.setAttribute('flow', new THREE.BufferAttribute(new Float32Array(flow), 2));
    geometry.computeBoundingSphere();
    const material = new THREE.ShaderMaterial({
      name: 'water', uniforms: Shaders.uniforms(ctx.shared), vertexShader: vertex, fragmentShader: fragment,
      transparent: true, depthWrite: false, side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.name = 'water';
    mesh.renderOrder = 2;
    ctx.root.add(mesh);

    const light = ctx.lights.add(pond.x, level + 0.7, pond.z, 6.5, c(0x4fd8ff), 1.1);
    const bottom = fallRows[FALL].m.p;
    // 粒子模块用这些位置放水雾和泉眼上的光点
    ctx.water = {
      pond: [pond.x, level, pond.z],
      fallTop: [last.m.p[0], last.m.p[1], last.m.p[2]],
      fallBottom: [bottom[0], bottom[1], bottom[2]],
      fallDir: [dir.tx, dir.tz], fallTime: T_END, fallSpeed: V0, gravity: G
    };

    return {
      triangles: pos.length / 9,
      update: function (dt, time) {
        light.intensity = 1.1 + 0.25 * Math.sin(time * 1.3) + ctx.shared.uAwaken.value * 1.4;
      },
      dispose: function () { ctx.root.remove(mesh); geometry.dispose(); material.dispose(); }
    };
  });
})();

// ===== satellites.js =====
'use strict';

// 主岛之外的东西：贴近主岛的小浮岛、盘旋而下的踏石、绕着岛底转的碎石与晶片、远处雾里的岛影。
// 近处的东西都放在相机最近轨道（Config.camera.minDistance）以内，镜头转到哪儿都不会穿进去。
(function () {
  const smooth = Terrain.smooth;
  const HI = Config.quality.detail > 0;

  // 在原点建一座小岛（顶面边缘 y=0）。返回 { top(x,z), under(a,t,out) } 供装饰定位
  function islet(soup, noise, rng, R, depth, seed, pal) {
    const sides = HI ? 22 : 11, edge = [], TOP = HI ? 4 : 2;
    for (let j = 0; j < sides; j++) {
      // 高模的轮廓：沿用 11 边的大起伏（相邻两点之间插值），再叠一层小的参差
      const a = noise.hash(j >> 1, seed, 1), b = noise.hash(((j + 1) >> 1) % 11, seed, 1);
      edge.push(HI ? 0.76 + 0.42 * (0.78 * (j % 2 ? (a + b) / 2 : a) + 0.22 * noise.hash(j, seed, 2)) : 0.76 + 0.42 * noise.hash(j, seed, 1));
    }
    const lx = rng.range(-0.25, 0.25) * R, lz = rng.range(-0.25, 0.25) * R;
    function rim(j, r, y) {
      const a = (j / sides) * Math.PI * 2, d = Utils.clamp(-y / depth, 0, 1);
      return [Math.cos(a) * r * edge[j] + lx * d * d, y, -Math.sin(a) * r * edge[j] + lz * d * d];
    }
    function top(x, z) { return 0.16 * R * Math.exp(-(x * x + z * z) / (0.45 * R * R)); }

    const topStart = Geo.disk(soup, TOP, sides, function (i, j) {
      if (i === TOP) return rim(j, R, 0);
      if (i === 0) return [0, top(0, 0), 0];
      const p = rim(j, R * (TOP === 2 ? 0.56 : Math.pow(i / TOP, 0.85)), 0);
      p[1] = top(p[0], p[2]);
      return p;
    }, true);
    soup.paint(topStart, function (v) {
      const col = Utils.mix3(pal.grassLo, pal.grassHi, 0.25 + 0.6 * noise.hash(Math.floor(v.cx * 2.3) + seed, 5, Math.floor(v.cz * 2.3)));
      // 法线往上收一些：小岛的草面是一整块柔和的亮面，而不是几片明暗跳变的三角形
      const l = Math.sqrt(v.nx * v.nx * 0.2 + v.ny * v.ny + v.nz * v.nz * 0.2);
      v.nx *= 0.45 / l; v.ny /= l; v.nz *= 0.45 / l;
      v.r = col[0]; v.g = col[1]; v.b = col[2];
    });

    const levels = HI ?
      [[0.03, -depth], [0.15, -depth * 0.85], [0.3, -depth * 0.66], [0.43, -depth * 0.52], [0.56, -depth * 0.38], [0.69, -depth * 0.27], [0.8, -depth * 0.17],
        [0.88, -0.2 * R], [0.95, -0.16 * R], [1.02, -0.1 * R], [1.04, -0.06 * R], [1.03, -0.02 * R], [1, 0]] :
      [[0.03, -depth], [0.3, -depth * 0.66], [0.56, -depth * 0.38], [0.8, -depth * 0.17], [0.95, -0.16 * R], [1.04, -0.06 * R], [1, 0]];
    const rough = HI ? 8 : 4;
    const rings = levels.map(function (lv, i) {
      const ring = [];
      for (let j = 0; j < sides; j++) {
        // 高模按 2×2 一块取大起伏，再叠逐点的小起伏：岩面是成块的，不是一片毛刺
        const h = HI ? 0.62 * noise.hash(i >> 1, j >> 1, seed + 9) + 0.38 * noise.hash(i, j, seed + 9) : noise.hash(i, j, seed + 9);
        ring.push(rim(j, R * lv[0] * (i > 0 && i < rough ? 0.82 + 0.36 * h : 1), lv[1]));
      }
      return ring;
    });
    const bodyStart = Geo.skin(soup, rings, false, false);
    soup.paint(bodyStart, function (v) {
      const jit = Underside.faceJitter(noise, v), d = -v.cy / R;
      let col = pal.cliff[Math.floor(v.cy * 1.3 + 60 + 2 * jit) % 3];
      col = Utils.mix3(col, pal.rockDeep, 0.8 * smooth(0.3, 1.0, -v.cy / depth));
      if (d < 0.07) col = Utils.mix3(pal.grassLo, pal.grassHi, 0.2 + 0.5 * jit);
      else if (d < 0.17) col = Utils.mix3(pal.dirt, pal.cliff[0], 0.3 + 0.4 * jit);
      v.r = col[0]; v.g = col[1]; v.b = col[2];
      v.ao = 0.55 + 0.45 * smooth(depth * 0.7, 0, -v.cy);
    });

    // 底下挂两三簇发光的晶体，和主岛岛底呼应
    const shardStart = soup.mark(), tint = pal.vein[seed % 3];
    for (let k = 0; k < (HI ? 6 : 3); k++) {
      const a = rng.range(0, Math.PI * 2), t = rng.range(0.3, 0.6), r = R * (1 - t) * 0.6;
      const h = R * rng.range(0.28, 0.5) * (k > 2 ? 0.6 : 1), w = h * 0.17;
      const st = Geo.crystal(soup, h, w, { phase: a, sides: HI ? 6 : 5, tip: [rng.range(-0.3, 0.3), rng.range(-0.3, 0.3)] });
      soup.transform(st, Geo.basis([Math.cos(a) * r + lx * t * t, -depth * t + 0.2, -Math.sin(a) * r + lz * t * t], [Math.cos(a) * 0.6, -1, -Math.sin(a) * 0.6], 1, a));
    }
    soup.paint(shardStart, function (v) {
      const k = 0.7 + 0.6 * Underside.faceJitter(noise, v);
      v.r = tint[0] * k; v.g = tint[1] * k; v.b = tint[2] * k; v.e = 2.2; v.ph = seed * 0.13;
    });
    return top;
  }

  // 岛上的点缀。kind: tree | crystal | ruin | spire
  function decorate(soup, noise, rng, kind, R, top, pal) {
    const c = Utils.rgb, start = soup.mark();
    if (kind === 'tree') {
      const h = R * 1.15, bend = rng.range(-0.3, 0.3) * R;
      const path = Geo.spline([[0, top(0, 0) - 0.1, 0], [bend * 0.6, h * 0.45, bend * 0.2], [bend, h, -bend * 0.4]], HI ? 9 : 5);
      Geo.tube(soup, path, function (t) { return R * (0.11 - 0.07 * t) * (1 + 0.5 * Math.pow(1 - t, 6)); }, HI ? 8 : 5, { capEnd: true });
      const bark = c(0x3a2d48);
      soup.paint(start, function (v) { v.r = bark[0]; v.g = bark[1]; v.b = bark[2]; v.ao = 0.75; });
      const leafStart = soup.mark(), deep = c(0x2f2a8c), mid = c(0x4a63e0), pink = c(0xc27dff);
      for (let k = 0; k < (HI ? 5 : 3); k++) {
        const a = k * 2.1 + rng.range(0, 1), d = k === 0 ? 0 : R * (k > 2 ? 0.6 : 0.42), s = R * (k === 0 ? 0.62 : (k > 2 ? 0.3 : 0.44));
        Geo.blob(soup, [bend + Math.cos(a) * d, h + (k === 0 ? s * 0.3 : -s * 0.1), -bend * 0.4 + Math.sin(a) * d], [s, s * 0.62, s], HI ? 2 : 1, function (x, y, z) {
          return HI ? 0.86 + 0.3 * noise.n3(x * 2.1 + k * 7, y * 2.1, z * 2.1) + 0.1 * noise.n3(x * 5.5, y * 5.5 + k, z * 5.5) :
            0.8 + 0.4 * noise.hash(Math.floor(x * 9 + 20), Math.floor(y * 9 + 20), Math.floor(z * 9 + 20) + k);
        });
      }
      soup.paint(leafStart, function (v) {
        const jit = Underside.faceJitter(noise, v), up = smooth(-0.4, 0.8, v.ny);
        const col = Utils.mix3(Utils.mix3(deep, mid, up), pink, jit > 0.72 ? 0.7 : 0);
        v.r = col[0]; v.g = col[1]; v.b = col[2];
        v.e = 0.35 + 0.5 * jit; v.ph = jit; v.s = 0.05; v.ao = 0.6 + 0.4 * up;
      });
    } else if (kind === 'crystal') {
      const tint = pal.vein[Math.floor(rng.next() * 3)];
      for (let k = 0; k < (HI ? 8 : 5); k++) {
        const a = k * 1.4 + rng.range(0, 0.6), d = k === 0 ? 0 : R * rng.range(0.2, 0.45), h = R * (k === 0 ? 1.05 : rng.range(0.35, 0.7) * (k > 4 ? 0.6 : 1)), w = h * 0.16;
        const st = Geo.crystal(soup, h, w, { phase: a, bevel: HI && k === 0 ? 0.22 : 0, tip: [rng.range(-0.25, 0.25), rng.range(-0.25, 0.25)] });
        soup.transform(st, Geo.basis([Math.cos(a) * d, top(0, 0) * 0.5 - 0.1, Math.sin(a) * d], [Math.cos(a) * (k === 0 ? 0.05 : 0.4), 1, Math.sin(a) * (k === 0 ? 0.05 : 0.4)], 1, a));
      }
      soup.paint(start, function (v) {
        const k = 0.6 + 0.8 * Underside.faceJitter(noise, v);
        v.r = tint[0] * k; v.g = tint[1] * k; v.b = tint[2] * k; v.e = 1.9; v.ph = k;
      });
    } else {
      // ruin：几根断柱；spire：远岛上的石峰（同一套做法，只是更高更粗）
      const spire = kind === 'spire', count = spire ? 3 : 4;
      for (let k = 0; k < count; k++) {
        const a = k * (Math.PI * 2 / count) + rng.range(-0.3, 0.3), d = R * (spire ? rng.range(0.1, 0.45) : 0.5);
        const h = R * (spire ? rng.range(0.7, 1.7) : rng.range(0.3, 0.95)), w = spire ? h * 0.2 : R * 0.085;
        const x = Math.cos(a) * d, z = Math.sin(a) * d;
        const profile = spire ? (HI ? [[w, 0], [w * 0.92, h * 0.2], [w * 0.8, h * 0.4], [w * 0.64, h * 0.6], [w * 0.45, h * 0.8], [w * 0.22, h * 0.93], [0.02, h]] : [[w, 0], [w * 0.8, h * 0.4], [w * 0.45, h * 0.8], [0.02, h]]) : [[w * 1.35, 0], [w * 1.35, w * 0.6], [w, w * 0.8], [w * 0.92, h], [w * 0.5, h + w * 0.5]];
        const st = Geo.lathe(soup, profile, (spire ? 5 : 6) * (HI ? 2 : 1), { phase: a, capStart: false, capEnd: true, radial: function (i, j) { return 0.85 + 0.3 * noise.hash(i, HI ? j >> 1 : j, k + 31) + (HI ? 0.08 * noise.hash(i, j, k + 37) : 0); } });
        soup.transform(st, Geo.trs([x, top(x, z) - 0.1, z], [rng.range(-0.12, 0.12), 0, rng.range(-0.12, 0.12)], 1));
      }
      const a0 = c(0x5f6180), a1 = c(0x9a9cb6);
      soup.paint(start, function (v) {
        const jit = Underside.faceJitter(noise, v);
        let col = spire ? Utils.mix3(pal.cliff[0], pal.cliff[2], jit) : Utils.mix3(a0, a1, jit);
        if (v.ny > 0.5) col = Utils.mix3(col, pal.moss, 0.5);
        v.r = col[0]; v.g = col[1]; v.b = col[2];
        v.ao = 0.6 + 0.4 * smooth(0, R * 0.4, v.cy);
      });
    }
  }

  App.register('satellites', function (ctx) {
    const noise = ctx.noise, pal = Island.palette(), S = Config.satellites, c = Utils.rgb;
    const rng = Utils.makeRng(Config.seed + 211), material = ctx.island.material;
    const disposables = [], floaters = [];
    let triangles = 0;

    function addIslet(kind, x, y, z, R, depth, scale, seed, parent) {
      const soup = new Geo.Soup();
      decorate(soup, noise, rng, kind, R, islet(soup, noise, rng, R, depth, seed, pal), pal);
      const geometry = Shaders.geometryFromSoup(soup), mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      mesh.rotation.y = rng.range(0, Math.PI * 2);
      mesh.scale.setScalar(scale);
      mesh.name = 'islet-' + kind;
      parent.add(mesh);
      disposables.push(geometry);
      triangles += soup.triangles();
      floaters.push({ mesh: mesh, y: y, amp: 0.22 * scale, speed: rng.range(0.25, 0.5) / Math.sqrt(scale), phase: rng.range(0, 6) });
      return mesh;
    }

    // ---- 近处的小浮岛：极坐标 [方位角(度), 水平距离, 高度, 半径, 类型]
    const NEAR = [[-40, 17.0, 5.0, 3.2, 'tree'], [235, 16.5, 7.5, 2.4, 'crystal'], [15, 17.5, -6.0, 2.8, 'ruin'], [150, 16.2, -8.0, 2.2, 'tree'], [280, 16.5, -7.0, 2.6, 'crystal']];
    const group = new THREE.Group();
    group.name = 'satellites';
    ctx.scene.add(group);
    for (let i = 0; i < Math.min(S.islets, NEAR.length); i++) {
      const n = NEAR[i], a = n[0] * Math.PI / 180;
      addIslet(n[4], Math.cos(a) * n[1], n[2], Math.sin(a) * n[1], n[3], n[3] * 1.5, 1, 3 + i * 7, group);
    }

    // ---- 远处的岛影：同一套造型放大几倍，交给雾去做层次
    const kinds = ['spire', 'tree', 'spire', 'crystal', 'spire', 'tree'];
    for (let i = 0; i < S.farIslands; i++) {
      // 集中在默认机位能看到的后半圈
      const a = (-54 + (i - (S.farIslands - 1) / 2) * 44 + rng.range(-10, 10)) * Math.PI / 180;
      const d = rng.range(150, 330), scale = rng.range(4, 8);
      addIslet(kinds[i % kinds.length], Math.cos(a) * d, rng.range(-22, 46), Math.sin(a) * d, 5, 8.5, scale, 50 + i * 5, group);
    }

    // ---- 踏石：从遗迹平台边缘绕着岛盘旋而下，通到带断柱的小岛
    const stoneSoup = new Geo.Soup();
    if (HI) Geo.lathe(stoneSoup, [[0.14, -0.72], [0.4, -0.56], [0.66, -0.4], [0.86, -0.24], [1.0, -0.1], [0.99, -0.03], [0.93, 0], [0.5, 0.012]], 12, { radial: function (i, j) { return i > 5 ? 0.86 + 0.28 * noise.hash(6, j >> 1, 61) : 0.86 + 0.2 * noise.hash(i >> 1, j >> 1, 61) + 0.08 * noise.hash(i, j, 61); } });
    else Geo.lathe(stoneSoup, [[0.3, -0.6], [0.78, -0.32], [1.0, -0.1], [0.94, 0]], 7, { radial: function (i, j) { return 0.86 + 0.28 * noise.hash(i, j, 61); } });
    const stoneTop = c(0x7c8a8e), stoneSide = c(0x4a4a66), runeCol = c(0x66e6ff);
    stoneSoup.paint(0, function (v) {
      const centre = v.ny > 0.7 && v.x * v.x + v.z * v.z < 0.01;
      const col = centre ? runeCol : (v.ny > 0.7 ? stoneTop : stoneSide);
      v.r = col[0]; v.g = col[1]; v.b = col[2];
      // 只有顶面扇心发光：插值出来就是石面中央一团柔和的光斑
      v.e = centre ? 1.6 : 0; v.ph = 0.5; v.ao = v.ny < -0.3 ? 0.55 : 1;
    });
    const stoneGeometry = Shaders.geometryFromSoup(stoneSoup);
    const stones = new THREE.InstancedMesh(stoneGeometry, material, S.steppingStones);
    stones.frustumCulled = false;
    stones.name = 'stepping-stones';
    group.add(stones);
    disposables.push(stoneGeometry);
    triangles += stoneSoup.triangles() * S.steppingStones;
    const stoneData = [];
    for (let i = 0; i < S.steppingStones; i++) {
      const f = (i + 0.5) / S.steppingStones, a = (67 - 43 * f) * Math.PI / 180, r = 15.6 + 1.5 * f + rng.range(-0.25, 0.25);
      stoneData.push({ x: Math.cos(a) * r, y: -2.25 - 3.2 * f, z: Math.sin(a) * r, s: rng.range(0.5, 0.74), ry: rng.range(0, 6), phase: rng.range(0, 6) });
    }

    // ---- 绕岛底盘旋的碎石和晶片
    const rockSoup = new Geo.Soup();
    Geo.blob(rockSoup, [0, 0, 0], [1, 0.72, 0.86], HI ? 1 : 0, function (x, y, z) { return HI ? 0.78 + 0.5 * noise.n3(x * 1.7 + 3, y * 1.7, z * 1.7) : 0.7 + 0.6 * noise.hash(Math.floor(x * 7 + 9), Math.floor(y * 7 + 9), Math.floor(z * 7 + 9)); });
    rockSoup.paint(0, function (v) {
      const k = 0.75 + 0.5 * noise.hash(v.face, 4, 4), col = v.ny > 0.45 ? pal.moss : pal.cliff[v.face % 3];
      v.r = col[0] * k; v.g = col[1] * k; v.b = col[2] * k; v.ao = 0.7 + 0.3 * smooth(-0.6, 0.6, v.ny);
    });
    const shardSoup = new Geo.Soup();
    Geo.lathe(shardSoup, HI ? [[0.012, -0.5], [0.13, -0.3], [0.2, -0.12], [0.19, 0.08], [0.13, 0.3], [0.012, 0.5]] : [[0.012, -0.5], [0.2, -0.12], [0.16, 0.2], [0.012, 0.5]], HI ? 6 : 5, { capStart: false, capEnd: false });
    const shardCol = c(0x8fd8ff);
    shardSoup.paint(0, function (v) {
      const k = 0.6 + 0.8 * noise.hash(v.face >> 1, 8, 8);
      v.r = shardCol[0] * k; v.g = shardCol[1] * k; v.b = shardCol[2] * k; v.e = 2.0; v.ph = 0.7;
    });
    const shardCount = Math.round(S.debris * 0.3), rockCount = S.debris - shardCount;
    const sets = [{ soup: rockSoup, count: rockCount, size: [0.22, 0.75] }, { soup: shardSoup, count: shardCount, size: [0.5, 1.1] }].map(function (def) {
      const geometry = Shaders.geometryFromSoup(def.soup), mesh = new THREE.InstancedMesh(geometry, material, def.count);
      mesh.frustumCulled = false;
      mesh.name = 'debris';
      group.add(mesh);
      disposables.push(geometry);
      triangles += def.soup.triangles() * def.count;
      const items = [];
      for (let i = 0; i < def.count; i++) {
        items.push({
          r: rng.range(11.2, 13.8), y: rng.range(-12, -4.8), a: rng.range(0, Math.PI * 2), w: rng.range(0.025, 0.07),
          s: rng.range(def.size[0], def.size[1]), spin: rng.range(-0.5, 0.5), tilt: rng.range(0, 6), bob: rng.range(0.15, 0.45), phase: rng.range(0, 6)
        });
      }
      return { mesh: mesh, items: items };
    });

    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3();
    function update(dt, time) {
      for (let i = 0; i < floaters.length; i++) {
        const f = floaters[i];
        f.mesh.position.y = f.y + Math.sin(time * f.speed + f.phase) * f.amp;
      }
      for (let i = 0; i < stoneData.length; i++) {
        const d = stoneData[i];
        e.set(0.05 * Math.sin(time * 0.6 + d.phase), d.ry, 0.05 * Math.cos(time * 0.5 + d.phase));
        q.setFromEuler(e);
        p.set(d.x, d.y + 0.14 * Math.sin(time * 0.7 + d.phase), d.z);
        s.set(d.s, d.s * 0.8, d.s);
        stones.setMatrixAt(i, m.compose(p, q, s));
      }
      stones.instanceMatrix.needsUpdate = true;
      for (let k = 0; k < sets.length; k++) {
        const set = sets[k];
        for (let i = 0; i < set.items.length; i++) {
          const d = set.items[i], a = d.a + time * d.w;
          e.set(d.tilt + time * d.spin, time * d.spin * 0.7, d.tilt * 0.5);
          q.setFromEuler(e);
          p.set(Math.cos(a) * d.r, d.y + d.bob * Math.sin(time * 0.5 + d.phase), Math.sin(a) * d.r);
          s.setScalar(d.s);
          set.mesh.setMatrixAt(i, m.compose(p, q, s));
        }
        set.mesh.instanceMatrix.needsUpdate = true;
      }
    }
    update(0, 0);

    return {
      triangles: triangles,
      update: update,
      dispose: function () {
        ctx.scene.remove(group);
        for (let i = 0; i < disposables.length; i++) disposables[i].dispose();
      }
    };
  });
})();

// ===== clouds.js =====
'use strict';

// 云：岛下方铺开的云海（两层视差的噪声平面），以及远处和云海上方缓慢漂移的低模云团。
(function () {
  const seaVertex = `
attribute float layer;
varying vec3 vWorld;
varying float vLayer;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorld = wp.xyz;
  vLayer = layer;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

  const seaFragment = `
varying vec3 vWorld;
varying float vLayer;
uniform vec3 uCloudLit;
uniform vec3 uCloudDark;
uniform vec3 uCloudRim;
uniform float uSeaRadius;
${Shaders.common}
void main() {
  vec3 d = vWorld - cameraPosition;
  float dist = length(d);
  vec3 dir = d / max(dist, 0.001);
  float r = length(vWorld.xz);
  float t = uTime * 0.011;
  vec2 p = vWorld.xz * mix(0.011, 0.017, vLayer) + vec2(vLayer * 37.0, vLayer * 11.0);
  float n1 = fbm2(p + vec2(t, t * 0.55));
  float n2 = fbm2(p * 2.6 - vec2(t * 1.7, t * 0.3) + 5.0);
  float dens = smoothstep(mix(0.34, 0.5, vLayer), mix(0.74, 0.86, vLayer), n1 * 0.78 + n2 * 0.34);
  // 云顶亮、云谷暗；朝向月亮/太阳的方向有一条被照亮的"光路"
  vec3 col = mix(uCloudDark, uCloudLit, pow(dens, 1.4));
  float toward = max(dot(normalize(dir.xz + vec2(0.0001)), normalize(uBodyDir.xz)), 0.0);
  col += uCloudRim * (pow(toward, 10.0) * 0.55 + 0.06) * dens * dens;
  // 岛上的魔法光映在正下方的云上
  col += vec3(0.16, 0.42, 1.0) * exp(-r * r / 1800.0) * (0.25 * uGlow + 0.5 * uAwaken) * dens;
  col = mix(col, uFogColor + uFogGlow * pow(max(dot(dir, uBodyDir), 0.0), 6.0), 1.0 - exp(-dist * 0.0042));
  float alpha = dens * mix(0.94, 0.7, vLayer) * smoothstep(uSeaRadius, uSeaRadius * 0.3, r);
  gl_FragColor = vec4(encodeOut(col), alpha);
}
`;

  const puffVertex = `
varying vec3 vWorld;
varying vec3 vNormal;
void main() {
  vec4 lp = vec4(position, 1.0);
  vec3 ln = normal;
#ifdef USE_INSTANCING
  lp = instanceMatrix * lp;
  ln = mat3(instanceMatrix) * ln;
#endif
  vec4 wp = modelMatrix * lp;
  vWorld = wp.xyz;
  vNormal = normalize(mat3(modelMatrix) * ln);
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

  const puffFragment = `
varying vec3 vWorld;
varying vec3 vNormal;
uniform vec3 uCloudLit;
uniform vec3 uCloudDark;
uniform vec3 uCloudRim;
${Shaders.common}
void main() {
  vec3 n = normalize(vNormal);
  vec3 v = normalize(cameraPosition - vWorld);
  float lit = clamp(0.55 * (n.y * 0.5 + 0.5) + 0.65 * max(dot(n, uSunDir), 0.0), 0.0, 1.0);
  vec3 col = mix(uCloudDark, uCloudLit, lit);
  // 逆光的银边
  float rim = pow(1.0 - max(dot(n, v), 0.0), 2.5) * (0.25 + 0.75 * max(dot(-v, uBodyDir), 0.0));
  col += uCloudRim * rim * 0.5;
  col = applyFog(col, vWorld, cameraPosition);
  gl_FragColor = vec4(encodeOut(col), 1.0);
}
`;

  // 一朵云：一个主团加几个小团，底部压平
  function puffGeometry(noise, rng, seed) {
    const soup = new Geo.Soup();
    const HI = Config.quality.detail > 0;
    // 高模用连续噪声鼓出一团团的云絮；低模面少，用格点哈希就够了
    function bump(x, y, z) {
      return HI ? 0.86 + 0.26 * noise.n3(x * 2.4 + seed, y * 2.4, z * 2.4) + 0.1 * noise.n3(x * 5.6, y * 5.6 + seed, z * 5.6) :
        0.82 + 0.36 * noise.hash(Math.floor(x * 6 + 9) + seed, Math.floor(y * 6 + 9), Math.floor(z * 6 + 9));
    }
    Geo.blob(soup, [0, 0.12, 0], [1.0, 0.6, 0.72], HI ? 2 : 1, bump);
    const lobes = 3 + (seed % 2) + (HI ? 2 : 0);
    for (let k = 0; k < lobes; k++) {
      const side = k % 2 ? 1 : -1, d = rng.range(0.6, 1.25), s = rng.range(0.42, 0.66);
      Geo.blob(soup, [side * d, rng.range(-0.05, 0.22), rng.range(-0.35, 0.35)], [s, s * 0.72, s * 0.85], (k < 2 ? 1 : 0) + (HI ? 1 : 0), bump);
    }
    soup.warp(0, function (p) { if (p[1] < -0.12) p[1] = -0.12 + (p[1] + 0.12) * 0.25; });
    soup.paint(0, function () {});
    const a = soup.arrays(), g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(a.position, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(a.normal, 3));
    g.computeBoundingSphere();
    return { geometry: g, triangles: soup.triangles() };
  }

  App.register('clouds', function (ctx) {
    const S = Config.sky, rng = Utils.makeRng(Config.seed + 307);
    const own = {
      uCloudLit: { value: new THREE.Color(1, 1, 1) },
      uCloudDark: { value: new THREE.Color(0, 0, 0) },
      uCloudRim: { value: new THREE.Color(1, 1, 1) },
      uSeaRadius: { value: S.cloudSeaRadius }
    };
    ctx.env.register(own);
    const uniforms = Shaders.uniforms(ctx.shared, own);

    // ---- 云海：两张大方片，上层更稀、更高，转动镜头时两层之间有视差
    const R = S.cloudSeaRadius, y0 = S.cloudSeaY, pos = [], layer = [];
    for (let l = 0; l < 2; l++) {
      const y = y0 + l * 7, q = [[-R, y, -R], [-R, y, R], [R, y, R], [-R, y, -R], [R, y, R], [R, y, -R]];
      for (let i = 0; i < 6; i++) { pos.push(q[i][0], q[i][1], q[i][2]); layer.push(l); }
    }
    const seaGeometry = new THREE.BufferGeometry();
    seaGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
