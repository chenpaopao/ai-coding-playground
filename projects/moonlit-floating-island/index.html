<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04060f" />
  <meta name="description" content="使用 AI Coding 制作的交互式 3D 浮空岛：程序化场景、魔法水晶、粒子效果与动态昼夜光照。" />
  <title>月光浮空岛 · Moonlit Floating Island</title>
  <style>
:root {
  --ink: #ece9ff;
  --ink-dim: rgba(236, 233, 255, 0.58);
  --ink-soft: rgba(236, 233, 255, 0.8);
  --glass: rgba(8, 10, 26, 0.38);
  --edge: rgba(150, 170, 255, 0.16);
  --accent: #9ad8ff;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: #04060f;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body {
  height: 100vh;
  height: 100dvh;
}

#scene {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
  outline: none;
  opacity: 0;
  transition: opacity 1.8s ease;
}

body.is-ready #scene {
  opacity: 1;
}

/* UI 叠加层：默认不吃指针事件，只有按钮例外。 */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.1s ease;
}

body.is-ready .overlay {
  opacity: 1;
}

.vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 46%, rgba(4, 6, 15, 0) 42%, rgba(4, 6, 15, 0.5) 100%);
}

.brand {
  position: absolute;
  top: max(22px, env(safe-area-inset-top));
  left: max(24px, env(safe-area-inset-left));
  max-width: 46vw;
}

.brand h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  text-shadow: 0 0 22px rgba(120, 150, 255, 0.45);
}

.brand .brand-sub {
  margin: 7px 0 0;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.hints {
  position: absolute;
  left: max(24px, env(safe-area-inset-left));
  bottom: max(22px, env(safe-area-inset-bottom));
  padding: 13px 17px;
  border: 1px solid var(--edge);
  border-radius: 13px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
  font-size: 12px;
  line-height: 1.95;
  color: var(--ink-dim);
  letter-spacing: 0.04em;
}

.hints p {
  margin: 0;
  white-space: nowrap;
}

.hints .hint-key {
  color: var(--ink-soft);
}

.hints .hint-mouse {
  display: block;
}

.hints .hint-touch {
  display: none;
}

.touch-actions {
  position: absolute;
  right: max(20px, env(safe-area-inset-right));
  bottom: max(22px, env(safe-area-inset-bottom));
  display: none;
  gap: 10px;
  pointer-events: auto;
}

.touch-actions button {
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
  color: var(--ink-soft);
  font: inherit;
  font-size: 12px;
  letter-spacing: 0.12em;
  padding: 10px 16px;
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
}

.touch-actions button:active {
  background: rgba(120, 150, 255, 0.18);
  color: var(--ink);
}

.intro {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(19px, 3.2vw, 30px);
  letter-spacing: 0.36em;
  text-indent: 0.36em;
  color: var(--ink-soft);
  text-shadow: 0 0 30px rgba(120, 150, 255, 0.55), 0 0 80px rgba(90, 120, 255, 0.25);
  opacity: 1;
  transition: opacity 1.5s ease, transform 1.5s ease;
  white-space: nowrap;
}

.intro.is-hidden {
  opacity: 0;
  transform: translate(-50%, -54%);
}

/* 全部点亮时的一行小字，位置在画面下三分之一，不挡树 */
.note {
  position: absolute;
  left: 50%;
  bottom: 21%;
  transform: translate(-50%, 0);
  font-size: clamp(13px, 1.7vw, 17px);
  letter-spacing: 0.5em;
  text-indent: 0.5em;
  color: #ffe9b8;
  text-shadow: 0 0 24px rgba(255, 200, 120, 0.6), 0 0 70px rgba(255, 170, 90, 0.3);
  opacity: 1;
  transition: opacity 1.2s ease, transform 1.2s ease;
  white-space: nowrap;
}

.note.is-hidden {
  opacity: 0;
  transform: translate(-50%, 10px);
}

/* 切换时间时在顶部中间浮现的时段名，停一会儿自己淡出 */
.phase {
  position: absolute;
  left: 50%;
  top: max(30px, env(safe-area-inset-top));
  transform: translate(-50%, 0);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  font-size: clamp(14px, 1.6vw, 18px);
  letter-spacing: 0.6em;
  text-indent: 0.6em;
  color: #f2f5ff;
  text-shadow: 0 0 18px rgba(10, 16, 40, 0.75), 0 1px 3px rgba(6, 10, 26, 0.7);
  opacity: 1;
  transition: opacity 0.35s ease-out, transform 0.35s ease-out;
  white-space: nowrap;
}

.phase.is-hidden {
  opacity: 0;
  transform: translate(-50%, -8px);
  transition: opacity 0.9s ease-in, transform 0.9s ease-in;
}

.phase-dots {
  display: flex;
  gap: 7px;
  text-indent: 0;
}

.phase-dots i {
  display: block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(240, 244, 255, 0.3);
  box-shadow: 0 0 4px rgba(6, 10, 26, 0.6);
  transition: background 0.3s ease, transform 0.3s ease;
}

.phase-dots i.is-on {
  background: #ffffff;
  transform: scale(1.5);
}

/* 右上角七枚菱形：亮着的水晶数 */
.meter {
  position: absolute;
  top: max(26px, env(safe-area-inset-top));
  right: max(26px, env(safe-area-inset-right));
  display: flex;
  gap: 10px;
  align-items: center;
}

.meter i {
  display: block;
  width: 7px;
  height: 7px;
  border: 1px solid rgba(190, 205, 255, 0.42);
  transform: rotate(45deg);
  transition: background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease,
    transform 0.4s cubic-bezier(0.2, 1.6, 0.4, 1);
}

.meter i.is-lit {
  background: var(--tint, #9ad8ff);
  border-color: var(--tint, #9ad8ff);
  box-shadow: 0 0 9px var(--tint, #9ad8ff), 0 0 22px var(--tint, #9ad8ff);
  transform: rotate(45deg) scale(1.3);
}

.meter.is-awake i {
  background: #ffe2a6;
  border-color: #ffe2a6;
  box-shadow: 0 0 9px #ffd27a, 0 0 24px #ffb86a;
}

.fatal {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(4, 6, 15, 0.92);
}

.fatal[hidden] {
  display: none;
}

.fatal-card {
  max-width: 460px;
  padding: 26px 28px;
  border: 1px solid var(--edge);
  border-radius: 16px;
  background: rgba(12, 14, 32, 0.9);
  text-align: left;
}

.fatal-card h2 {
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.16em;
}

.fatal-card p {
  margin: 0;
  font-size: 13px;
  line-height: 1.8;
  color: var(--ink-dim);
}

@media (max-width: 720px) {
  .brand {
    max-width: 70vw;
  }

  .brand h1 {
    font-size: 12px;
    letter-spacing: 0.26em;
  }

  .brand .brand-sub {
    font-size: 9px;
    letter-spacing: 0.18em;
  }

  .hints {
    right: max(20px, env(safe-area-inset-right));
    padding: 10px 13px;
    font-size: 11px;
    line-height: 1.85;
    border-radius: 11px;
  }

  .hints p {
    white-space: normal;
  }

  .intro {
    letter-spacing: 0.28em;
    text-indent: 0.28em;
  }

  /* 窄屏顶部已经被标题和指示点占满，时段名下移一行 */
  .phase {
    top: calc(max(26px, env(safe-area-inset-top)) + 58px);
  }
}

@media (hover: none) and (pointer: coarse) {
  .hints .hint-mouse {
    display: none;
  }

  .hints .hint-touch {
    display: block;
  }

  .touch-actions {
    display: flex;
  }

  .hints {
    right: auto;
    max-width: 58vw;
  }
}

@media (prefers-reduced-motion: reduce) {
  .overlay {
    transition: none;
  }

  #scene,
  .meter i,
  .phase-dots i {
    transition: none;
  }

  .intro {
    transition-duration: 0.4s;
  }
}
  </style>
</head>
<body>
  <canvas id="scene" aria-label="月光浮空岛 3D 场景"></canvas>

  <div class="overlay">
    <div class="vignette"></div>

    <header class="brand">
      <h1>Moonlit Floating Island</h1>
      <p class="brand-sub">月光浮空岛 · An AI Coding Experiment</p>
    </header>

    <div class="intro" id="intro">唤醒岛上的水晶</div>
    <div class="note is-hidden" id="awaken-note">群岛苏醒</div>

    <div class="meter" id="crystal-meter" aria-hidden="true"></div>

    <div class="hints">

      <p class="hint-touch"><span class="hint-key">单指拖动</span>：旋转视角</p>

      <p class="hint-mouse"><span class="hint-key">R</span>：重置镜头</p>

    <div class="touch-actions">

  </div>

  <div class="fatal" id="fatal" hidden>
    <div class="fatal-card">
      <h2>无法启动场景</h2>

  <noscript>
    <div class="fatal">
      <div class="fatal-card">

      </div>
    </div>
  </noscript>

  <script>
// ===== utils.js =====
'use strict';

// 无依赖的小工具：数学、缓动、确定性随机、颜色换算。
const Utils = {
  clamp(v, min, max) {
    return v < min ? min : v > max ? max : v;
  },

  lerp(a, b, t) {
    return a + (b - a) * t;
  },

  // 帧率无关的指数趋近：lambda 越大收敛越快。
  damp(current, target, lambda, dt) {
    return Utils.lerp(current, target, 1 - Math.exp(-lambda * dt));
  },

  smoothstep(t) {
    t = Utils.clamp(t, 0, 1);
    return t * t * (3 - 2 * t);
  },

  // GLSL 风格的 smoothstep(edge0, edge1, x)。
  step3(edge0, edge1, x) {
    return Utils.smoothstep((x - edge0) / (edge1 - edge0));
  },

  easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  },

  easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  },

  // mulberry32：小、快、可复现。
  mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      const t1 = Math.imul(a ^ (a >>> 15), a | 1);
      const t2 = t1 ^ (t1 + Math.imul(t1 ^ (t1 >>> 7), t1 | 61));
      return ((t2 ^ (t2 >>> 14)) >>> 0) / 4294967296;
    };
  },

  makeRng(seed) {
    const next = Utils.mulberry32(seed);
    return {
      next: next,
      range(min, max) {
        return min + (max - min) * next();
      },
      pick(list) {
        return list[Math.floor(next() * list.length) % list.length];
      },
      sign() {
        return next() < 0.5 ? -1 : 1;
      }
    };
  },

  srgbToLinear(c) {
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  },

  // 十六进制 sRGB 颜色 → 线性 [r, g, b]。全工程的颜色都从这里进，
  // 不把十六进制交给 THREE.Color，避免依赖各版本不同的 ColorManagement 行为。
  rgb(hex, gain) {
    const k = gain === undefined ? 1 : gain;
    return [
      Utils.srgbToLinear(((hex >> 16) & 255) / 255) * k,
      Utils.srgbToLinear(((hex >> 8) & 255) / 255) * k,
      Utils.srgbToLinear((hex & 255) / 255) * k
    ];
  },

  // 同上，但返回 THREE.Color（已是线性分量，可直接当 uniform）。
  color(hex, gain) {
    const c = Utils.rgb(hex, gain);
    return new THREE.Color(c[0], c[1], c[2]);
  },

  mix3(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
};

// ===== config.js =====
'use strict';

// 所有可调参数集中在这里：相机、布局、数量、光照、后处理、性能档位。
// 六个时段的调色板在 src/environment.js。
const Config = (function () {
  const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const touch = mobile || (navigator.maxTouchPoints || 0) > 0;

  return {
    seed: 20261120,
    isMobile: mobile,
    isTouch: touch,

    quality: {
      maxPixelRatio: mobile ? 1.5 : 2,
      msaa: mobile ? 0 : 4,
      shadowSize: mobile ? 1024 : 2048,
      // 粒子、草丛等数量的总倍率
      density: mobile ? 0.6 : 1,
      // 模型细分档：1 = 桌面的高模，0 = 手机用的低一档
      detail: mobile ? 0 : 1,
      // 单帧最长步进；切后台回来不让动画跳变
      maxDelta: 0.05,
      // 自适应分辨率：连续 governorFrames 帧平均帧时超过阈值就降一档，最低到 minPixelRatio
      minPixelRatio: mobile ? 1 : 0.75,
      governorFrames: 90,
      // 桌面目标 60 FPS、移动端 30 FPS，阈值留出余量
      governorFrameTime: mobile ? 1 / 24 : 1 / 40
    },

    camera: {
      fov: 42,
      near: 0.5,
      far: 1400,
      targetY: 2.6,
      startDistance: mobile ? 58 : 48,
      minDistance: 24,
      maxDistance: 84,
      startTheta: -0.62,
      startPhi: 1.42,
      minPhi: 0.5,
      maxPhi: 1.78,
      dragSpeed: 0.0042,
      rotateDamping: 6.5,
      zoomDamping: 5.5,
      inertiaDamping: 3.2,
      resetDuration: 1.5,
      // 待机时极慢的自动环绕，拖动后暂停一会儿
      idleSpin: 0.022,
      idleDelay: 6
    },

    post: {
      bloomThreshold: 0.95,
      bloomKnee: 0.5,
      bloomStrength: 0.62,
      bloomSpread: 0.62,
      vignette: 0.55,
      saturation: 1.08
    },

    shadow: {
      extent: 21,
      depth: 120,
      bias: 0.0022,
      strength: 0.82
    },

    time: {
      transition: 1.8,
      // 空格按这个顺序循环；键名对应 src/environment.js 里的调色板
      order: ['night', 'dawn', 'morning', 'noon', 'dusk', 'aurora'],
      start: 'night',
      labelHold: 2200
    },

    island: {
      radius: 11.5,
      depth: 19,
      bobAmplitude: 0.28,
      bobSpeed: 0.42,
      tiltAmplitude: 0.012,
      // 网格密度：手机上减半，其余数量再乘 quality.density
      sectors: mobile ? 108 : 180,
      topRings: mobile ? 18 : 30,
      // 崖壁凹凸按几个扇区一组取值（约 14°一块大岩面）
      cliffBlock: mobile ? 4 : 7,
      undersideSides: mobile ? 22 : 36,
      undersideRings: mobile ? 14 : 22,
      grassClumps: 2800,
      grassBlades: 4,
      flowers: 440,
      rocks: 40,
      pebbles: 70,
      mushrooms: 44,
      spires: 26,
      veins: 36
    },

    tree: {
      x: -1.2,
      z: -0.6,
      height: 14,
      canopyClusters: 60,
      vines: 34,
      roots: 11
    },

    crystals: {
      count: 7,
      ringRadius: 7.1,
      hoverScale: 1.14,
      pulseDuration: 1.6,
      lightRadius: 7.5,
      lightIdle: 0.55,
      lightActive: 2.4,
      // 点亮后保持的秒数；全部点亮触发一次"苏醒"
      activeHold: 14,
      awakenDuration: 7
    },

    satellites: {
      islets: 5,
      steppingStones: 9,
      debris: 46,
      farIslands: 6
    },

    sky: {
      radius: 900,
      moonSize: 0.115,
      sunSize: 0.045,
      clouds: 16,
      cloudSeaY: -34,
      cloudSeaRadius: 420
    },

    particles: {
      fireflies: 320,
      petals: 420,
      motes: 700,
      crystalSparks: 60,
      streamPerCrystal: 70,
      mist: 420,
      ascension: 600,
      burstPool: 900,
      burstPerClick: 110,
      ringPool: 10
    },

    interaction: {
      // 按下到抬起的位移 / 时长都在阈值内才算点击，否则是拖动
      clickSlop: 8,
      clickTime: 600,
      introDuration: 3200,
      cameraPulse: 1.6
    },

    audio: {
      masterVolume: 0.55,
      // 点击水晶：约 3 秒的一小段旋律。第 i 颗水晶从 do re mi fa so la xi 的第 i 个音起，
      // 用自己的动机，每次点击再随机做变奏（倒影 / 逆行 / 模进 / 换节奏 / 加倚音）。
      melody: {
        seed: 0,                 // 0 = 每次打开页面用时间做种子；填非 0 可复现
        base: 261.63,            // do = C4
        scale: [0, 2, 4, 5, 7, 9, 11],
        low: 0, high: 14,        // 旋律音域（音级）：C4 … C6
        length: 3.0,             // 整段时长（秒）
        tail: 1.05,              // 末音的余韵（秒）
        // 每颗水晶一条动机，数字是相对起音的音级偏移
        motifs: [
          [0, 1, 2, 3, 4, 5, 6, 7],
          [0, 2, 1, 3, 2, 4, 3, 5],
          [0, 2, 4, 7, 5, 4, 2, 0],
          [0, 1, 2, 0, 2, 3, 4, 2],
          [0, -1, 0, 2, 4, 3, 2, 4],
          [0, 4, 3, 2, 1, 2, 3, 5],
          [0, 1, -1, 0, 2, 1, 3, 2]
        ],
        // 节奏型：每个数是一个音占的拍数，最后一个音之前合计 8 拍
        rhythms: [
          [1, 1, 1, 1, 1, 1, 1, 1, 2],
          [1.5, 0.5, 1, 1, 1.5, 0.5, 2, 2],
          [0.5, 0.5, 1, 0.5, 0.5, 1, 1, 1, 2, 2],
          [2, 1, 1, 0.5, 0.5, 1, 2, 2],
          [1, 0.5, 0.5, 1, 1, 0.5, 0.5, 1, 2, 2]
        ],
        transforms: ['plain', 'retro', 'invert', 'sequence', 'octave'],
        graceChance: 0.4,
        noteGain: 0.2,
        padGain: 0.05,
        echoTime: 0.31,
        echoFeedback: 0.3,
        echoGain: 0.22
      }
    }
  };
})();

// ===== noise.js =====
'use strict';

// 带种子的 3D 值噪声与 fbm，只用于建模阶段（启动时跑一次，不在每帧调用）。
const Noise = {
  make(seed) {
    const s = seed | 0;

    function hash(ix, iy, iz) {
      let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(iz, 2147483647) ^ s;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967295;
    }

    function fade(t) {
      return t * t * t * (t * (t * 6 - 15) + 10);
    }

    // 返回 [-1, 1]
    function n3(x, y, z) {
      const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
      const fx = fade(x - ix), fy = fade(y - iy), fz = fade(z - iz);
      const a = hash(ix, iy, iz), b = hash(ix + 1, iy, iz);
      const c = hash(ix, iy + 1, iz), d = hash(ix + 1, iy + 1, iz);
      const e = hash(ix, iy, iz + 1), f = hash(ix + 1, iy, iz + 1);
      const g = hash(ix, iy + 1, iz + 1), h = hash(ix + 1, iy + 1, iz + 1);
      const x1 = a + (b - a) * fx, x2 = c + (d - c) * fx;
      const x3 = e + (f - e) * fx, x4 = g + (h - g) * fx;
      const y1 = x1 + (x2 - x1) * fy, y2 = x3 + (x4 - x3) * fy;
      return (y1 + (y2 - y1) * fz) * 2 - 1;
    }

    function fbm(x, y, z, octaves) {
      let amp = 0.5, freq = 1, sum = 0, norm = 0;
      for (let i = 0; i < octaves; i++) {
        sum += n3(x * freq, y * freq, z * freq) * amp;
        norm += amp;
        amp *= 0.5;
        freq *= 2.03;
      }
      return sum / norm;
    }

    // 山脊噪声 [0, 1]，用来做岩层和裂隙
    function ridge(x, y, z, octaves) {
      let amp = 0.5, freq = 1, sum = 0, norm = 0;
      for (let i = 0; i < octaves; i++) {
        sum += (1 - Math.abs(n3(x * freq, y * freq, z * freq))) * amp;
        norm += amp;
        amp *= 0.5;
        freq *= 2.1;
      }
      return sum / norm;
    }

    return { n3: n3, fbm: fbm, ridge: ridge, hash: hash };
  }
};

// ===== geo.js =====
'use strict';

// 几何内核：不依赖 THREE 的"三角形汤"构造器。
// 约定：所有图元都按逆时针为正面生成；法线在 paint() 时按面计算（平面着色）。
// 流程固定为 建形 → transform / warp → paint，paint 之后不要再移动顶点。
const Geo = (function () {
  function Soup() {
    this.p = [];
    this.n = [];
    this.c = [];
    this.f = []; // 每顶点 4 个附加量：自发光、摆动权重、AO、相位
    this.painted = 0;
    this._v = {
      x: 0, y: 0, z: 0, nx: 0, ny: 1, nz: 0, cx: 0, cy: 0, cz: 0, face: 0, corner: 0,
      r: 1, g: 1, b: 1, e: 0, s: 0, ao: 1, ph: 0
    };
  }

  Soup.prototype.mark = function () {
    return this.p.length / 3;
  };

  Soup.prototype.triangles = function () {
    return this.p.length / 9;
  };

  Soup.prototype.tri = function (a, b, c) {
    // 退化三角形（锥尖、重合点）直接丢弃
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    if (nx * nx + ny * ny + nz * nz < 1e-14) return;
    this.p.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
  };

  // a b c d 逆时针
  Soup.prototype.quad = function (a, b, c, d) {
    this.tri(a, b, c);
    this.tri(a, c, d);
  };

  // m: 12 个数的 3x4 仿射矩阵（行主序），见 Geo.trs / Geo.basis
  Soup.prototype.transform = function (start, m) {
    const p = this.p;
    for (let i = start * 3; i < p.length; i += 3) {
      const x = p[i], y = p[i + 1], z = p[i + 2];
      p[i] = m[0] * x + m[1] * y + m[2] * z + m[3];
      p[i + 1] = m[4] * x + m[5] * y + m[6] * z + m[7];
      p[i + 2] = m[8] * x + m[9] * y + m[10] * z + m[11];
    }
    return this;
  };

  // fn(pt) 就地修改 [x, y, z]；必须只依赖位置，才能保证共享顶点不裂开
  Soup.prototype.warp = function (start, fn) {
    const p = this.p, pt = [0, 0, 0];
    for (let i = start * 3; i < p.length; i += 3) {
      pt[0] = p[i]; pt[1] = p[i + 1]; pt[2] = p[i + 2];
      fn(pt);
      p[i] = pt[0]; p[i + 1] = pt[1]; p[i + 2] = pt[2];
    }
    return this;
  };

  // 逐顶点上色。fn(v) 读取 v.x/y/z、面法线 v.nx/ny/nz、面心 v.cx/cy/cz、v.face、v.corner，
  // 写入 v.r/g/b（线性色）、v.e（自发光）、v.s（摆动）、v.ao、v.ph（相位），也可以改写法线。
  Soup.prototype.paint = function (start, fn) {
    if (start !== this.painted) throw new Error('Geo.paint: 区间不连续，start=' + start + ' painted=' + this.painted);
    const p = this.p, v = this._v;
    let face = 0;
    for (let i = start * 3; i < p.length; i += 9, face++) {
      const ux = p[i + 3] - p[i], uy = p[i + 4] - p[i + 1], uz = p[i + 5] - p[i + 2];
      const vx = p[i + 6] - p[i], vy = p[i + 7] - p[i + 1], vz = p[i + 8] - p[i + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      if (len > 1e-12) { nx /= len; ny /= len; nz /= len; } else { nx = 0; ny = 1; nz = 0; }
      const cx = (p[i] + p[i + 3] + p[i + 6]) / 3, cy = (p[i + 1] + p[i + 4] + p[i + 7]) / 3, cz = (p[i + 2] + p[i + 5] + p[i + 8]) / 3;
      for (let k = 0; k < 3; k++) {
        v.x = p[i + k * 3]; v.y = p[i + k * 3 + 1]; v.z = p[i + k * 3 + 2];
        v.nx = nx; v.ny = ny; v.nz = nz; v.cx = cx; v.cy = cy; v.cz = cz;
        v.face = face; v.corner = k;
        v.r = 1; v.g = 1; v.b = 1; v.e = 0; v.s = 0; v.ao = 1; v.ph = 0;
        fn(v);
        this.n.push(v.nx, v.ny, v.nz);
        this.c.push(v.r, v.g, v.b);
        this.f.push(v.e, v.s, v.ao, v.ph);
      }
    }
    this.painted = this.mark();
    return this;
  };

  // 输出类型化数组；有未上色的顶点时报错，避免带着垃圾数据进 GPU
  Soup.prototype.arrays = function () {
    if (this.painted !== this.mark()) throw new Error('Geo.arrays: 还有 ' + (this.mark() - this.painted) + ' 个顶点没有 paint');
    return {
      position: new Float32Array(this.p),
      normal: new Float32Array(this.n),
      color: new Float32Array(this.c),
      fx: new Float32Array(this.f)
    };
  };

  // ---------------------------------------------------------------- 变换
  // 欧拉角顺序：先绕 X，再绕 Y，最后绕 Z；scale 可为数字或 [sx, sy, sz]
  function trs(pos, rot, scale) {
    const sx = typeof scale === 'number' ? scale : (scale ? scale[0] : 1);
    const sy = typeof scale === 'number' ? scale : (scale ? scale[1] : 1);
    const sz = typeof scale === 'number' ? scale : (scale ? scale[2] : 1);
    const rx = rot ? rot[0] : 0, ry = rot ? rot[1] : 0, rz = rot ? rot[2] : 0;
    const cx = Math.cos(rx), sxn = Math.sin(rx), cy = Math.cos(ry), syn = Math.sin(ry), cz = Math.cos(rz), szn = Math.sin(rz);
    // R = Rz * Ry * Rx
    const r00 = cz * cy, r01 = cz * syn * sxn - szn * cx, r02 = cz * syn * cx + szn * sxn;
    const r10 = szn * cy, r11 = szn * syn * sxn + cz * cx, r12 = szn * syn * cx - cz * sxn;
    const r20 = -syn, r21 = cy * sxn, r22 = cy * cx;
    return [
      r00 * sx, r01 * sy, r02 * sz, pos[0],
      r10 * sx, r11 * sy, r12 * sz, pos[1],
      r20 * sx, r21 * sy, r22 * sz, pos[2]
    ];
  }

  // 把局部 +Y 对齐到 dir 的变换（用于让晶体、石柱沿任意方向生长）
  function basis(origin, dir, scale, spin) {
    const s = scale === undefined ? 1 : scale;
    let yx = dir[0], yy = dir[1], yz = dir[2];
    const l = Math.sqrt(yx * yx + yy * yy + yz * yz) || 1;
    yx /= l; yy /= l; yz /= l;
    // 选一个不平行的参考轴求 X
    let ax = 1, ay = 0, az = 0;
    if (Math.abs(yx) > 0.9) { ax = 0; az = 1; }
    // z = a × y（保证 x × y = z 的右手系）
    let zx = ay * yz - az * yy, zy = az * yx - ax * yz, zz = ax * yy - ay * yx;
    const zl = Math.sqrt(zx * zx + zy * zy + zz * zz) || 1;
    zx /= zl; zy /= zl; zz /= zl;
    let xx = yy * zz - yz * zy, xy = yz * zx - yx * zz, xz = yx * zy - yy * zx;
    if (spin) {
      const c = Math.cos(spin), sn = Math.sin(spin);
      const nxx = xx * c + zx * sn, nxy = xy * c + zy * sn, nxz = xz * c + zz * sn;
      zx = zx * c - xx * sn; zy = zy * c - xy * sn; zz = zz * c - xz * sn;
      xx = nxx; xy = nxy; xz = nxz;
    }
    return [
      xx * s, yx * s, zx * s, origin[0],
      xy * s, yy * s, zy * s, origin[1],
      xz * s, yz * s, zz * s, origin[2]
    ];
  }

  // ---------------------------------------------------------------- 图元
  // 环带蒙皮：rings[i] 是一圈点，角度方向固定为 +X → -Z → -X → +Z（沿 +Y 推进时外侧为正面）
  function skin(soup, rings, capStart, capEnd) {
    const start = soup.mark();
    for (let i = 0; i < rings.length - 1; i++) {
      const a = rings[i], b = rings[i + 1], n = a.length;
      for (let j = 0; j < n; j++) {
        const k = (j + 1) % n;
        soup.quad(a[j], a[k], b[k], b[j]);
      }
    }
    if (capStart) cap(soup, rings[0], true);
    if (capEnd) cap(soup, rings[rings.length - 1], false);
    return start;
  }

  function cap(soup, ring, isStart) {
    const c = [0, 0, 0], n = ring.length;
    for (let j = 0; j < n; j++) { c[0] += ring[j][0] / n; c[1] += ring[j][1] / n; c[2] += ring[j][2] / n; }
    for (let j = 0; j < n; j++) {
      const k = (j + 1) % n;
      if (isStart) soup.tri(c, ring[k], ring[j]); else soup.tri(c, ring[j], ring[k]);
    }
  }

  // 旋转体：profile 为自下而上的 [半径, 高度]；radial(i, j) 返回半径倍率，用来打破规则感
  function lathe(soup, profile, sides, opts) {
    const o = opts || {};
    const radial = o.radial, phase = o.phase || 0;
    const rings = [];
    for (let i = 0; i < profile.length; i++) {
      const ring = [];
      for (let j = 0; j < sides; j++) {
        const a = phase + (j / sides) * Math.PI * 2 + (o.twist || 0) * i;
        const r = profile[i][0] * (radial ? radial(i, j) : 1);
        ring.push([Math.cos(a) * r, profile[i][1], -Math.sin(a) * r]);
      }
      rings.push(ring);
    }
    return skin(soup, rings, o.capStart !== false, o.capEnd !== false);
  }

  // 晶体：底在原点、沿 +Y 长到 h 的棱柱 + 尖顶。bevel > 0 时每条棱削成一个窄面（6 宽 6 窄共 12 个面），
  // tip 让尖顶偏离轴线，radial(j) 让各个面宽窄不一——天然晶体从来不是正六棱柱
  const CRYSTAL = [[0.72, 0], [1, 0.26], [0.92, 0.68], [0.52, 0.89], [0.03, 1]];
  function crystal(soup, h, w, opts) {
    const o = opts || {};
    const sides = o.sides || 6, bevel = o.bevel || 0, profile = o.profile || CRYSTAL, phase = o.phase || 0;
    const tip = o.tip || [0, 0];
    const rings = [];
    for (let i = 0; i < profile.length; i++) {
      const ring = [], r = profile[i][0] * w, y = profile[i][1] * h;
      // 越靠近尖顶偏得越多
      const lean = Math.pow(profile[i][1], 3), cx = tip[0] * w * lean, cz = tip[1] * w * lean;
      for (let j = 0; j < sides; j++) {
        const a = phase + (j / sides) * Math.PI * 2, k = r * (o.radial ? o.radial(j) : 1);
        if (bevel > 0) {
          const d = bevel * Math.PI / sides;
          ring.push([cx + Math.cos(a - d) * k, y, cz - Math.sin(a - d) * k], [cx + Math.cos(a + d) * k, y, cz - Math.sin(a + d) * k]);
        } else ring.push([cx + Math.cos(a) * k, y, cz - Math.sin(a) * k]);
      }
      rings.push(ring);
    }
    return skin(soup, rings, o.capStart === true, false);
  }

  // 沿路径的管：pts 为 [x,y,z] 列表，radius(t, i) 或数组给每个截面的半径
  function tube(soup, pts, radius, sides, opts) {
    const o = opts || {};
    const count = pts.length, rings = [];
    let nx = 0, ny = 0, nz = 0, has = false;
    for (let i = 0; i < count; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(count - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1], tz = b[2] - a[2];
      const tl = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1;
      tx /= tl; ty /= tl; tz /= tl;
      if (!has) {
        // 初始法向：取与切线最不平行的坐标轴
        let ax = 1, ay = 0, az = 0;
        if (Math.abs(tx) > 0.8) { ax = 0; az = 1; }
        nx = ax; ny = ay; nz = az;
        has = true;
      }
      // 平行输运：把上一截面的法向投影到当前截面
      const d = nx * tx + ny * ty + nz * tz;
      nx -= tx * d; ny -= ty * d; nz -= tz * d;
      const nl = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      nx /= nl; ny /= nl; nz /= nl;
      const bx = ty * nz - tz * ny, by = tz * nx - tx * nz, bz = tx * ny - ty * nx;
      const t = count > 1 ? i / (count - 1) : 0;
      const r = typeof radius === 'function' ? radius(t, i) : radius[i];
      const ring = [];
      for (let j = 0; j < sides; j++) {
        const ang = (j / sides) * Math.PI * 2 + (o.twist || 0) * t;
        const k = r * (o.radial ? o.radial(i, j, t) : 1);
        const c = Math.cos(ang) * k, s = Math.sin(ang) * k;
        ring.push([pts[i][0] + nx * c + bx * s, pts[i][1] + ny * c + by * s, pts[i][2] + nz * c + bz * s]);
      }
      rings.push(ring);
    }
    return skin(soup, rings, o.capStart === true, o.capEnd !== false);
  }

  // Catmull-Rom 采样，让手写的几个控制点变成顺滑的枝干路径
  function spline(ctrl, samples) {
    const out = [], n = ctrl.length;
    for (let s = 0; s <= samples; s++) {
      const u = (s / samples) * (n - 1);
      const i = Math.min(n - 2, Math.floor(u)), t = u - i;
      const p0 = ctrl[Math.max(0, i - 1)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(n - 1, i + 2)];
      const t2 = t * t, t3 = t2 * t, pt = [0, 0, 0];
      for (let k = 0; k < 3; k++) {
        pt[k] = 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      }
      out.push(pt);
    }
    return out;
  }

  // 二十面体细分球，缓存各级细分
  const icoCache = {};
  function ico(detail) {
    if (icoCache[detail]) return icoCache[detail];
    const t = (1 + Math.sqrt(5)) / 2;
    let verts = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]];
    let faces = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
      [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
    verts = verts.map(function (v) { const l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]); return [v[0] / l, v[1] / l, v[2] / l]; });
    for (let d = 0; d < detail; d++) {
      const cache = {}, next = [];
      const mid = function (a, b) {
        const key = a < b ? a + '_' + b : b + '_' + a;
        if (cache[key] !== undefined) return cache[key];
        const va = verts[a], vb = verts[b];
        const m = [va[0] + vb[0], va[1] + vb[1], va[2] + vb[2]];
        const l = Math.sqrt(m[0] * m[0] + m[1] * m[1] + m[2] * m[2]);
        verts.push([m[0] / l, m[1] / l, m[2] / l]);
        cache[key] = verts.length - 1;
        return cache[key];
      };
      for (let i = 0; i < faces.length; i++) {
        const f = faces[i], a = mid(f[0], f[1]), b = mid(f[1], f[2]), c = mid(f[2], f[0]);
        next.push([f[0], a, c], [f[1], b, a], [f[2], c, b], [a, b, c]);
      }
      faces = next;
    }
    icoCache[detail] = { verts: verts, faces: faces };
    return icoCache[detail];
  }

  // 团块：单位球按 disp(ux, uy, uz) 返回的倍率起伏，再按三轴半径拉伸。岩石、树冠、云团都用它
  function blob(soup, center, radii, detail, disp) {
    const base = ico(detail), start = soup.mark();
    const rx = typeof radii === 'number' ? radii : radii[0];
    const ry = typeof radii === 'number' ? radii : radii[1];
    const rz = typeof radii === 'number' ? radii : radii[2];
    const pts = base.verts.map(function (u) {
      const k = disp ? disp(u[0], u[1], u[2]) : 1;
      return [center[0] + u[0] * rx * k, center[1] + u[1] * ry * k, center[2] + u[2] * rz * k];
    });
    for (let i = 0; i < base.faces.length; i++) {
      const f = base.faces[i];
      soup.tri(pts[f[0]], pts[f[1]], pts[f[2]]);
    }
    return start;
  }

  // 矩形环（符合 skin 的角度方向），用来搭石块、台阶、拱券
  function rect(w, d, y, inset) {
    const hx = w / 2 - (inset || 0), hz = d / 2 - (inset || 0);
    return [[hx, y, hz], [hx, y, -hz], [-hx, y, -hz], [-hx, y, hz]];
  }

  // 带倒角的石块：底面在 y=0，中心在原点
  function block(soup, w, h, d, bevel, taper) {
    const b = bevel || 0, k = taper === undefined ? 1 : taper;
    const rings = [];
    if (b > 0) {
      rings.push(rect(w, d, 0, b), rect(w, d, b, 0), rect(w * k, d * k, h - b, 0), rect(w * k, d * k, h, b));
    } else {
      rings.push(rect(w, d, 0, 0), rect(w * k, d * k, h, 0));
    }
    return skin(soup, rings, true, true);
  }

  // 极坐标圆盘：pos(i, j) 返回第 i 圈（0 为圆心）第 j 个扇区的点；up=false 时翻面朝下
  function disk(soup, rings, sectors, pos, up) {
    const start = soup.mark();
    const grid = [];
    for (let i = 0; i <= rings; i++) {
      const row = [];
      for (let j = 0; j < sectors; j++) row.push(i === 0 && j > 0 ? row[0] : pos(i, j));
      grid.push(row);
    }
    for (let i = 0; i < rings; i++) {
      for (let j = 0; j < sectors; j++) {
        const k = (j + 1) % sectors;
        const a = grid[i][j], b = grid[i + 1][j], c = grid[i + 1][k], d = grid[i][k];
        if (i === 0) {
          if (up) soup.tri(a, b, c); else soup.tri(a, c, b);
        } else if (up) {
          // 交替对角线方向，避免出现朝同一方向的条纹
          if ((i + j) % 2 === 0) { soup.tri(a, b, c); soup.tri(a, c, d); } else { soup.tri(a, b, d); soup.tri(b, c, d); }
        } else if ((i + j) % 2 === 0) { soup.tri(a, c, b); soup.tri(a, d, c); } else { soup.tri(a, d, b); soup.tri(b, d, c); }
      }
    }
    return start;
  }

  return {
    Soup: Soup, trs: trs, basis: basis, skin: skin, cap: cap, lathe: lathe, tube: tube, spline: spline,
    blob: blob, rect: rect, block: block, disk: disk, ico: ico, crystal: crystal
  };
})();

// ===== shaders.js =====
'use strict';

// 共享的 GLSL 片段与全局 uniform。所有材质都是自写 ShaderMaterial：
// 输出线性 HDR，由 pipeline.js 的合成通道统一做 Bloom、色调映射和 sRGB 编码。
const Shaders = (function () {
  const NUM_LIGHTS = 12;

  // 全工程共用同一批 {value} 对象；材质通过 Shaders.uniforms(shared, own) 引用它们
  function createShared() {
    return {
      uTime: { value: 0 },
      uSunDir: { value: new THREE.Vector3(0, 1, 0) },
      uBodyDir: { value: new THREE.Vector3(0, 0.3, -1) },
      uSunColor: { value: new THREE.Color(1, 1, 1) },
      uSkyColor: { value: new THREE.Color(0.1, 0.1, 0.2) },
      uGroundColor: { value: new THREE.Color(0.02, 0.02, 0.04) },
      uRimColor: { value: new THREE.Color(0.2, 0.3, 0.6) },
      uFogColor: { value: new THREE.Color(0.02, 0.03, 0.08) },
      uFogGlow: { value: new THREE.Color(0.1, 0.15, 0.3) },
      uFogParams: { value: new THREE.Vector3(0.006, 0.05, -6) },
      uNight: { value: 1 },
      uGlow: { value: 1 },
      uEncode: { value: 0 },
      uAwaken: { value: 0 },
      uWind: { value: new THREE.Vector4(0.8, 0.6, 1, 1) },
      uLights: { value: new Float32Array(NUM_LIGHTS * 4) },
      uLightColors: { value: new Float32Array(NUM_LIGHTS * 3) },
      uShadowMap: { value: null },
      uShadowMatrix: { value: new THREE.Matrix4() },
      uShadowParams: { value: new THREE.Vector4(1 / 1024, 0.0025, 1, 1) },
      uPixelScale: { value: 1 }
    };
  }

  function uniforms(shared, own) {
    const out = {};
    for (const k in shared) out[k] = shared[k];
    if (own) for (const k in own) out[k] = own[k];
    return out;
  }

  const common = `
uniform float uTime;
uniform vec3 uSunDir;
uniform vec3 uBodyDir;
uniform vec3 uSunColor;
uniform vec3 uSkyColor;
uniform vec3 uGroundColor;
uniform vec3 uRimColor;
uniform vec3 uFogColor;
uniform vec3 uFogGlow;
uniform vec3 uFogParams;
uniform float uNight;
uniform float uGlow;
uniform float uEncode;
uniform float uAwaken;
uniform vec4 uWind;

float hash11(float p) { p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash21(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash31(vec3 p3) { p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p) {
  vec2 i = floor(p); vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i); float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)); float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm2(vec2 p) {
  float s = 0.0; float a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}
// 备用管线（没有浮点渲染目标）把 HDR 压进 8 位：开方编码，合成时再平方还原
vec3 encodeOut(vec3 c) {
  c = max(c, vec3(0.0));
  return mix(c, sqrt(min(c * 0.25, vec3(1.0))), uEncode);
}
// 高度雾 + 朝向天体方向的散射辉光，让远处的东西融进天空而不是硬切
vec3 applyFog(vec3 col, vec3 world, vec3 cam) {
  vec3 d = world - cam;
  float dist = length(d);
  float h = clamp(exp(-(world.y - uFogParams.z) * uFogParams.y), 0.0, 3.0);
  float f = 1.0 - exp(-dist * uFogParams.x * mix(1.0, h, 0.75));
  float g = pow(max(dot(d / max(dist, 0.001), uBodyDir), 0.0), 6.0);
  return mix(col, uFogColor + uFogGlow * g, clamp(f, 0.0, 1.0));
}
`;

  // 顶点阶段的风：大幅慢摆 + 小幅快抖，权重来自顶点属性 fx.y
  const wind = `
vec3 windOffset(vec3 world, float weight, float phase) {
  float t = uTime * uWind.w;
  float gust = sin(dot(world.xz, uWind.xy) * 0.35 + t * 1.3) * 0.6 + sin(dot(world.xz, uWind.yx) * 0.8 - t * 2.1 + phase * 6.283) * 0.4;
  float flutter = sin(t * 5.3 + phase * 40.0 + world.y * 2.0) * 0.25;
  vec3 dir = vec3(uWind.x, 0.0, uWind.y);
  return (dir * (gust + flutter) + vec3(0.0, flutter * 0.35, 0.0)) * weight * uWind.z;
}
`;

  const shadowFrag = `
uniform sampler2D uShadowMap;
uniform vec4 uShadowParams;
float unpackDepth(vec4 v) { return dot(v, vec4(1.0, 1.0 / 255.0, 1.0 / 65025.0, 1.0 / 16581375.0)); }
float shadowTap(vec2 uv, float z) { return step(z, unpackDepth(texture2D(uShadowMap, uv))); }
float getShadow(vec4 sc, float ndl) {
  if (uShadowParams.w < 0.5) return 1.0;
  vec3 p = sc.xyz / sc.w;
  if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0 || p.z > 1.0) return 1.0;
  float z = p.z - uShadowParams.y * (1.0 + 3.0 * (1.0 - clamp(ndl, 0.0, 1.0)));
  float t = uShadowParams.x;
  float s = shadowTap(p.xy + vec2(-0.6, -1.2) * t, z) + shadowTap(p.xy + vec2(1.2, -0.6) * t, z)
          + shadowTap(p.xy + vec2(0.6, 1.2) * t, z) + shadowTap(p.xy + vec2(-1.2, 0.6) * t, z)
          + shadowTap(p.xy, z);
  return mix(1.0, s * 0.2, uShadowParams.z);
}
`;

  const lights = `
#define NUM_LIGHTS ${NUM_LIGHTS}
uniform vec4 uLights[NUM_LIGHTS];
uniform vec3 uLightColors[NUM_LIGHTS];
vec3 pointLights(vec3 world, vec3 n) {
  vec3 sum = vec3(0.0);
  for (int i = 0; i < NUM_LIGHTS; i++) {
    vec3 d = uLights[i].xyz - world;
    float r = uLights[i].w;
    float d2 = dot(d, d);
    float att = clamp(1.0 - d2 / (r * r), 0.0, 1.0);
    att = att * att / (1.0 + d2 * 0.35);
    float nl = max(dot(n, d * inversesqrt(max(d2, 0.0001))), 0.0) * 0.75 + 0.25;
    sum += uLightColors[i] * (att * nl);
  }
  return sum;
}
`;

  // 通用受光材质：顶点色 + 平面法线 + 方向光阴影 + 半球环境光 + 点光 + 轮廓光 + 自发光 + 雾
  const litVertex = `
attribute vec3 color;
attribute vec4 fx;
uniform mat4 uShadowMatrix;
varying vec3 vColor;
varying vec4 vFx;
varying vec3 vWorld;
varying vec3 vNormal;
varying vec4 vShadow;
varying vec3 vPoint;
${common}
${wind}
${lights}
void main() {
  vec4 lp = vec4(position, 1.0);
  vec3 ln = normal;
#ifdef USE_INSTANCING
  lp = instanceMatrix * lp;
  ln = mat3(instanceMatrix) * ln;
#endif
  vec4 wp = modelMatrix * lp;
  wp.xyz += windOffset(wp.xyz, fx.y, fx.w);
  vColor = color;
  vFx = fx;
  vWorld = wp.xyz;
  vNormal = normalize(mat3(modelMatrix) * ln);
  vShadow = uShadowMatrix * wp;
  // 面是平的，点光逐顶点算就够了，省掉片元里的 12 次循环
  vPoint = pointLights(wp.xyz, vNormal);
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

  const litFragment = `
varying vec3 vColor;
varying vec4 vFx;
varying vec3 vWorld;
varying vec3 vNormal;
varying vec4 vShadow;
varying vec3 vPoint;
${common}
${shadowFrag}
void main() {
  vec3 n = normalize(vNormal);
  vec3 v = normalize(cameraPosition - vWorld);
  float ndl = dot(n, uSunDir);
  float sh = getShadow(vShadow, ndl);
  float ao = vFx.z;
  vec3 hemi = mix(uGroundColor, uSkyColor, n.y * 0.5 + 0.5);
  vec3 light = uSunColor * (max(ndl, 0.0) * sh) + hemi * ao;
  light += vPoint * mix(0.55, 1.0, ao);
  // 会摆动的东西都是叶片：逆光时透一点光
  light += uSunColor * (pow(max(dot(v, -uSunDir), 0.0), 3.0) * min(vFx.y * 4.0, 1.0) * 0.5 * sh);
  // 逆光轮廓：只在背向主光且掠射的面上出现，勾出剪影
  float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
  light += uRimColor * fres * (0.35 + 0.65 * max(-dot(v, uBodyDir), 0.0)) * ao;
  float pulse = 1.0 + 0.22 * sin(uTime * 1.4 + vFx.w * 6.283) + uAwaken * 1.5;
  vec3 col = vColor * light + vColor * (vFx.x * uGlow * pulse);
  col = applyFog(col, vWorld, cameraPosition);
  gl_FragColor = vec4(encodeOut(col), 1.0);
}
`;

  // 阴影深度：必须和受光材质用同一套顶点位移，否则摆动的叶子会和自己的影子错开
  const depthVertex = `
attribute vec4 fx;
varying float vDepth;
${common}
${wind}
void main() {
  vec4 lp = vec4(position, 1.0);
#ifdef USE_INSTANCING
  lp = instanceMatrix * lp;
#endif
  vec4 wp = modelMatrix * lp;
  wp.xyz += windOffset(wp.xyz, fx.y, fx.w);
  gl_Position = projectionMatrix * viewMatrix * wp;
  vDepth = gl_Position.z / gl_Position.w * 0.5 + 0.5;
}
`;

  const depthFragment = `
varying float vDepth;
vec4 packDepth(float d) {
  vec4 enc = fract(clamp(d, 0.0, 0.9999) * vec4(1.0, 255.0, 65025.0, 16581375.0));
  enc -= enc.yzww * vec4(1.0 / 255.0, 1.0 / 255.0, 1.0 / 255.0, 0.0);
  return enc;
}
void main() {
  gl_FragColor = packDepth(vDepth);
}
`;

  function litMaterial(shared, name) {
    return new THREE.ShaderMaterial({
      name: name || 'lit',
      uniforms: uniforms(shared),
      vertexShader: litVertex,
      fragmentShader: litFragment
    });
  }

  // 把 Geo.Soup 变成 BufferGeometry
  function geometryFromSoup(soup) {
    const a = soup.arrays();
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(a.position, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(a.normal, 3));
    g.setAttribute('color', new THREE.BufferAttribute(a.color, 3));
    g.setAttribute('fx', new THREE.BufferAttribute(a.fx, 4));
    g.computeBoundingSphere();
    return g;
  }

  return {
    NUM_LIGHTS: NUM_LIGHTS,
    createShared: createShared,
    uniforms: uniforms,
    common: common,
    wind: wind,
    shadowFrag: shadowFrag,
    lights: lights,
    litVertex: litVertex,
    litFragment: litFragment,
    depthVertex: depthVertex,
    depthFragment: depthFragment,
    litMaterial: litMaterial,
    geometryFromSoup: geometryFromSoup
  };
})();

// ===== pipeline.js =====
'use strict';

// 渲染管线：阴影深度 → HDR 场景（可带 MSAA）→ Bloom 下/上采样链 → 合成（色调映射、暗角、sRGB、抖动）。
// r150 的 UMD 包不带 EffectComposer，这里全部用 WebGLRenderTarget + 全屏三角形自己串。
const Pipeline = (function () {
  const BLOOM_LEVELS = 5;

  const quadVertex = `
varying vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

  const codec = `
uniform float uEncode;
vec3 dec(vec3 c) { return mix(c, c * c * 4.0, uEncode); }
vec3 enc(vec3 c) { c = max(c, vec3(0.0)); return mix(c, sqrt(min(c * 0.25, vec3(1.0))), uEncode); }
`;

  const prefilterFragment = `
varying vec2 vUv;
uniform sampler2D tSource;
uniform vec2 uTexel;
uniform vec2 uThreshold;
${codec}
void main() {
  vec3 c = dec(texture2D(tSource, vUv + uTexel * vec2(-0.5, -0.5)).rgb) + dec(texture2D(tSource, vUv + uTexel * vec2(0.5, -0.5)).rgb)
         + dec(texture2D(tSource, vUv + uTexel * vec2(-0.5, 0.5)).rgb) + dec(texture2D(tSource, vUv + uTexel * vec2(0.5, 0.5)).rgb);
  c = min(c * 0.25, vec3(24.0));
  float br = max(c.r, max(c.g, c.b));
  float knee = uThreshold.y;
  float soft = clamp(br - uThreshold.x + knee, 0.0, 2.0 * knee);
  soft = soft * soft / (4.0 * knee + 0.0001);
  c *= max(soft, br - uThreshold.x) / max(br, 0.0001);
  gl_FragColor = vec4(enc(c), 1.0);
}
`;

  const downFragment = `
varying vec2 vUv;
uniform sampler2D tSource;
uniform vec2 uTexel;
${codec}
void main() {
  vec3 c = dec(texture2D(tSource, vUv).rgb) * 4.0;
  c += dec(texture2D(tSource, vUv + uTexel * vec2(-1.0, -1.0)).rgb);
  c += dec(texture2D(tSource, vUv + uTexel * vec2(1.0, -1.0)).rgb);
  c += dec(texture2D(tSource, vUv + uTexel * vec2(-1.0, 1.0)).rgb);
  c += dec(texture2D(tSource, vUv + uTexel * vec2(1.0, 1.0)).rgb);
  gl_FragColor = vec4(enc(c * 0.125), 1.0);
}
`;

  const upFragment = `
varying vec2 vUv;
uniform sampler2D tSource;
uniform sampler2D tBase;
uniform vec2 uTexel;
uniform float uSpread;
${codec}
void main() {
  vec3 c = dec(texture2D(tSource, vUv + uTexel * vec2(-2.0, 0.0)).rgb) + dec(texture2D(tSource, vUv + uTexel * vec2(2.0, 0.0)).rgb)
         + dec(texture2D(tSource, vUv + uTexel * vec2(0.0, -2.0)).rgb) + dec(texture2D(tSource, vUv + uTexel * vec2(0.0, 2.0)).rgb);
  c += 2.0 * (dec(texture2D(tSource, vUv + uTexel * vec2(-1.0, -1.0)).rgb) + dec(texture2D(tSource, vUv + uTexel * vec2(1.0, -1.0)).rgb)
            + dec(texture2D(tSource, vUv + uTexel * vec2(-1.0, 1.0)).rgb) + dec(texture2D(tSource, vUv + uTexel * vec2(1.0, 1.0)).rgb));
  c /= 12.0;
  vec3 base = dec(texture2D(tBase, vUv).rgb);
  gl_FragColor = vec4(enc(mix(base, c, uSpread)), 1.0);
}
`;

  const compositeFragment = `
varying vec2 vUv;
uniform sampler2D tScene;
uniform sampler2D tBloom;
uniform vec4 uGrade;
uniform vec3 uTint;
uniform float uFrame;
${codec}
float hash21(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
void main() {
  vec3 c = dec(texture2D(tScene, vUv).rgb);
  vec3 b = dec(texture2D(tBloom, vUv).rgb);
  c += b * uGrade.y;
  c *= uGrade.x;
  vec2 q = (vUv - 0.5) * vec2(1.0, 0.82);
  c *= mix(1.0, smoothstep(0.82, 0.18, length(q)), uGrade.z);
  c = aces(c);
  // 轻微的分离色调：暗部偏冷、亮部保留暖色，再提一点饱和度
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = mix(vec3(l), c, uGrade.w);
  c += uTint * (1.0 - l) * (1.0 - l);
  c = pow(max(c, vec3(0.0)), vec3(1.0 / 2.2));
  // 暗部渐变在 8 位下会出色带，加一像素级抖动
  c += (hash21(gl_FragCoord.xy + uFrame) - 0.5) / 255.0;
  gl_FragColor = vec4(c, 1.0);
}
`;

  const probeFragment = `
varying vec2 vUv;
uniform sampler2D tSource;
uniform float uMode;
void main() {
  gl_FragColor = uMode < 0.5 ? vec4(2.0, 0.5, 0.25, 1.0) : vec4(texture2D(tSource, vUv).rgb * 0.25, 1.0);
}
`;

  function makeQuad() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
    return g;
  }

  function postMaterial(name, fragment, uniforms) {
    return new THREE.ShaderMaterial({
      name: name, uniforms: uniforms, vertexShader: quadVertex, fragmentShader: fragment, depthTest: false, depthWrite: false
    });
  }

  // 实测某种渲染目标能不能用：往里画一个 >1 的颜色，再缩回 8 位读出来比对。
  // 只用 three 的接口，不直接碰 GL 上下文。
  function probe(renderer, type, samples) {
    let ok = false;
    const quad = makeQuad();
    const src = new THREE.WebGLRenderTarget(4, 4, { type: type, samples: samples, depthBuffer: true, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    const dst = new THREE.WebGLRenderTarget(4, 4, { type: THREE.UnsignedByteType, depthBuffer: false, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
    const mat = postMaterial('probe', probeFragment, { tSource: { value: null }, uMode: { value: 0 } });
    const scene = new THREE.Scene();
    const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const mesh = new THREE.Mesh(quad, mat);
    mesh.frustumCulled = false;
    scene.add(mesh);
    try {
      renderer.setRenderTarget(src);
      renderer.render(scene, cam);
      mat.uniforms.tSource.value = src.texture;
      mat.uniforms.uMode.value = 1;
      renderer.setRenderTarget(dst);
      renderer.render(scene, cam);
      const px = new Uint8Array(4);
      renderer.readRenderTargetPixels(dst, 1, 1, 1, 1, px);
      ok = Math.abs(px[0] - 128) < 6 && Math.abs(px[1] - 32) < 6 && Math.abs(px[2] - 16) < 6;
    } catch (error) {
      ok = false;
    }
    renderer.setRenderTarget(null);
    src.dispose(); dst.dispose(); mat.dispose(); quad.dispose();
    return ok;
  }

  // 依次尝试 HDR+MSAA → HDR → 8 位编码，返回第一个实测可用的
  function detect(renderer, wantSamples) {
    if (!renderer.capabilities.isWebGL2) return { hdr: false, samples: 0 };
    // 部分移动端只提供半浮点的可渲染扩展，three 默认只申请 float 版，这里补申请一次
    renderer.extensions.get('EXT_color_buffer_half_float');
    if (wantSamples > 0 && probe(renderer, THREE.HalfFloatType, wantSamples)) return { hdr: true, samples: wantSamples };
    if (probe(renderer, THREE.HalfFloatType, 0)) return { hdr: true, samples: 0 };
    if (wantSamples > 0 && probe(renderer, THREE.UnsignedByteType, wantSamples)) return { hdr: false, samples: wantSamples };
    return { hdr: false, samples: 0 };
  }

  function create(renderer, shared, opts) {
    const mode = opts.mode;
    const type = mode.hdr ? THREE.HalfFloatType : THREE.UnsignedByteType;
    shared.uEncode.value = mode.hdr ? 0 : 1;

    const quad = makeQuad();
    const postScene = new THREE.Scene();
    const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const postMesh = new THREE.Mesh(quad, null);
    postMesh.frustumCulled = false;
    postScene.add(postMesh);

    const linear = { type: type, depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
    const sceneTarget = new THREE.WebGLRenderTarget(4, 4, {
      type: type, depthBuffer: true, samples: mode.samples, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter
    });
    const down = [], up = [];
    for (let i = 0; i <= BLOOM_LEVELS; i++) down.push(new THREE.WebGLRenderTarget(4, 4, linear));
    for (let i = 0; i < BLOOM_LEVELS; i++) up.push(new THREE.WebGLRenderTarget(4, 4, linear));

    const shadowSize = opts.shadowSize;
    const shadowTarget = new THREE.WebGLRenderTarget(shadowSize, shadowSize, {
      type: THREE.UnsignedByteType, depthBuffer: true, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter
    });
    const shadowCamera = new THREE.OrthographicCamera(-opts.shadowExtent, opts.shadowExtent, opts.shadowExtent, -opts.shadowExtent, 1, opts.shadowDepth);
    shadowCamera.layers.set(1);
    const depthMaterial = new THREE.ShaderMaterial({
      name: 'shadow-depth', uniforms: Shaders.uniforms(shared), vertexShader: Shaders.depthVertex, fragmentShader: Shaders.depthFragment
    });
    shared.uShadowMap.value = shadowTarget.texture;
    shared.uShadowParams.value.set(1 / shadowSize, opts.shadowBias, opts.shadowStrength, 1);

    const encode = shared.uEncode;
    const prefilter = postMaterial('bloom-prefilter', prefilterFragment, {
      tSource: { value: null }, uTexel: { value: new THREE.Vector2() }, uThreshold: { value: new THREE.Vector2(opts.bloomThreshold, opts.bloomKnee) }, uEncode: encode
    });
    const downMat = postMaterial('bloom-down', downFragment, { tSource: { value: null }, uTexel: { value: new THREE.Vector2() }, uEncode: encode });
    const upMat = postMaterial('bloom-up', upFragment, {
      tSource: { value: null }, tBase: { value: null }, uTexel: { value: new THREE.Vector2() }, uSpread: { value: opts.bloomSpread }, uEncode: encode
    });
    const composite = postMaterial('composite', compositeFragment, {
      tScene: { value: sceneTarget.texture }, tBloom: { value: up[0].texture },
      // x 曝光, y Bloom 强度, z 暗角, w 饱和度
      uGrade: { value: new THREE.Vector4(1, opts.bloomStrength, opts.vignette, opts.saturation) },
      uTint: { value: new THREE.Color(0, 0, 0) }, uFrame: { value: 0 }, uEncode: encode
    });

    const black = new THREE.Color(0, 0, 0);
    const white = new THREE.Color(1, 1, 1);
    const bias = new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
    const shadowCenter = new THREE.Vector3();
    let width = 4, height = 4, frame = 0;

    function setSize(w, h) {
      width = Math.max(4, Math.floor(w));
      height = Math.max(4, Math.floor(h));
      sceneTarget.setSize(width, height);
      let bw = width, bh = height;
      for (let i = 0; i <= BLOOM_LEVELS; i++) {
        bw = Math.max(2, Math.floor(bw / 2));
        bh = Math.max(2, Math.floor(bh / 2));
        down[i].setSize(bw, bh);
        if (i < BLOOM_LEVELS) up[i].setSize(bw, bh);
      }
    }

    function pass(material, target) {
      postMesh.material = material;
      renderer.setRenderTarget(target);
      renderer.render(postScene, postCamera);
    }

    function renderShadow(scene, sunDir, center) {
      shadowCenter.copy(center);
      shadowCamera.position.copy(center).addScaledVector(sunDir, opts.shadowDepth * 0.5);
      shadowCamera.lookAt(shadowCenter);
      shadowCamera.updateMatrixWorld();
      shared.uShadowMatrix.value.copy(bias).multiply(shadowCamera.projectionMatrix).multiply(shadowCamera.matrixWorldInverse);
      renderer.setRenderTarget(shadowTarget);
      renderer.setClearColor(white, 1);
      scene.overrideMaterial = depthMaterial;
      renderer.render(scene, shadowCamera);
      scene.overrideMaterial = null;
    }

    function render(scene, camera, sunDir, center) {
      renderShadow(scene, sunDir, center);

      renderer.setClearColor(black, 1);
      renderer.setRenderTarget(sceneTarget);
      renderer.render(scene, camera);

      prefilter.uniforms.tSource.value = sceneTarget.texture;
      prefilter.uniforms.uTexel.value.set(1 / width, 1 / height);
      pass(prefilter, down[0]);
      for (let i = 1; i <= BLOOM_LEVELS; i++) {
        downMat.uniforms.tSource.value = down[i - 1].texture;
        downMat.uniforms.uTexel.value.set(0.5 / down[i - 1].width, 0.5 / down[i - 1].height);
        pass(downMat, down[i]);
      }
      for (let i = BLOOM_LEVELS - 1; i >= 0; i--) {
        const source = i === BLOOM_LEVELS - 1 ? down[BLOOM_LEVELS] : up[i + 1];
        upMat.uniforms.tSource.value = source.texture;
        upMat.uniforms.tBase.value = down[i].texture;
        upMat.uniforms.uTexel.value.set(0.5 / source.width, 0.5 / source.height);
        pass(upMat, up[i]);
      }
      frame = (frame + 1) % 64;
      composite.uniforms.uFrame.value = frame;
      pass(composite, null);
    }

    function dispose() {
      sceneTarget.dispose();
      shadowTarget.dispose();
      for (let i = 0; i < down.length; i++) down[i].dispose();
      for (let i = 0; i < up.length; i++) up[i].dispose();
      prefilter.dispose(); downMat.dispose(); upMat.dispose(); composite.dispose(); depthMaterial.dispose();
      quad.dispose();
    }

    return { mode: mode, grade: composite.uniforms.uGrade.value, tint: composite.uniforms.uTint.value, setSize: setSize, render: render, dispose: dispose };
  }

  return { detect: detect, create: create };
})();

  const DIRECTIONS = { uSunDir: true, uBodyDir: true, uMoonDir: true, uSunBodyDir: true };

  function copyValue(v) {
    return typeof v === 'number' ? v : v.clone();
  }

  function create(shared, start) {
    const pal = palettes();
    const order = Config.time.order.filter(function (key) { return !!pal[key]; });
    const phases = order.map(function (key) { return { key: key, label: pal[key].label }; });
    const targets = {};

    // from = 开始过渡那一刻的画面；live = 当前画面。从半路再按空格也不会跳变。
    const from = {}, live = {};
    const keys = [];
    for (const key in pal.night) {
      if (key === 'label') continue;
      keys.push(key);
      from[key] = copyValue(pal.night[key]);
      live[key] = copyValue(pal.night[key]);
    }

    const state = {
      index: Math.max(0, order.indexOf(start)),
      key: '',
      label: '',
      count: order.length,
      night: true,
      // 当前这次过渡的进度：0 = 刚开始，1 = 已到位
      blend: 1,
      elapsed: 0,
      transitioning: false,
      exposure: 1,
      tint: live.tint
    };

    function register(uniforms) {
      for (const key in uniforms) {
        if (!(key in live)) continue;
        if (!targets[key]) targets[key] = [];
        if (targets[key].indexOf(uniforms[key]) === -1) targets[key].push(uniforms[key]);
      }
    }

    function push() {
      for (const key in targets) {
        const v = live[key];
        const list = targets[key];
        for (let i = 0; i < list.length; i++) {
          if (typeof v === 'number') list[i].value = v;
          else list[i].value.copy(v);
        }
      }
      state.exposure = live.exposure;
    }

    function mix(a, b, t) {
      for (let i = 0; i < keys.length; i++) {
        const key = keys[i];
        const x = a[key], y = b[key];
        if (typeof x === 'number') live[key] = x + (y - x) * t;
        else if (x.isColor) live[key].lerpColors(x, y, t);
        else {
          live[key].lerpVectors(x, y, t);
          if (DIRECTIONS[key]) live[key].normalize();
        }
      }
      push();
    }

    function target(index) {
      state.index = ((index % order.length) + order.length) % order.length;
      state.key = order[state.index];
      state.label = pal[state.key].label;
      state.night = pal[state.key].uNight > 0.5;
      return pal[state.key];
    }

    function setPhase(index, instant) {
      const to = target(index);
      if (instant) {
        state.blend = 1;
        state.transitioning = false;
        mix(to, to, 1);
        return state;
      }
      for (let i = 0; i < keys.length; i++) {
        const key = keys[i];
        if (typeof live[key] === 'number') from[key] = live[key];
        else from[key].copy(live[key]);
      }
      state.blend = 0;
      state.elapsed = 0;
      state.transitioning = true;
      return state;
    }

    function next() {
      return setPhase(state.index + 1, false);
    }

    function update(dt) {
      if (!state.transitioning) return;
      state.elapsed += dt;
      const k = Utils.clamp(state.elapsed / Config.time.transition, 0, 1);
      state.blend = Utils.easeInOutCubic(k);
      mix(from, pal[state.key], state.blend);
      if (k >= 1) state.transitioning = false;
    }

    // 离线预览用：直接摆出"a 到 b 走了 t"的画面
    function preview(a, b, t) {
      const pa = pal[order[((a % order.length) + order.length) % order.length]];
      const pb = target(b);
      state.transitioning = false;
      state.blend = t;
      mix(pa, pb, t);
    }

    function indexOf(key) {
      return order.indexOf(key);
    }

    register(shared);
    setPhase(state.index, true);

    return {
      state: state,
      phases: phases,
      moonDir: live.uMoonDir,
      sunBodyDir: live.uSunBodyDir,
      register: register,
      refresh: push,
      next: next,
      setPhase: setPhase,
      preview: preview,
      indexOf: indexOf,
      update: update
    };
  }

  return { create: create };
})();

'use strict';

// 天穹：渐变天空、程序化星空与银河、极光、流星、带环形山的巨大月亮、白天的太阳。
// 全部在一个片元着色器里完成，不使用任何图片。
const Sky = (function () {
  const vertex = `
varying vec3 vDir;
void main() {
  vDir = position;
  // 去掉视图矩阵的平移，天穹永远以相机为中心；z = w 把它钉在远平面上，最后画以节省填充
  vec4 p = projectionMatrix * vec4(mat3(viewMatrix) * position, 1.0);
  gl_Position = p.xyww;
}
`;

  const fragment = `
varying vec3 vDir;
uniform vec3 uZenith;
uniform vec3 uMid;
uniform vec3 uHorizon;
uniform vec3 uNadir;
uniform float uStar;
uniform float uMoonGain;
uniform float uSunGain;
uniform float uAurora;
uniform vec3 uMoonDir;
uniform vec3 uSunBodyDir;
uniform vec2 uBodySize;
uniform vec3 uMoonTint;
uniform vec3 uSunTint;
${Shaders.common}

vec3 starLayer(vec3 d, float scale, float density, float seed) {
  vec3 p = d * scale;
  vec3 id = floor(p);
  vec3 f = fract(p) - 0.5;
  float h = hash31(id + seed);
  float keep = step(h, density);
  vec3 o = (vec3(hash31(id + 11.3 + seed), hash31(id + 27.7 + seed), hash31(id + 43.1 + seed)) - 0.5) * 0.6;
  float dist = length(f - o);
  float b = h / max(density, 0.0001);
  b = b * b;
  b = b * b;
  float tw = 0.72 + 0.28 * sin(uTime * (1.2 + 3.5 * hash31(id + 5.1)) + h * 300.0);
  float size = 0.07 + 0.09 * b;
  float core = smoothstep(size, 0.0, dist);
  vec3 tint = mix(vec3(0.72, 0.82, 1.0), vec3(1.0, 0.88, 0.74), hash31(id + 71.9));
  return tint * (core * core * (0.35 + 5.0 * b) * tw * keep);
}

// 极光：几道沿方位角展开的光幕。用 normalize(d.xz) 当噪声坐标，绕一圈没有接缝
vec3 aurora(vec3 d) {
  vec3 acc = vec3(0.0);
  vec2 c = normalize(d.xz + vec2(0.0001, 0.0));
  float t = uTime * 0.05;
  for (int i = 0; i < AURORA_STEPS; i++) {
    float fi = float(i);
    float base = 0.17 + 0.1 * fi + 0.1 * (vnoise(c * 1.6 + vec2(fi * 5.3 + t, 2.0)) - 0.5) + 0.05 * sin(c.x * 3.0 + c.y * 2.0 + fi * 2.1 + t * 2.0);
    float hgt = d.y - base;
    float profile = smoothstep(-0.012, 0.03, hgt) * exp(-max(hgt, 0.0) * (6.5 - fi * 1.2));
    float rays = 0.3 + 0.7 * vnoise(c * (19.0 + fi * 6.0) + vec2(t * 2.4, fi * 9.0 + hgt * 2.2));
    float sweep = smoothstep(0.34, 0.74, vnoise(c * 1.15 + vec2(fi * 7.7, t * 0.8)));
    vec3 tint = mix(vec3(0.1, 1.0, 0.6), vec3(0.5, 0.28, 1.0), smoothstep(0.0, 0.3, hgt + fi * 0.05));
    acc += tint * (profile * rays * sweep);
  }
  return acc * 0.5;
}

// 每隔几秒划过一颗流星：位置和方向由时间片编号哈希出来
float meteor(vec3 d, float period, float seed) {
  float slot = floor(uTime / period);
  float lt = (uTime - slot * period) / 0.9;
  if (lt > 1.0) return 0.0;
  float az = hash11(slot * 1.7 + seed) * 6.283;
  float el = 0.35 + 0.5 * hash11(slot * 3.1 + seed + 2.0);
  vec3 p0 = vec3(cos(az) * cos(el), sin(el), sin(az) * cos(el));
  vec3 side = normalize(cross(p0, vec3(0.0, 1.0, 0.0)));
  vec3 vel = normalize(side * (hash11(slot + seed + 9.0) > 0.5 ? 1.0 : -1.0) - vec3(0.0, 0.55, 0.0));
  vec3 head = p0 + vel * (lt * 0.42);
  vec3 tail = head - vel * (0.16 * smoothstep(0.0, 0.25, lt));
  vec3 ab = head - tail;

'use strict';

// 主岛地形的解析描述：边缘轮廓、顶面高度、功能区位置。
// 其他模块（遗迹、植被、水、水晶）都靠它把东西贴到地面上。
const Terrain = (function () {
  function smooth(e0, e1, x) {
    const t = Utils.clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  function distToPath(x, z, pts) {
    let best = Infinity;
    for (let i = 0; i < pts.length - 1; i++) {
      const ax = pts[i][0], az = pts[i][1], bx = pts[i + 1][0], bz = pts[i + 1][1];
      const dx = bx - ax, dz = bz - az;
      const t = Utils.clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1);
      const px = ax + dx * t - x, pz = az + dz * t - z;
      const d = px * px + pz * pz;
      if (d < best) best = d;
    }
    return Math.sqrt(best);
  }

  function createField(noise) {
    const C = Config.island, T = Config.tree, R0 = C.radius;
    // 低处遗迹平台朝向默认机位（前方）
    const terrace = { x: 0.3, z: 0.954 };
    const plaza = { x: 2.9, z: 9.3, r: 2.9 };
    const pond = { x: -3.7, z: 0.9, r: 1.25 };
    // 溪流：泉眼 → 西侧崖边（默认机位的左前方），尽头是瀑布
    const stream = [[-3.7, 0.9], [-5.6, 1.9], [-7.6, 1.5], [-9.4, 0.3], [-11.2, -0.5], [-14.5, -1.0]];
    // 小径：平台 → 树下
    const path = [[2.6, 6.9], [1.7, 5.2], [1.9, 3.2], [0.9, 1.5]];

    function edgeR(x, z) {
      const l = Math.sqrt(x * x + z * z) || 1, ux = x / l, uz = z / l;
      let r = R0 * (1 + 0.11 * noise.fbm(ux * 1.25 + 3.1, 0.5, uz * 1.25, 3) + 0.03 * noise.n3(ux * 4.2, 7.7, uz * 4.2));
      r += 3.3 * smooth(0.6, 0.97, ux * terrace.x + uz * terrace.z);
      return r;
    }

    function terraceMask(x, z) {
      const proj = x * terrace.x + z * terrace.z, lat = Math.abs(x * terrace.z - z * terrace.x);
      return smooth(6.3, 7.3, proj + 0.35 * noise.n3(x * 0.5, 2.2, z * 0.5)) * (1 - smooth(4.6, 6.8, lat));
    }

    function top(x, z) {
      const r = Math.sqrt(x * x + z * z), k = r / edgeR(x, z);
      let h = 0.24 * noise.fbm(x * 0.21, 0, z * 0.21, 3) + 0.05 * noise.n3(x * 0.9, 4.0, z * 0.9);
      // 后半边缓缓抬高，低机位也能看到顶面的层次
      h += 1.1 * smooth(1.5, -8.0, z * 0.81 - x * 0.58);
      const dx = x - T.x, dz = z - T.z;
      h += 1.25 * Math.exp(-(dx * dx + dz * dz) / (2 * 3.1 * 3.1));
      h += 0.3 * smooth(0.55, 0.88, k) * (0.5 + 0.5 * noise.n3(x * 0.33, 9.0, z * 0.33));
      const tm = terraceMask(x, z);
      h = Utils.lerp(h, -1.9 + 0.05 * noise.n3(x * 0.8, 1.0, z * 0.8), tm);
      const px = x - pond.x, pz = z - pond.z;
      h -= 0.62 * Math.exp(-(px * px + pz * pz) / (2 * pond.r * pond.r * 0.62));
      h -= 0.4 * smooth(1.0, 0.25, distToPath(x, z, stream));
      h -= 0.45 * smooth(0.9, 1.0, k);
      return h;
    }

    // 顶面法线（解析高度场的有限差分），草地用它做平滑着色
    function normal(x, z, out) {
      const e = 0.35;
      const gx = top(x + e, z) - top(x - e, z), gz = top(x, z + e) - top(x, z - e);
      const l = Math.sqrt(gx * gx + 4 * e * e + gz * gz);
      out[0] = -gx / l; out[1] = 2 * e / l; out[2] = -gz / l;
      return out;
    }

    function cliffDrop(x, z) {
      const l = Math.sqrt(x * x + z * z) || 1;
      return 3.0 + 0.9 * noise.fbm(x / l * 2.2 + 5.0, 3.0, z / l * 2.2, 2);
    }

    function inside(x, z, margin) {
      return Math.sqrt(x * x + z * z) < edgeR(x, z) - margin;
    }

    return {
      edgeR: edgeR, top: top, normal: normal, cliffDrop: cliffDrop, terraceMask: terraceMask, inside: inside,
      pond: pond, plaza: plaza, stream: stream, path: path, terrace: terrace, distToPath: distToPath
    };
  }

  return { createField: createField, smooth: smooth, distToPath: distToPath };
})();

// 岛底：倒悬的岩体群、钟乳石和发光晶簇。往主岛的同一个 Soup 里写，由 island.js 调用。
const Underside = (function () {

  function rockMass(soup, noise, o) {

      profile.push([r, -o.len * (1 - t) + (i > 0 && i < rings ? (noise.hash(i, o.seed, 3) - 0.5) * o.len * 0.5 / rings : 0)]);
    }
    profile.push([o.rad * 0.96, 0.7]);

      pt[2] += o.lz * d * d + 0.05 * o.rad * Math.cos(d * 4.3 + o.seed * 1.7);
