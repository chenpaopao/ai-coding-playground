import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ---- src/config.js
// Every tunable number lives here. Pure data: no three.js import, so the offline tools in
// tools/ can load this file under Node as well.
const CONFIG = {
  seed: 20261118,

  // Scene units are arbitrary (the disc is 100 units across its radius).
  galaxy: {
    radius: 100,
    coreRadius: 20,
    discScaleLength: 21,
    // Density-wave model: every star rides its own ellipse, and the ellipses are rotated a
    // little more the larger they are. Arms appear where neighbouring ellipses crowd, so
    // they never wind up no matter how long the stars keep flowing.
    twist: 3.4, // ellipse rotation in rad per e-fold of radius; pitch angle = atan(1 / twist)
    armSpread: 0.3, // rad of random orientation scatter, sets the width of the arms
    axisRatioInner: 0.78,
    axisRatioOuter: 0.85,
    omega0: 0.5, // rad/s at the centre
    omegaCoreRadius: 14, // beyond this the rotation curve is flat
    armContrast: 0.9,
    tilt: [0.0, 0.0, 0.16],
  },

  // Particle counts at density 1.
  population: {
    bulge: 40000,
    disc: 150000,
    young: 60000,
    hii: 900,
    dust: 3600,
    backdrop: 7000,
  },

  density: { low: 0.35, medium: 0.65, high: 1, ultra: 2 },

  look: {
    starSize: 1,
    starBrightness: 1,
    dustBrightness: 1,
    skyIntensity: 1,
    twinkle: 0.3,
    exposure: 1,
    starMaxPointPx: 48,
    // Closer than this, sprites lose opacity as they grow so a fly-through does not white out.
    referenceDepth: 150,
    dustMaxPointFraction: 0.45, // of the viewport height; larger gas sprites are culled
  },

  bloom: { strength: 0.35, radius: 0.35, threshold: 0.3 },

  flow: { timeScale: 1, maxTimeScale: 4 },

  camera: {
    fov: 55,
    near: 0.5,
    far: 6000,
    home: { radius: 225, polar: 0.98, azimuth: 0.55 },
    intro: { radius: 640, polar: 0.22, azimuth: -1.7, duration: 4.5 },
    resetDuration: 0.8,
    minDistance: 18,
    maxDistance: 700,
    autoRotateSpeed: 0.35,
    // Portrait screens pull the camera back so the disc still fits the width.
    fitAspect: 1.35,
  },

  // Ripple sent through the disc on double-click: `lift` is both the height of the wave and
  // (through the shader) how much it brightens the stars it passes.
  pulse: { duration: 3.4, width: 9, lift: 5, reach: 1.4 },

  loop: { maxDelta: 0.1 },

  render: { maxPixelRatio: 2 },

// ---- src/rng.js
// Seeded generator (mulberry32) so a seed always rebuilds the same galaxy.
function createRng(seed) {
  let state = seed >>> 0;
  let spare = null;

  function next() {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function range(min, max) {
    return min + (max - min) * next();
  }

  // Box-Muller; the second value of each pair is kept for the next call.
  function gauss() {
    if (spare !== null) {
      const value = spare;
      spare = null;
      return value;
    }
    const radius = Math.sqrt(-2 * Math.log(1 - next()));
    const angle = 2 * Math.PI * next();
    spare = radius * Math.sin(angle);
    return radius * Math.cos(angle);
  }

  return { next, range, gauss };
}

// ---- src/galaxy-data.js
// Builds the particle buffers. Pure data (no three.js) so the same generator feeds both the
// browser scene and the offline preview renderer.

const TAU = Math.PI * 2;

function createLayer(count) {
  return {
    count,
    position: new Float32Array(count * 3),
    color: new Float32Array(count * 3),
    params: new Float32Array(count * 4),
    cursor: 0,
  };
}

function put(layer, px, py, pz, r, g, b, size, seed, brightness, arm) {
  const i = layer.cursor++;
  layer.position[i * 3] = px;
  layer.position[i * 3 + 1] = py;
  layer.position[i * 3 + 2] = pz;
  layer.color[i * 3] = r;
  layer.color[i * 3 + 1] = g;
  layer.color[i * 3 + 2] = b;
  layer.params[i * 4] = size;
  layer.params[i * 4 + 1] = seed;
  layer.params[i * 4 + 2] = brightness;
  layer.params[i * 4 + 3] = arm;
}

// Radii for a disc whose surface density falls off as exp(-r / scale), kept inside [min, max].
function discRadius(rng, scale, min, max) {
  for (let attempt = 0; attempt < 32; attempt++) {
    const r = -scale * Math.log((1 - rng.next()) * (1 - rng.next()));
    if (r >= min && r <= max) return r;
  }
  return rng.range(min, max);
}

function mix(a, b, t) {
  return a + (b - a) * t;
}

function scaledCounts(population, density) {
  return {
    bulge: Math.round(population.bulge * density),
    disc: Math.round(population.disc * density),
    young: Math.round(population.young * density),
    hii: Math.round(population.hii * density),
    dust: Math.round(population.dust * density),
    // The backdrop is cheap and looks sparse when thinned, so it ignores density.
    backdrop: population.backdrop,
  };
}

function generateGalaxy(config, seed, density) {
  const g = config.galaxy;
  const counts = scaledCounts(config.population, density);
  const rng = createRng(seed);
  const R = g.radius;
  const core = g.coreRadius;

  const stars = createLayer(counts.bulge + counts.disc + counts.young + counts.hii);
  const dust = createLayer(counts.dust);
  const backdrop = createLayer(counts.backdrop);

  // Bulge: old, warm stars in a flattened spheroid.
  for (let i = 0; i < counts.bulge; i++) {
    // Rayleigh-distributed radius = a 2D gaussian in the plane, so with a gaussian height
    // the bulge is an even ellipsoid without a cusp or a column of stars on the axis.
    const a = Math.min(core * 0.4 * Math.sqrt(-2 * Math.log(1 - rng.next())), core * 1.7);
    const y = rng.gauss() * core * 0.24;
    const warmth = rng.next();
    put(stars, a, rng.next() * TAU, y,
      1.0, mix(0.48, 0.7, warmth), mix(0.15, 0.36, warmth),
      rng.range(0.4, 0.9), rng.next(), rng.range(0.06, 0.14), 0);
  }

  // Disc: the bulk of the stars, shading from warm white near the core to cool white outside.
  for (let i = 0; i < counts.disc; i++) {
    const a = discRadius(rng, g.discScaleLength, 2, R * 1.25);
    const t = Math.min(a / R, 1);
    const y = rng.gauss() * (1.0 + 0.9 * t);
    const jitter = rng.range(-0.08, 0.08);
    let r = mix(1.0, 0.62, t) + jitter;
    let gr = mix(0.76, 0.78, t);
    let b = mix(0.45, 1.0, t) - jitter;
    let size = rng.range(0.3, 0.8);
    let brightness = rng.range(0.14, 0.38);
    const roll = rng.next();
    if (roll > 0.992) {
      // Rare giants give the eye individual stars to follow as the disc turns.
      size *= 2.6;
      brightness = 1.0;
      if (rng.next() > 0.5) { r = 1.0; gr = 0.55; b = 0.3; }
    }
    put(stars, a, rng.next() * TAU, y, r, gr, b, size, rng.next(), brightness, 0.25);
  }

  // Young blue stars: only visible while they cross a spiral arm.
  for (let i = 0; i < counts.young; i++) {
    const a = discRadius(rng, 27, core * 0.6, R * 1.15);
    const cool = rng.next();
    put(stars, a, rng.next() * TAU, rng.gauss() * 0.7,
      mix(0.3, 0.7, cool), mix(0.55, 0.85, cool), 1.0,
      rng.range(0.4, 1.2), rng.next(), rng.range(0.16, 0.5), 1);
  }

  // HII regions: pink star-forming knots strung along the arms.
  for (let i = 0; i < counts.hii; i++) {
    const a = discRadius(rng, 30, core * 0.8, R * 1.05);
    const violet = rng.next();
    put(stars, a, rng.next() * TAU, rng.gauss() * 0.5,
      1.0, mix(0.2, 0.34, violet), mix(0.42, 0.8, violet),
      rng.range(1.8, 3.4), rng.next(), rng.range(0.35, 0.7), 1);
  }

  // Gas: large soft sprites that turn the arms into continuous glowing lanes.
  for (let i = 0; i < counts.dust; i++) {
    const a = discRadius(rng, 25, 3, R * 1.1);
    const t = Math.min(a / R, 1);
    const inner = Math.max(0, 1 - a / (core * 1.2));
    const violet = rng.next();
    put(dust, a, rng.next() * TAU, rng.gauss() * (1.2 + t),
      mix(mix(0.08, 0.42, violet * violet), 1.0, inner),
      mix(mix(0.34, 0.14, violet * violet), 0.5, inner),
      mix(mix(1.0, 0.8, violet * violet), 0.2, inner),
      rng.range(9, 20), rng.next(), rng.range(0.03, 0.06), 0.85 * (1 - inner));
  }

  // Backdrop: fixed far stars. Here `position` is a real position.
  for (let i = 0; i < counts.backdrop; i++) {
    const z = rng.range(-1, 1);
    const angle = rng.next() * TAU;
    const ring = Math.sqrt(1 - z * z);
    const distance = rng.range(2200, 3000);
    const tint = rng.next();
    const magnitude = Math.pow(rng.next(), 5);
    put(backdrop, ring * Math.cos(angle) * distance, z * distance, ring * Math.sin(angle) * distance,
      mix(0.7, 1.0, tint), mix(0.8, 0.9, tint), mix(1.0, 0.75, tint),
      1.6 + magnitude * 2.6, rng.next(), 0.25 + magnitude * 0.75, 0);
  }

  return { stars, dust, backdrop, counts };
}

// Plain uniform values derived from the config. galaxy.js wraps them for three.js and the
// preview renderer feeds them to raw GL, so both start from the same numbers.
function orbitUniformValues(config) {
  const g = config.galaxy;
  const look = config.look;
  return {
    shared: {
      uTime: 0,
      uClock: 0,
      uTwist: g.twist,
      uArmSpread: g.armSpread,
      uCoreRadius: g.coreRadius,
      uRadius: g.radius,
      uAxisInner: g.axisRatioInner,
      uAxisOuter: g.axisRatioOuter,
      uOmega0: g.omega0,
      uOmegaCore: g.omegaCoreRadius,
      uArmContrast: g.armContrast,
      uTwinkle: look.twinkle,
      uPixelScale: 1,
      uRefDepth: look.referenceDepth,
      uPulse: [-1000, 0, config.pulse.width],
    },
    stars: { uSizeScale: look.starSize, uBrightness: look.starBrightness, uSoft: 0, uMaxPoint: look.starMaxPointPx },
    // uMaxPoint and uPointScale depend on the viewport; Galaxy.setViewport() fills them in.
    dust: { uSizeScale: 1, uBrightness: look.dustBrightness, uSoft: 1, uMaxPoint: 1 },
    backdrop: { uPointScale: 1, uBrightness: 1 },
    sky: { uIntensity: look.skyIntensity },
  };
}

// World-space sprite sizes are converted to pixels with this factor divided by view depth.
function pixelScale(drawingBufferHeight, fovDegrees) {
  return drawingBufferHeight / (2 * Math.tan((fovDegrees * Math.PI) / 360));
}

// Radius, strength and width of the ripple `age` seconds after it was triggered, written into
// `out` (it runs every frame, so it must not allocate). A negative age means no ripple.
function pulseState(config, age, out) {
  const p = config.pulse;
  out[0] = -1000;
  out[1] = 0;
  out[2] = p.width;
  if (age < 0 || age >= p.duration) return out;
  const t = age / p.duration;
  // Fast attack, long tail: the wavefront decelerates as it spreads (ease-out).
  const envelope = Math.sin(Math.PI * Math.min(t * 6, 1) * 0.5) * (1 - t);
  out[0] = (1 - (1 - t) * (1 - t)) * config.galaxy.radius * p.reach;
  out[1] = p.lift * envelope;
  return out;
}

// ---- src/shaders.js
// GLSL for the galaxy. Written in the GLSL1 style three.js converts for WebGL2 (attribute /
// varying / gl_FragColor), and free of three.js #include chunks so tools/render_preview.py
// can compile the exact same strings on a headless GLES3 context.

// Stars and gas share this vertex shader. `position` does not hold a position: it packs the
// orbit (semi-major axis, starting phase, height above the disc).
const ORBIT_VERTEX = /* glsl */ `
uniform float uTime;
uniform float uClock;
uniform float uTwist;
uniform float uArmSpread;
uniform float uCoreRadius;
uniform float uRadius;
uniform float uAxisInner;
uniform float uAxisOuter;
uniform float uOmega0;
uniform float uOmegaCore;
uniform float uArmContrast;
uniform float uTwinkle;
uniform float uPixelScale;
uniform float uRefDepth;
uniform float uSizeScale;
uniform float uBrightness;
uniform float uMaxPoint;
uniform vec3 uPulse; // x: wavefront radius, y: strength, z: width

attribute vec3 aColor;
attribute vec4 aParams; // x: size, y: random seed, z: brightness, w: how much it lights up inside an arm

varying vec3 vColor;
varying float vAlpha;

float hash2(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float valueNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash2(i), hash2(i + vec2(1.0, 0.0)), f.x),
             mix(hash2(i + vec2(0.0, 1.0)), hash2(i + vec2(1.0, 1.0)), f.x), f.y);
}

float axisRatio(float a) {
  if (a < uCoreRadius) return mix(1.0, uAxisInner, a / uCoreRadius);
  if (a < uRadius) return mix(uAxisInner, uAxisOuter, (a - uCoreRadius) / (uRadius - uCoreRadius));
  return mix(uAxisOuter, 1.0, clamp((a - uRadius) / uRadius, 0.0, 1.0));
}

void main() {
  float a = position.x;
  float seed = aParams.y;

  // Flat rotation curve: inner stars lap the outer ones.
  float omega = uOmega0 * uOmegaCore / sqrt(a * a + uOmegaCore * uOmegaCore);
  float phi = position.y + omega * uTime;

  vec2 ellipse = vec2(a * cos(phi), a * axisRatio(a) * sin(phi));
  // Logarithmic twist keeps the pitch angle of the arms constant from core to rim. The
  // triangular jitter spreads stars around the crest so the arm is a band, not a hairline.
  float jitter = fract(seed * 7.31) + fract(seed * 3.17) - 1.0;
  float theta = -uTwist * log(max(a, 0.5) / uCoreRadius) + jitter * uArmSpread;
  float c = cos(theta);
  float s = sin(theta);
  vec3 p = vec3(ellipse.x * c - ellipse.y * s, position.z, ellipse.x * s + ellipse.y * c);

  // Ellipses crowd where sin(2 phi) = 1, so that is the crest of the density wave. Young
  // stars and gas only shine while they pass through it.
  float crest = 0.5 + 0.5 * sin(2.0 * phi);
  float inArm = 0.05 + 1.6 * crest * crest * crest * crest;
  // Patches fixed to the wave pattern: stars brighten as they drift through them, which
  // breaks the arms into star-forming clumps instead of two even ribbons.
  float clumps = 0.3 + 1.4 * valueNoise(p.xz * 0.085 + 31.0);
  float armLight = mix(1.0, inArm * clumps, aParams.w * uArmContrast);

  float d = (length(p.xz) - uPulse.x) / uPulse.z;
  float wave = exp(-d * d) * uPulse.y;
  p.y += wave * (0.6 + 0.8 * seed);
  p.xz *= 1.0 + wave * 0.006;

  float twinkle = 1.0 + uTwinkle * sin(uClock * (1.2 + 4.0 * seed) + seed * 97.0);

  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float depth = max(-mv.z, 0.001);
  float px = aParams.x * uSizeScale * uPixelScale / depth;

  // Sub-pixel sprites dim instead of flickering; oversized ones fade and are then culled so
  // flying through the disc does not turn into full-screen overdraw.
  float small = clamp(px / 1.5, 0.0, 1.0);
  float big = 1.0 - smoothstep(0.6 * uMaxPoint, uMaxPoint, px);
  float nearFade = smoothstep(1.5, 8.0, depth);
  // A sprite's screen area grows as 1/depth^2. Taking most of that back keeps the surface
  // brightness of the disc roughly steady while zooming in, yet close stars still read larger.
  float crowding = pow(clamp(depth / uRefDepth, 0.02, 1.0), 1.5);

  vColor = aColor;
  vAlpha = aParams.z * uBrightness * armLight * twinkle * (1.0 + wave * 0.45) * small * small * big * nearFade * crowding;

  gl_PointSize = clamp(px, 1.5, uMaxPoint);
  gl_Position = projectionMatrix * mv;
  if (vAlpha <= 0.0005) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
}
`;

// uSoft 0: tight stellar core. uSoft 1: wide falloff for gas.
const SPRITE_FRAGMENT = /* glsl */ `
uniform float uSoft;

varying vec3 vColor;
varying float vAlpha;

void main() {
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(uv, uv);
  if (r2 > 1.0) discard;
  float edge = 1.0 - r2;
  float star = exp(-r2 * 6.0) * edge;
  float cloud = edge * edge * edge;
  gl_FragColor = vec4(vColor, vAlpha * mix(star, cloud, uSoft));
}
`;

// Distant stars: fixed screen size, no orbit.
const BACKDROP_VERTEX = /* glsl */ `
uniform float uClock;
uniform float uTwinkle;
uniform float uPointScale;
uniform float uBrightness;

attribute vec3 aColor;
attribute vec4 aParams; // x: size in CSS px, y: random seed, z: brightness

varying vec3 vColor;
varying float vAlpha;

void main() {
  float seed = aParams.y;
  float twinkle = 1.0 + uTwinkle * sin(uClock * (0.8 + 3.0 * seed) + seed * 91.0);
  vColor = aColor;
  vAlpha = aParams.z * uBrightness * twinkle;
  gl_PointSize = max(aParams.x * uPointScale, 1.5);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const SKY_VERTEX = /* glsl */ `
varying vec3 vDirection;

void main() {
  vDirection = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

// Faint drifting nebulosity so the background is not a flat black.
const SKY_FRAGMENT = /* glsl */ `
uniform float uClock;
uniform float uIntensity;

varying vec3 vDirection;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 x) {
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash(i), hash(i + vec3(1.0, 0.0, 0.0)), f.x),
        mix(hash(i + vec3(0.0, 1.0, 0.0)), hash(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
    mix(mix(hash(i + vec3(0.0, 0.0, 1.0)), hash(i + vec3(1.0, 0.0, 1.0)), f.x),
        mix(hash(i + vec3(0.0, 1.0, 1.0)), hash(i + vec3(1.0, 1.0, 1.0)), f.x), f.y),
    f.z);
}

float fbm(vec3 p) {
  float value = 0.0;
  float amplitude = 0.5;
  for (int i = 0; i < 5; i++) {
    value += amplitude * noise(p);
    p = p * 2.03 + 11.5;
    amplitude *= 0.5;
  }
  return value;
}

void main() {
  vec3 dir = normalize(vDirection);
  vec3 drift = vec3(uClock * 0.004, 0.0, uClock * 0.0025);
  float broad = fbm(dir * 2.2 + drift);
  float fine = fbm(dir * 4.6 - drift * 1.7 + 7.0);
  float cloud = smoothstep(0.42, 0.8, broad);
  vec3 tint = mix(vec3(0.040, 0.016, 0.075), vec3(0.008, 0.040, 0.064), fine);
  vec3 color = vec3(0.0035, 0.0045, 0.011) + cloud * tint;
  // One LSB of noise hides banding in the dark gradients.
  color += (hash(gl_FragCoord.xyx) - 0.5) / 255.0;
  gl_FragColor = vec4(max(color, 0.0) * uIntensity, 1.0);
}
`;

// ---- src/galaxy.js
// three.js objects for the galaxy: one Points for stars, one for gas, a backdrop of far stars
// and a sky dome. All motion happens in the vertex shader, so a frame costs four draw calls
// and no per-particle JavaScript.

const SKY_RADIUS = 1800;

function wrapUniforms(values) {
  const uniforms = {};
  for (const key of Object.keys(values)) {
    const value = values[key];
    uniforms[key] = { value: Array.isArray(value) ? new THREE.Vector3(value[0], value[1], value[2]) : value };
  }
  return uniforms;
}

function pointsGeometry(layer) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(layer.position, 3));
  geometry.setAttribute('aColor', new THREE.BufferAttribute(layer.color, 3));
  geometry.setAttribute('aParams', new THREE.BufferAttribute(layer.params, 4));
  return geometry;
}

function spriteMaterial(uniforms, vertexShader) {
  return new THREE.ShaderMaterial({
    uniforms,
    vertexShader,
    fragmentShader: SPRITE_FRAGMENT,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false,
    depthTest: false,
  });
}

function spritePoints(material, renderOrder) {
  const points = new THREE.Points(new THREE.BufferGeometry(), material);
  // `position` stores orbit parameters, so a bounding sphere computed from it is meaningless.
  points.frustumCulled = false;
  points.renderOrder = renderOrder;
  return points;
}

class Galaxy {
  constructor(config) {
    this.config = config;
    this.counts = null;
    this.pulse = [0, 0, 0];

    const values = orbitUniformValues(config);
    // Star and gas materials reference the same uniform objects, so one write moves both.
    this.shared = wrapUniforms(values.shared);
    this.starUniforms = Object.assign({}, this.shared, wrapUniforms(values.stars));
    this.dustUniforms = Object.assign({}, this.shared, wrapUniforms(values.dust));
    this.backdropUniforms = Object.assign(
      { uClock: this.shared.uClock, uTwinkle: this.shared.uTwinkle, uSoft: { value: 0 } },
      wrapUniforms(values.backdrop)
    );
    this.skyUniforms = Object.assign({ uClock: this.shared.uClock }, wrapUniforms(values.sky));

    this.root = new THREE.Group();
    this.disc = new THREE.Group();
    this.disc.rotation.set(config.galaxy.tilt[0], config.galaxy.tilt[1], config.galaxy.tilt[2]);
    // The sky follows the camera so zooming never reaches the backdrop.
    this.sky = new THREE.Group();
    this.root.add(this.sky, this.disc);

    this.dust = spritePoints(spriteMaterial(this.dustUniforms, ORBIT_VERTEX), 0);
    this.stars = spritePoints(spriteMaterial(this.starUniforms, ORBIT_VERTEX), 1);
    this.disc.add(this.dust, this.stars);

    this.backdrop = spritePoints(spriteMaterial(this.backdropUniforms, BACKDROP_VERTEX), -2);
    this.dome = new THREE.Mesh(
      new THREE.SphereGeometry(SKY_RADIUS, 48, 24),
      new THREE.ShaderMaterial({
        uniforms: this.skyUniforms,
        vertexShader: SKY_VERTEX,
        fragmentShader: SKY_FRAGMENT,
        side: THREE.BackSide,
        depthWrite: false,
        depthTest: false,
      })
    );
    this.dome.frustumCulled = false;
    this.dome.renderOrder = -3;
    this.sky.add(this.dome, this.backdrop);
  }

  // Regenerates every particle buffer. Called at start and when the seed or density changes.
  build(seed, density) {
    const data = generateGalaxy(this.config, seed, density);
    for (const [points, layer] of [[this.stars, data.stars], [this.dust, data.dust], [this.backdrop, data.backdrop]]) {
      points.geometry.dispose();
      points.geometry = pointsGeometry(layer);
    }
    this.counts = data.counts;
    return data.counts;
  }

  get particleCount() {
    const c = this.counts;
    return c ? c.bulge + c.disc + c.young + c.hii + c.dust + c.backdrop : 0;
  }

  update(simTime, clock, pulseAge, camera) {
    this.shared.uTime.value = simTime;
    this.shared.uClock.value = clock;
    pulseState(this.config, pulseAge, this.pulse);
    this.shared.uPulse.value.set(this.pulse[0], this.pulse[1], this.pulse[2]);
    this.sky.position.copy(camera.position);
  }

  setViewport(drawingBufferHeight, pixelRatio, fov) {
    const look = this.config.look;
    this.shared.uPixelScale.value = pixelScale(drawingBufferHeight, fov);
    this.starUniforms.uMaxPoint.value = look.starMaxPointPx * pixelRatio;
    this.dustUniforms.uMaxPoint.value = look.dustMaxPointFraction * drawingBufferHeight;
    this.backdropUniforms.uPointScale.value = pixelRatio;
  }

  // Copies the live GUI values onto the uniforms. Runs on change, not per frame.
  applyParams(params) {
    this.shared.uTwist.value = params.twist;
    this.shared.uArmSpread.value = params.armSpread;
    this.shared.uArmContrast.value = params.armContrast;
    this.shared.uTwinkle.value = params.reducedMotion ? 0 : this.config.look.twinkle;
    this.starUniforms.uSizeScale.value = params.starSize;
    this.starUniforms.uBrightness.value = params.starBrightness;
    this.dustUniforms.uBrightness.value = params.dustBrightness;
    this.backdropUniforms.uBrightness.value = params.starBrightness;
    this.skyUniforms.uIntensity.value = params.skyIntensity;
  }

  dispose() {
    for (const object of [this.stars, this.dust, this.backdrop, this.dome]) {
      object.geometry.dispose();
      object.material.dispose();
    }
    this.root.removeFromParent();
  }
}

// ---- src/input.js
// Turns keyboard, mouse and touch events into intents. Nothing else in the demo reads raw
// input (camera orbiting is the one exception: OrbitControls owns the canvas pointer).
const KEYMAP = {
  Space: 'togglePause',
  KeyF: 'pulse',
  KeyR: 'resetView',
  KeyH: 'toggleHud',
};

function createInput(canvas, onIntent) {
  function onKeyDown(event) {
    if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
    // Typing in the parameter panel must not trigger shortcuts, and a focused button already
    // activates itself on Space.
    const tag = event.target && event.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON') return;
    const intent = KEYMAP[event.code];
    if (!intent) return;
    event.preventDefault();
    onIntent(intent);
  }

  function onDoubleClick() {
    onIntent('pulse');
  }

  function onClick(event) {
    const button = event.target && event.target.closest ? event.target.closest('[data-intent]') : null;
    if (!button) return;
    onIntent(button.dataset.intent);
    // Drop focus so the next Space press goes to the shortcut, not back to this button.
    button.blur();
  }

  window.addEventListener('keydown', onKeyDown);
  canvas.addEventListener('dblclick', onDoubleClick);
  document.addEventListener('click', onClick);

  return {
    dispose() {
      window.removeEventListener('keydown', onKeyDown);
      canvas.removeEventListener('dblclick', onDoubleClick);
      document.removeEventListener('click', onClick);
    },
  };
}

// ---- src/ui.js
// DOM overlay: the parameter panel is generated from the table below, the buttons in the
// page template carry data-intent attributes and are handled by input.js.

const fixed2 = (v) => v.toFixed(2);

const CONTROLS = [
  { key: 'timeScale', label: '流速', type: 'range', min: 0, max: CONFIG.flow.maxTimeScale, step: 0.05, format: (v) => `${v.toFixed(2)}×` },
  {
    key: 'density',
    label: '粒子密度',
    type: 'select',
    options: [['low', '低'], ['medium', '中'], ['high', '高'], ['ultra', '极高']],
  },
  { key: 'twist', label: '旋臂缠绕', type: 'range', min: 1.5, max: 6, step: 0.05, format: fixed2 },
  { key: 'armSpread', label: '旋臂宽度', type: 'range', min: 0.05, max: 0.9, step: 0.01, format: fixed2 },
  { key: 'armContrast', label: '旋臂对比', type: 'range', min: 0, max: 1, step: 0.01, format: fixed2 },
  { key: 'starSize', label: '星点大小', type: 'range', min: 0.5, max: 2, step: 0.01, format: fixed2 },
  { key: 'starBrightness', label: '星光亮度', type: 'range', min: 0.2, max: 2.5, step: 0.01, format: fixed2 },
  { key: 'dustBrightness', label: '星云亮度', type: 'range', min: 0, max: 3, step: 0.01, format: fixed2 },
  { key: 'skyIntensity', label: '背景星云', type: 'range', min: 0, max: 3, step: 0.01, format: fixed2 },
  { key: 'bloomStrength', label: '辉光', type: 'range', min: 0, max: 1.5, step: 0.01, format: fixed2 },
  { key: 'exposure', label: '曝光', type: 'range', min: 0.4, max: 2.5, step: 0.01, format: fixed2 },
  { key: 'autoRotate', label: '自动环绕', type: 'checkbox' },
  { key: 'reducedMotion', label: '减弱动态（关闭闪烁与镜头动画）', type: 'checkbox' },
];

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function buildControl(spec, params, onChange) {
  const row = element('label', `control control-${spec.type}`);
  const name = element('span', 'control-name', spec.label);
  let input;
  let readout = null;
  let eventName = 'change';
  let read;

  if (spec.type === 'range') {
    input = element('input');
    input.type = 'range';
    input.min = String(spec.min);
    input.max = String(spec.max);
    input.step = String(spec.step);
    input.value = String(params[spec.key]);
    readout = element('span', 'control-value', spec.format(params[spec.key]));
    eventName = 'input';
    read = () => Number(input.value);
    row.append(name, input, readout);
  } else if (spec.type === 'select') {
    input = element('select');
    for (const [value, label] of spec.options) {
      const option = element('option', '', label);
      option.value = value;
      input.append(option);
    }
    input.value = params[spec.key];
    read = () => input.value;
    row.append(name, input);
  } else {
    input = element('input');
    input.type = 'checkbox';
    input.checked = Boolean(params[spec.key]);
    read = () => input.checked;
    row.append(input, name);
  }

  const listener = () => {
    const value = read();
    if (readout) readout.textContent = spec.format(value);
    onChange(spec.key, value);
  };
  input.addEventListener(eventName, listener);
  return { row, dispose: () => input.removeEventListener(eventName, listener) };
}

// `dom` holds the overlay elements of the page: { root, panel, stats, pauseButton, notice }.
function createUi(dom, params, onChange) {
  const controls = CONTROLS.map((spec) => buildControl(spec, params, onChange));
  for (const control of controls) dom.panel.append(control.row);

  return {
    setPaused(paused) {
      dom.pauseButton.textContent = paused ? '继续' : '暂停';
      dom.pauseButton.setAttribute('aria-pressed', String(paused));
      dom.root.classList.toggle('is-paused', paused);
    },

    togglePanel() {
      const open = dom.root.classList.toggle('panel-open');
      dom.panel.setAttribute('aria-hidden', String(!open));
    },

    toggleHud() {
      dom.root.classList.toggle('hud-hidden');
    },

    setStats(text) {
      dom.stats.textContent = text;
    },

    // An empty message hides the notice.
    setNotice(text) {
      dom.notice.textContent = text;
      dom.notice.hidden = text === '';
    },

    dispose() {
      for (const control of controls) {
        control.dispose();
        control.row.remove();
      }
    },
  };
}

// ---- src/camera-path.js
// Scripted camera moves (intro fly-in, "reset view") as plain math on spherical coordinates
// around the galaxy centre. No three.js types, so the offline tools can test it under Node.
// Convention matches THREE.Spherical: polar is measured from +Y, azimuth from +Z towards +X.
const TWO_PI = Math.PI * 2;

function easeOutCubic(t) {
  const u = 1 - t;
  return 1 - u * u * u;
}

function easeInOutCubic(t) {
  if (t < 0.5) return 4 * t * t * t;
  const u = 2 - 2 * t;
  return 1 - (u * u * u) / 2;
}

function toSpherical(x, y, z, out) {
  const radius = Math.sqrt(x * x + y * y + z * z);
  out.radius = radius;
  out.polar = radius > 0 ? Math.acos(Math.min(Math.max(y / radius, -1), 1)) : 0;
  out.azimuth = Math.atan2(x, z);
  return out;
}

function fromSpherical(pose, out) {
  const ring = pose.radius * Math.sin(pose.polar);
  out[0] = ring * Math.sin(pose.azimuth);
  out[1] = pose.radius * Math.cos(pose.polar);
  out[2] = ring * Math.cos(pose.azimuth);
  return out;
}

// Narrow windows see less of the disc at the same distance, so the resting pose backs off
// until the disc fits the width again.
function homePose(cameraConfig, aspect, out) {
  const home = cameraConfig.home;
  out.radius = Math.min(home.radius * Math.max(1, cameraConfig.fitAspect / aspect), cameraConfig.maxDistance);
  out.polar = home.polar;
  out.azimuth = home.azimuth;
  return out;
}

function createCameraPath() {
  const from = { radius: 1, polar: 0, azimuth: 0 };
  const to = { radius: 1, polar: 0, azimuth: 0 };
  const pose = { radius: 1, polar: 0, azimuth: 0 };
  let elapsed = 0;
  let duration = 0;
  let ease = easeOutCubic;
  let active = false;

  return {
    get active() {
      return active;
    },

    begin(start, end, seconds, easing) {
      from.radius = start.radius;
      from.polar = start.polar;
      from.azimuth = start.azimuth;
      to.radius = end.radius;
      to.polar = end.polar;
      // Go the short way round instead of unwinding a full turn.
      let turn = (end.azimuth - start.azimuth) % TWO_PI;
      if (turn > Math.PI) turn -= TWO_PI;
      if (turn < -Math.PI) turn += TWO_PI;
      to.azimuth = start.azimuth + turn;
      elapsed = 0;
      duration = seconds;
      ease = easing;
      active = true;
    },

    cancel() {
      active = false;
    },

    // Writes the camera position for this frame into `out` ([x, y, z]); the caller aims the
    // camera at the origin. Returns false once the move has finished.
    update(dt, out) {
      if (!active) return false;
      elapsed += dt;
      const t = duration > 0 ? Math.min(elapsed / duration, 1) : 1;
      const k = ease(t);
      pose.radius = from.radius + (to.radius - from.radius) * k;
      pose.polar = from.polar + (to.polar - from.polar) * k;
      pose.azimuth = from.azimuth + (to.azimuth - from.azimuth) * k;
      fromSpherical(pose, out);
      if (t >= 1) active = false;
      return true;
    },
  };
}

// ---- src/main.js
// Scene assembly and the frame loop. By the time this module is evaluated, loader.js has
// already confirmed WebGL2 and found a three.js to import.

const STATS_INTERVAL = 0.5;
// How quickly the flow eases to a stop or back to speed when pausing (1/s).
const FLOW_RESPONSE = 6;

function initialParams() {
  const coarse = window.matchMedia('(pointer: coarse)').matches;
  return {
    timeScale: CONFIG.flow.timeScale,
    // Phones and tablets start lighter; the panel can raise it.
    density: coarse ? 'medium' : 'high',
    twist: CONFIG.galaxy.twist,
    armSpread: CONFIG.galaxy.armSpread,
    armContrast: CONFIG.galaxy.armContrast,
    starSize: CONFIG.look.starSize,
    starBrightness: CONFIG.look.starBrightness,
    dustBrightness: CONFIG.look.dustBrightness,
    skyIntensity: CONFIG.look.skyIntensity,
    bloomStrength: CONFIG.bloom.strength,
    exposure: CONFIG.look.exposure,
    autoRotate: true,
    reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  };
}

// `dom`: { canvas, root, panel, stats, pauseButton, notice }, the elements of the page template.
function start(dom) {
  const params = initialParams();
  let seed = CONFIG.seed;
  let state = 'running'; // 'running' | 'paused'
  let simTime = 0;
  let clock = 0;
  let flowRate = params.timeScale;
  let pulseAge = -1;
  let lastTime = -1;
  let statsTimer = 0;
  let statsFrames = 0;

  const renderer = new THREE.WebGLRenderer({ canvas: dom.canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = params.exposure;
  // The composer renders several passes per frame; reset the counters once per frame instead
  // of once per pass so the stats line shows the whole frame.
  renderer.info.autoReset = false;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, 1, CONFIG.camera.near, CONFIG.camera.far);

  const galaxy = new Galaxy(CONFIG);
  scene.add(galaxy.root);
  galaxy.build(seed, CONFIG.density[params.density]);
  galaxy.applyParams(params);

  // The sprites are written in linear HDR; the OutputPass at the end of the chain applies the
  // renderer's tone mapping and the sRGB transfer, so everything always goes through it.
  const composer = new EffectComposer(renderer);
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), params.bloomStrength, CONFIG.bloom.radius, CONFIG.bloom.threshold);
  const passes = [new RenderPass(scene, camera), bloom, new OutputPass()];
  for (const pass of passes) composer.addPass(pass);

  const controls = new OrbitControls(camera, dom.canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minDistance = CONFIG.camera.minDistance;
  controls.maxDistance = CONFIG.camera.maxDistance;
  controls.autoRotateSpeed = CONFIG.camera.autoRotateSpeed;
  controls.autoRotate = params.autoRotate && !params.reducedMotion;

  const cameraPath = createCameraPath();
  const home = { radius: 1, polar: 0, azimuth: 0 };
  const current = { radius: 1, polar: 0, azimuth: 0 };
  const eye = [0, 0, 0];
  const bufferSize = new THREE.Vector2();

  function placeCamera(pose) {
    fromSpherical(pose, eye);
    camera.position.set(eye[0], eye[1], eye[2]);
    camera.lookAt(0, 0, 0);
  }

  function resize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    if (width === 0 || height === 0) return;
    const pixelRatio = Math.min(window.devicePixelRatio || 1, CONFIG.render.maxPixelRatio);
    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(width, height);
    composer.setPixelRatio(pixelRatio);
    composer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.getDrawingBufferSize(bufferSize);
    galaxy.setViewport(bufferSize.y, pixelRatio, camera.fov);
    homePose(CONFIG.camera, camera.aspect, home);
  }

  function flyHome(duration, easing) {
    if (params.reducedMotion) {
      cameraPath.cancel();
      placeCamera(home);
      return;
    }
    toSpherical(camera.position.x, camera.position.y, camera.position.z, current);
    cameraPath.begin(current, home, duration, easing);
  }

  const ui = createUi(dom, params, (key, value) => {
    params[key] = value;
    if (key === 'density') {
      galaxy.build(seed, CONFIG.density[value]);
    } else if (key === 'bloomStrength') {
      bloom.strength = value;
      // A zero-strength bloom still costs its blur passes.
      bloom.enabled = value > 0;
    } else if (key === 'exposure') {
      renderer.toneMappingExposure = value;
    } else if (key === 'autoRotate' || key === 'reducedMotion') {
      controls.autoRotate = params.autoRotate && !params.reducedMotion;
      if (params.reducedMotion) cameraPath.cancel();
    }
    galaxy.applyParams(params);
  });

  const intents = {
    togglePause() {
      state = state === 'running' ? 'paused' : 'running';
      ui.setPaused(state === 'paused');
    },
    pulse() {
      pulseAge = 0;
    },
    resetView() {
      flyHome(CONFIG.camera.resetDuration, easeInOutCubic);
    },
    reseed() {
      // Any 32-bit integer is a valid seed; stepping by the golden-ratio constant keeps
      // successive galaxies unrelated while staying reproducible from CONFIG.seed.
      seed = (seed + 0x9e3779b9) >>> 0;
      galaxy.build(seed, CONFIG.density[params.density]);
      pulseAge = 0;
    },
    togglePanel() {
      ui.togglePanel();
    },
    toggleHud() {
      ui.toggleHud();
    },
  };
  const input = createInput(dom.canvas, (intent) => {
    if (intents[intent]) intents[intent]();
  });

  // three.js only logs a failed shader, which would leave a black page with no explanation.
  renderer.debug.onShaderError = (gl, program, vertexShader, fragmentShader) => {
    const log = [gl.getProgramInfoLog(program), gl.getShaderInfoLog(vertexShader), gl.getShaderInfoLog(fragmentShader)]
      .filter(Boolean)
      .join('\n');
    console.error(`shader failed to compile or link\n${log}`);
    ui.setNotice(`着色器编译失败，画面可能不完整：\n${log.slice(0, 400)}`);
  };

  // Grabbing the camera always wins over a scripted move.
  const onControlStart = () => cameraPath.cancel();
  controls.addEventListener('start', onControlStart);

  const onContextLost = () => ui.setNotice('图形上下文丢失，正在等待浏览器恢复…');
  const onContextRestored = () => ui.setNotice('');
  dom.canvas.addEventListener('webglcontextlost', onContextLost);
  dom.canvas.addEventListener('webglcontextrestored', onContextRestored);
  window.addEventListener('resize', resize);

  // The orbits are closed-form functions of time, so there is no integrator to keep stable
  // and no need for a fixed-step accumulator: advancing by any dt gives the same result.
  function advance(dt) {
    clock += dt;
    const targetRate = state === 'running' ? params.timeScale : 0;
    flowRate += (targetRate - flowRate) * (1 - Math.exp(-FLOW_RESPONSE * dt));
    simTime += flowRate * dt;

    if (pulseAge >= 0) {
      pulseAge += dt;
      if (pulseAge >= CONFIG.pulse.duration) pulseAge = -1;
    }

    if (cameraPath.update(dt, eye)) {
      camera.position.set(eye[0], eye[1], eye[2]);
      camera.lookAt(0, 0, 0);
    } else {
      controls.update(dt);
    }
    galaxy.update(simTime, clock, pulseAge, camera);
  }

  function render() {
    renderer.info.reset();
    composer.render();
  }

  function updateStats(dt) {
    statsTimer += dt;
    statsFrames += 1;
    if (statsTimer < STATS_INTERVAL) return;
    const fps = Math.round(statsFrames / statsTimer);
    const particles = (galaxy.particleCount / 10000).toFixed(1);
    ui.setStats(`${particles} 万粒子 · ${fps} FPS · ${renderer.info.render.calls} draw calls`);
    statsTimer = 0;
    statsFrames = 0;
  }

  function frame(timeMs) {
    const now = timeMs * 0.001;
    if (lastTime < 0) lastTime = now;
    const elapsed = Math.max(now - lastTime, 0);
    lastTime = now;
    // A background tab hands back one huge delta on return; cap it so the flow never jumps.
    advance(Math.min(elapsed, CONFIG.loop.maxDelta));
    render();
    updateStats(elapsed);
  }

  resize();
  ui.setPaused(false);
  if (params.reducedMotion) {
    placeCamera(home);
  } else {
    placeCamera(CONFIG.camera.intro);
    cameraPath.begin(CONFIG.camera.intro, home, CONFIG.camera.intro.duration, easeOutCubic);
  }
  renderer.setAnimationLoop(frame);

  return {
    renderer,
    scene,
    camera,
    galaxy,
    params,
    intents,
    // Deterministic stepping and a state snapshot for tests and console debugging.
    advance,
    render,
    snapshot() {
      return {
        state,
        seed,
        simTime,
        clock,
        flowRate,
        pulseAge,
        cameraMoving: cameraPath.active,
        counts: galaxy.counts,
        drawCalls: renderer.info.render.calls,
      };
    },
    dispose() {
      renderer.setAnimationLoop(null);
      window.removeEventListener('resize', resize);
      dom.canvas.removeEventListener('webglcontextlost', onContextLost);
      dom.canvas.removeEventListener('webglcontextrestored', onContextRestored);
      controls.removeEventListener('start', onControlStart);
      input.dispose();
      ui.dispose();
      controls.dispose();
      galaxy.dispose();
      for (const pass of passes) pass.dispose();
      composer.dispose();
      renderer.dispose();
    },
  };
}

// ---- src/boot.js
// Entry of the app bundle. loader.js injects the bundle as a module script once three.js is
// resolvable; an exception thrown from here reaches loader.js's error handler, which shows it
// on the page.

const dom = {
  canvas: document.getElementById('scene'),
  root: document.getElementById('overlay'),
  panel: document.getElementById('panel'),
  stats: document.getElementById('stats'),
  pauseButton: document.getElementById('pause'),
  notice: document.getElementById('notice'),
};

// Handle for console debugging and automated checks: __galaxy.snapshot(), .advance(dt), …
window.__galaxy = start(dom);
dom.notice.hidden = true;
    </script>
    <script>
// Classic (non-module) script, inlined into the page by tools/build_html.py. It decides where
// three.js comes from and only then starts the app, so the page works when opened straight
// from disk (file://):
//   - three.js embedded in the page by the build  -> served from blob: URLs, fully offline;
//   - otherwise                                   -> the first CDN that answers.
// Either way the result is an import map, which has to exist before any module is loaded;
// that is why the app bundle sits in an inert script element and is injected afterwards.
(function () {
  'use strict';

  var PROBE_TIMEOUT_MS = 6000;
  var notice = document.getElementById('notice');
  var overlay = document.getElementById('overlay');

  function show(message) {
    notice.textContent = message;
    notice.hidden = false;
  }

  function fail(message) {
    overlay.classList.add('has-error');
    show(message);
  }

  function describe(error) {
    return error && error.message ? error.message : String(error);
  }

  // Anything thrown while the app starts would otherwise leave a black page.
  window.addEventListener('error', function (event) {
    if (window.__galaxy) return;
    fail('启动失败：' + (event.message || describe(event.error)) + '\n\n请打开浏览器控制台（F12）查看详细报错。');
  });

  function hasWebGL2() {
    var probe = document.createElement('canvas').getContext('webgl2');
    if (!probe) return false;
    // Browsers cap the number of live contexts; hand this one back right away.
    var lose = probe.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
    return true;
  }

  // Modules the build embedded as base64, keyed by the specifier they must answer to.
  function embeddedImports() {
    var nodes = document.querySelectorAll('script[type="application/x-embedded-module"]');
    if (!nodes.length) return null;
    var imports = {};
    for (var i = 0; i < nodes.length; i++) {
      var binary = atob(nodes[i].textContent.replace(/\s+/g, ''));
      var bytes = new Uint8Array(binary.length);
      for (var j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
      imports[nodes[i].dataset.specifier] = URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' }));
    }
    return imports;
  }

  function probe(source) {
    var abort = new AbortController();
    var timer = setTimeout(function () {
      abort.abort();
    }, PROBE_TIMEOUT_MS);
    return fetch(source.three, { method: 'HEAD', mode: 'cors', signal: abort.signal }).then(
      function (response) {
        clearTimeout(timer);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return source;
      },
      function (error) {
        clearTimeout(timer);
        throw error;
      }
    );
  }

  // Resolves with whichever source answers first; rejects only when none of them does.
  function firstReachable(sources) {
    return new Promise(function (resolve, reject) {
      var pending = sources.length;
      if (!pending) reject(new Error('no source configured'));
      sources.forEach(function (source) {
        probe(source).then(resolve, function () {
          pending -= 1;
          if (!pending) reject(new Error('no source reachable'));
        });
      });
    });
  }

  function launch(imports) {
    var map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({ imports: imports });
    document.head.appendChild(map);

    var app = document.createElement('script');
    app.type = 'module';
    app.textContent = document.getElementById('app-source').textContent;
    // Fires when a module of the import graph cannot be fetched or parsed.
    app.addEventListener('error', function () {
      fail('three.js 的模块没有加载成功。\n请检查网络后刷新；详细报错见浏览器控制台（F12）。');
    });
    document.head.appendChild(app);
  }

  function boot() {
    if (!hasWebGL2()) {
      fail('当前浏览器不支持 WebGL2，无法显示这个场景。\n请换用新版 Chrome / Edge / Firefox / Safari，并确认硬件加速已开启。');
      return;
    }

    var embedded = embeddedImports();
    if (embedded) {
      launch(embedded);
      return;
    }

    var settings = JSON.parse(document.getElementById('three-source').textContent);
    show('正在加载 three.js…');
    firstReachable(settings.cdn).then(
      function (source) {
        launch({ three: source.three, 'three/addons/': source.addons });
      },
      function () {
        var hosts = settings.cdn.map(function (source) {
          return new URL(source.three).host;
        });
        fail(
          '没有加载到 three.js ' + settings.version + '。\n\n' +
            '这个页面没有内嵌 three.js，需要联网从 CDN 获取，已尝试：\n' + hosts.join('、') + '\n\n' +
            '解决办法（二选一）：\n' +
            '1. 让这台电脑能访问上述任一站点，然后刷新；\n' +
            '2. 用 three-' + settings.version + '.tgz 重新生成内嵌 three.js 的离线版本，见 README.md。'
        );
      }
    );
  }

  try {
    boot();
  } catch (error) {
    fail('启动失败：' + describe(error));
  }
})();
    </script>
